<!doctype html>
<html lang="en" data-fx="own">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Databases</title>
<style>
/* Databases: the unit's working workbooks (from the DAR DATABASE DIRECTORY sheet) on PCs and phones.
   Everyone with a key views and searches; the head and admin edit cells. Backend: backend/databases.gs.
   Last-opened tabs are kept on this device (IndexedDB) so they can be read with no signal. Edits made with no connection
   are kept on this device (localStorage "db.outbox") and sent when it is back; a row changed on the Sheet meanwhile is a conflict. */
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#15171a; --muted:#666a70; --line:#e1dfd9; --hover:#efede7; --field:#ffffff;
  --accent:#b8860b; --accent-ink:#ffffff; --accent-soft:#f7efd9; --cy:#0e7490; --cy-soft:#dff3f7;
  --ok:#1d7a43; --ok-bg:#e3f2e8; --bad:#b3261e; --bad-bg:#fbe7e4; --warn:#8f5b00; --warn-bg:#fbf0d9;
  --accent-rgb:184,134,11; --cy-rgb:14,116,144; --glass:rgba(255,255,255,.74); --grid:rgba(120,100,40,.08);
  --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-lg:0 18px 50px rgba(0,0,0,.22);
  --font:"Inter","IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0c0e; --panel:#15171a; --ink:#ecebe8; --muted:#9a9da2; --line:#272a2e; --hover:#1d1f23; --field:#101114;
  --accent:#e0b03c; --accent-ink:#17130a; --accent-soft:#2a230f; --cy:#4fd6ea; --cy-soft:#0d2a30;
  --ok:#5fcf8c; --ok-bg:#14271b; --bad:#f2877d; --bad-bg:#331714; --warn:#e3b24f; --warn-bg:#2e2310;
  --accent-rgb:224,176,60; --cy-rgb:79,214,234; --glass:rgba(21,23,26,.66); --grid:rgba(224,176,60,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 18px 50px rgba(0,0,0,.65); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0b0c0e; --panel:#15171a; --ink:#ecebe8; --muted:#9a9da2; --line:#272a2e; --hover:#1d1f23; --field:#101114;
  --accent:#e0b03c; --accent-ink:#17130a; --accent-soft:#2a230f; --cy:#4fd6ea; --cy-soft:#0d2a30;
  --ok:#5fcf8c; --ok-bg:#14271b; --bad:#f2877d; --bad-bg:#331714; --warn:#e3b24f; --warn-bg:#2e2310;
  --accent-rgb:224,176,60; --cy-rgb:79,214,234; --glass:rgba(21,23,26,.66); --grid:rgba(224,176,60,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 18px 50px rgba(0,0,0,.65); color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);overflow:hidden}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* Background: drifting constellation of data points over a faint grid */
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;height:100dvh}

/* Top bar */
header.top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);position:relative}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--cy-rgb),.9),rgba(var(--accent-rgb),.9),transparent);opacity:.6}
.logo{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;color:var(--accent-ink);
  background:conic-gradient(from 210deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--cy)),var(--accent));box-shadow:0 0 18px rgba(var(--accent-rgb),.45)}
.logo svg{width:18px;height:18px}
h1{font-size:17px;margin:0;letter-spacing:.01em;white-space:nowrap;font-family:var(--mono);font-weight:600}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;font-size:13px;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none;white-space:nowrap;cursor:pointer}
.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;background:var(--glass)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;position:relative}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)} .dot.err{background:var(--bad)}
.dot.on::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok)}
.role{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;color:var(--cy);border-color:rgba(var(--cy-rgb),.45);background:var(--cy-soft)}
.ibtn{position:relative;overflow:hidden;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--glass);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.ibtn:hover{border-color:rgba(var(--cy-rgb),.6);box-shadow:0 0 14px rgba(var(--cy-rgb),.25)}
.ibtn svg{width:17px;height:17px}
.scan{position:absolute;left:0;bottom:-2px;height:2px;width:100%;overflow:hidden;pointer-events:none}
.scan i{position:absolute;top:0;height:100%;width:30%;background:linear-gradient(90deg,transparent,var(--cy),var(--accent),transparent)}

main{flex:1;min-height:0;overflow:auto;padding:22px 18px 28px}
.wrap{max-width:1240px;margin:0 auto}

/* Buttons, fields */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-weight:550;text-decoration:none;white-space:nowrap;color:inherit}
.btn:hover{border-color:rgba(var(--cy-rgb),.55);box-shadow:0 0 0 1px rgba(var(--cy-rgb),.12),0 6px 18px rgba(var(--cy-rgb),.14)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 84%,#fff),var(--accent));border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{box-shadow:0 8px 22px rgba(var(--accent-rgb),.4)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn svg{width:15px;height:15px}
.rip{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);background:radial-gradient(circle,rgba(var(--cy-rgb),.45),transparent 65%)}
input.f,select.f,textarea.f{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--field);padding:0 11px;min-width:0;width:100%}
textarea.f{height:auto;min-height:64px;padding:9px 11px;resize:vertical}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(var(--cy-rgb),.18),0 0 18px rgba(var(--cy-rgb),.18)}
label.l{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:34px}

/* Banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);margin-bottom:16px;border:1px solid;background:var(--glass)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad)} .banner.warn{background:var(--warn-bg);border-color:var(--warn)} .banner.ok{background:var(--ok-bg);border-color:var(--ok)}
.banner b{display:block;margin-bottom:2px}

/* Figures */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.fig{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden;min-width:0}
.fig::after{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,var(--cy),var(--accent));opacity:.8}
.fig .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fig .v{font-family:var(--mono);font-size:26px;font-weight:500;margin:4px 0 0;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(var(--cy-rgb),.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig .v.word{font-size:18px;font-family:var(--font);font-weight:650;margin-top:9px}
.fig .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Filters */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.pill{position:relative;overflow:hidden;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill:hover{color:var(--ink)}
.pill[aria-pressed="true"]{color:var(--accent-ink);background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--cy)));border-color:transparent;box-shadow:0 0 16px rgba(var(--accent-rgb),.35)}
.sect{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sect b{color:var(--cy);font-family:var(--mono);letter-spacing:0}

/* Holo cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:16px;perspective:1100px}
.card{position:relative;border-radius:var(--r);padding:18px;background:var(--glass);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:178px;color:inherit;
  -webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2);text-align:left;width:100%;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--ang,0deg),transparent 0 62%,rgba(var(--cy-rgb),.95) 72%,rgba(var(--accent-rgb),.95) 82%,transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(var(--cy-rgb),.16),transparent 65%)}
.card:hover{border-color:transparent;box-shadow:0 18px 40px rgba(0,0,0,.2),0 0 30px rgba(var(--cy-rgb),.12)}
.card:hover::before,.card:hover::after{opacity:1}
.card>*{position:relative}
.card .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;border:1px solid rgba(var(--accent-rgb),.45);color:var(--accent);background:var(--accent-soft);white-space:nowrap}
.tag.cy{border-color:rgba(var(--cy-rgb),.45);color:var(--cy);background:var(--cy-soft)}
.tag.dim{border-color:var(--line);color:var(--muted);background:var(--hover)}
.card h3{margin:0;font-size:16px;line-height:1.25}
.card p{margin:0;color:var(--muted);font-size:13px}
.keytabs{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.keytabs span{font-size:11.5px;font-family:var(--mono);padding:2px 7px;border-radius:5px;background:var(--hover);color:var(--muted)}
.card .go{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--cy)}
.card .go svg{width:14px;height:14px}
.card.nolink{cursor:default;opacity:.7}

/* Tab list */
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px}
.tabc{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass);cursor:pointer;text-align:left;width:100%;overflow:hidden;color:inherit}
.tabc:hover{border-color:rgba(var(--cy-rgb),.6);box-shadow:0 0 20px rgba(var(--cy-rgb),.15)}
.tabc.key{border-color:rgba(var(--accent-rgb),.55)}
.tabc .ti{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--cy-soft);color:var(--cy);flex:none}
.tabc.key .ti{background:var(--accent-soft);color:var(--accent)}
.tabc .ti svg{width:17px;height:17px}
.tabc b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabc small{color:var(--muted);font-size:12px}
.tabc .saved{margin-left:auto;font-size:10.5px;color:var(--ok);font-weight:700;letter-spacing:.04em;text-transform:uppercase}

/* Table view */
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbar select.f{width:auto;max-width:220px}
.count{font-size:12.5px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.count b{color:var(--ink);font-family:var(--mono)}
.prog{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin:0 0 10px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--accent));box-shadow:0 0 10px rgba(var(--cy-rgb),.8);transition:width .3s}
.tv{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:auto;height:calc(100dvh - 260px);min-height:320px}
.th,.tr{display:grid;grid-template-columns:var(--cols);min-width:max-content}
.th{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line)}
.th div{padding:0 10px;height:40px;display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;border-right:1px solid var(--line);box-shadow:inset 0 -2px 0 rgba(var(--cy-rgb),.35)}
.th div:hover{color:var(--ink)}
.th div.sorted{color:var(--cy);box-shadow:inset 0 -2px 0 var(--cy)}
.th .rn,.tr .rn{position:sticky;left:0;z-index:2;background:var(--panel);color:var(--muted);font-family:var(--mono);font-size:11.5px;justify-content:flex-end;cursor:default}
.tbody{position:relative}
.tr{position:absolute;left:0;height:36px;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.tr div{padding:0 10px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;border-right:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
.tr div.fx{color:var(--muted);font-style:italic}
.tr:hover{background:rgba(var(--cy-rgb),.07)}
.tr:hover .rn{color:var(--cy)}
.flash{animation:flash 1.8s ease-out}
mark{background:rgba(var(--accent-rgb),.3);color:inherit;border-radius:3px;padding:0 1px}
.nomatch{padding:40px 20px;text-align:center;color:var(--muted)}

/* Phone row cards */
.rcs{display:flex;flex-direction:column;gap:10px}
.rc{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--glass);padding:12px 14px 12px 16px;cursor:pointer;overflow:hidden;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.rc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--cy),var(--accent))}
.rc .h{display:flex;gap:8px;align-items:baseline}
.rc .h b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .h small{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:11px;flex:none}
.rc dl{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:2px 10px;margin:8px 0 0;font-size:12.5px}
.rc dt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.rc dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{display:flex;justify-content:center;padding:14px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:21;background:var(--panel);border-left:1px solid rgba(var(--cy-rgb),.4);box-shadow:var(--shadow-lg),-10px 0 40px rgba(var(--cy-rgb),.1);display:flex;flex-direction:column}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.drawer footer{display:flex;gap:8px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);align-items:center}
.fld{display:flex;flex-direction:column;gap:5px}
.fld .lb{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fld .lb .tag{font-size:9.5px;padding:1px 6px}
.fld .val{padding:9px 11px;border-radius:9px;background:var(--hover);min-height:38px;white-space:pre-wrap;word-break:break-word}
.fld.changed .f{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16)}
.chg{font-size:12.5px;color:var(--muted)}
.chg b{color:var(--accent);font-family:var(--mono)}

/* History */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--cy),var(--accent),transparent)}
.ev{position:relative;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--glass);margin-bottom:10px}
.ev::before{content:"";position:absolute;left:-20px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--cy);box-shadow:0 0 10px rgba(var(--cy-rgb),.7)}
.ev .m{font-size:12px;color:var(--muted)}
.ev .d{margin-top:4px;font-size:13px;word-break:break-word}
.ev .d s{color:var(--bad)}
.ev .d ins{color:var(--ok);text-decoration:none;font-weight:600}

/* Settings */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.panel h2{margin:0 0 12px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.people{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.person{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--hover)}
.person b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.keybox{font-family:var(--mono);font-size:20px;letter-spacing:.1em;padding:12px 14px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);text-align:center;margin:10px 0}
.empty{padding:46px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--glass)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;padding:10px 16px;border-radius:10px;background:var(--panel);border:1px solid rgba(var(--cy-rgb),.5);box-shadow:var(--shadow-lg),0 0 24px rgba(var(--cy-rgb),.2);font-weight:600;max-width:calc(100% - 32px)}

@media (max-width:760px){
  header.top{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));gap:8px;flex-wrap:wrap}
  .crumbs{order:9;flex-basis:100%}
  #net .lbl{display:none}
  main{padding:16px 16px 24px}
  .figs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fig .v{font-size:22px}
  .drawer{top:auto;height:min(88dvh,100%);width:100%;border-left:0;border-top:1px solid rgba(var(--cy-rgb),.4);border-radius:16px 16px 0 0}
  .tbar select.f{max-width:none;flex:1}
}

/* All motion here, so the system "reduce motion" setting switches it off */
@media (prefers-reduced-motion:no-preference){
  .btn,.ibtn,.pill,.tabc,.card{transition:box-shadow .2s,border-color .2s,background .15s,transform .25s cubic-bezier(.2,.7,.2,1)}
  .card::before,.card::after{transition:opacity .3s}
  .card:hover::before{animation:spin 3.5s linear infinite}
  .rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
  .rip{animation:rip .6s ease-out forwards}
  .scan i{animation:sweep 1.1s ease-in-out infinite}
  .dot.on::after{animation:ping 2.6s ease-out infinite}
  .drawer{animation:slide .28s cubic-bezier(.2,.7,.2,1)}
  .scrim,.toast{animation:fade .2s}
  .rc{animation:rise .35s cubic-bezier(.2,.7,.2,1) backwards}
}
@media (prefers-reduced-motion:no-preference) and (max-width:760px){ .drawer{animation:up .3s cubic-bezier(.2,.7,.2,1)} }
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes sweep{from{left:-30%}to{left:100%}}
@keyframes ping{0%{transform:scale(1);opacity:.8}70%,100%{transform:scale(2.8);opacity:0}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes flash{0%{background:rgba(var(--accent-rgb),.38);box-shadow:inset 3px 0 0 var(--accent)}100%{background:transparent}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"/><path d="M4.5 11.5v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"/></svg></span>
    <h1 id="title" aria-label="Databases">Databases</h1>
    <nav class="crumbs grow" id="crumbs" aria-label="Where you are"></nav>
    <span class="chip role" id="role" hidden></span>
    <button class="chip" id="obBtn" hidden title="Edits kept on this device, waiting to be sent to the Sheet"></button>
    <span class="chip" id="net"><span class="dot"></span><span class="lbl">…</span></span>
    <button class="ibtn" id="histBtn" title="Recent edits" aria-label="Recent edits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
    <button class="ibtn" id="refresh" title="Load again from Google Sheets" aria-label="Load again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="ibtn" id="setBtn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    <div class="scan" id="scan" hidden><i></i></div>
  </header>
  <main id="main"><div class="wrap" id="sheetChecks"></div><div class="wrap" id="view"></div></main>
</div>
<div id="drawerHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PHONE = () => matchMedia("(max-width:760px)").matches;
const fmt = n => Number(n || 0).toLocaleString("en-PH");
const ROWH = 36;
const ICO = {
  go:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  tab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
};

/* ---------- Settings and device storage ---------- */
// One sign-in for every app of the Survey Unit panel: the web app address and key in localStorage "aw.signin",
// shared by every app opened from the same site. Signing in here, in the panel or in any app signs in all of them.
function awSignin(url, key) {
  try {
    if (url !== undefined) localStorage.setItem("aw.signin", JSON.stringify({ url: url, key: key }));
    return JSON.parse(localStorage.getItem("aw.signin") || "null");
  } catch (e) { return null; }
}
function ls(k, v){ try{ if(v !== undefined) localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); return localStorage.getItem(k); }catch(e){ return null; } }
function lsJ(k, d){ try{ const v = JSON.parse(ls(k)); return v == null ? d : v; }catch(e){ return d; } }
const state = {
  cfg: Object.assign({ url:"", key:"", device:"" }, lsJ("db.cfg", {})),
  me: null, books: lsJ("db.books", []), booksAt: ls("db.booksAt") || "", people: [],
  tabs: lsJ("db.tabs", {}), saved: lsJ("db.savedTabs", {}), headerOverride: lsJ("db.header", {}),
  view: { name:"library" }, filter: { program:"", category:"", q:"" }, online: null, data: null
};
if(window.DB_HOSTED && window.DB_HOSTED.url) state.cfg.url = window.DB_HOSTED.url;
{ const si = awSignin(); if(si){ if(si.url && !window.DB_HOSTED) state.cfg.url = si.url; state.cfg.key = si.key || ""; } }
if(!state.cfg.device) state.cfg.device = (PHONE() ? "PHONE-" : "PC-") + Math.random().toString(36).slice(2, 7).toUpperCase();
function saveCfg(){ ls("db.cfg", { url:state.cfg.url, key:state.cfg.key, device:state.cfg.device }); }
saveCfg();

// IndexedDB keeps whole tabs (can be megabytes); falls back to memory if the browser refuses.
const idb = (() => {
  let dbp = null; const mem = {};
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(res => {
      try{ const r = indexedDB.open("survey-databases", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("tabs");
        r.onsuccess = () => res(r.result); r.onerror = () => res(null);
      }catch(e){ res(null); }
    });
    return dbp;
  }
  return {
    async get(k){ const db = await open(); if(!db) return mem[k]; return new Promise(res => { try{ const q = db.transaction("tabs").objectStore("tabs").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }catch(e){ res(mem[k]); } }); },
    async set(k, v){ const db = await open(); if(!db){ mem[k] = v; return; } return new Promise(res => { try{ const t = db.transaction("tabs", "readwrite"); t.objectStore("tabs").put(v, k); t.oncomplete = res; t.onerror = res; }catch(e){ mem[k] = v; res(); } }); }
  };
})();
function keep(d){
  return idb.set(d.key, { key:d.key, book:d.book, tab:d.tab, bookName:d.bookName, gid:d.gid, headerRow:d.headerRow, headers:d.headers, total:d.total, rows:d.rows, formulas:d.formulas, lists:d.lists, at:d.at, built:d.built || "" });
}

/* ---------- Server ---------- */
// The key is only ever sent to a Google Apps Script web app (or a test server on this PC).
const okAddr = u => /^https:\/\/script\.google\.com\/(a\/macros\/[\w.-]+|macros)\/s\/[\w-]+\/(exec|dev)$/.test(String(u || "")) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(String(u || ""));
async function api(method, payload){
  if(!state.cfg.url || !state.cfg.key) throw Object.assign(new Error("Not connected"), { setup:true });
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);
  scan(1);
  try{
    const u = state.cfg.url.trim();
    if(!okAddr(u)) throw new Error("The web app address in Settings is not a Google Apps Script address");
    let r;
    if(method === "GET") r = await fetch(u + (u.includes("?") ? "&" : "?") + new URLSearchParams(Object.assign({ key: state.cfg.key, app: "db" }, payload)), { redirect:"follow", signal:ctl.signal });
    else r = await fetch(u, { method:"POST", redirect:"follow", signal:ctl.signal, headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ key: state.cfg.key, device: state.cfg.device, app: "db" }, payload)) });
    const j = await r.json();
    setOnline(true);
    if(!j.ok) throw Object.assign(new Error(j.error || "The server refused"), { server:true });
    if(j.me) setMe(j.me);
    return j;
  }catch(e){
    if(!e.server && !e.setup) setOnline(false);
    throw e;
  }finally{ clearTimeout(timer); scan(-1); }
}
let scans = 0;
function scan(d){ scans = Math.max(0, scans + d); $("scan").hidden = !scans; }
function setOnline(on){ state.online = on; renderNet(); }
function setMe(me){ state.me = me; ls("db.me", { name:me.name, role:me.role, tag:keyTag(state.cfg.key) }); $("role").hidden = false; $("role").textContent = me.role; $("role").title = "Signed in as " + me.name; }
const canEdit = () => !!state.me && (state.me.role === "head" || state.me.role === "admin");
function renderNet(){
  const n = $("net"), on = state.online, off = on === false || !navigator.onLine;
  n.querySelector(".dot").className = "dot " + (on === true && navigator.onLine ? "on" : off ? "off" : "");
  n.querySelector(".lbl").textContent = on === true && navigator.onLine ? "Live" : off ? "Saved copy" : "Not connected";
  n.title = on === true ? "Connected to the Google Sheets" : off ? "No connection: showing what this device kept. Edits are kept here and sent when the connection is back." : (window.DB_HOSTED ? "Open Settings to connect" : "Sign in from the top bar of the panel");
  const w = state.outbox.filter(mine), c = w.filter(o => o.status !== "waiting").length, b = $("obBtn");
  b.hidden = !w.length;
  b.innerHTML = `<span class="dot ${c ? "off" : ""}"></span>${c ? c + " edit" + (c > 1 ? "s need" : " needs") + " you" : w.length + " edit" + (w.length > 1 ? "s" : "") + " to sync"}`;
}

/* ---------- Offline edits: kept on this device, sent when online ---------- */
// One item per row edited: the cells changed (with the value seen before the change, so the server can spot a conflict)
// and up to 3 unchanged "guard" cells of the same row, so an edit never lands on another row if rows were moved meanwhile.
// Items carry a tag of the key (never the key itself): they are sent only while the same person is signed in.
function keyTag(k){ let h = 2166136261; for(const ch of String(k || "")){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
state.outbox = lsJ("db.outbox", []);
{ const m = lsJ("db.me", null); if(m && state.cfg.key && m.tag === keyTag(state.cfg.key)) state.me = { name:m.name, role:m.role }; }
const mine = o => o.tag === keyTag(state.cfg.key);
function saveOutbox(){ ls("db.outbox", state.outbox); renderNet(); }
const isOffline = () => !navigator.onLine || state.online === false;
function guardCells(d, i, cells){
  const r = d.rows[i], out = [];
  for(let j = 0; j < d.headers.length && out.length < 3; j++){
    const v = r[j] || "";
    if(!v || d.fset.has(i + "," + j) || (d.lists[j] && d.lists[j].length) || cells.some(c => c.col === j + 1)) continue;
    out.push({ col:j + 1, header:d.headers[j], old:v, value:v });
  }
  return out;
}
const sendCells = o => o.cells.map(c => ({ col:c.col, header:c.header, old:c.old, value:c.value })).concat(o.guards.filter(g => !o.cells.some(c => c.col === g.col)));
function setCell(d, i, col, v){ if(!d.rows[i]) return; d.rows[i][col - 1] = v; if(d.text) d.text[i] = d.rows[i].join("\u0001").toLowerCase(); }
// Show this person's waiting edits over a tab just read (from the Sheet or from the device copy).
function overlay(d){
  state.outbox.forEach(o => { if(!mine(o) || o.key !== d.key || o.headerRow !== d.headerRow) return; const i = o.row - d.headerRow - 1; o.cells.forEach(c => setCell(d, i, c.col, c.value)); });
}
// Change the device copy of a tab without opening it.
async function patchKept(key, headerRow, i, fn){
  const cur = state.data && state.data.key === key ? state.data : null;
  if(cur){ if(cur.headerRow === headerRow){ fn(cur, i); keep(cur); } return; }
  const k = await idb.get(key); if(k && k.headerRow === headerRow && k.rows[i]){ fn(k, i); await idb.set(key, k); }
}
function queueEdit(i, cells){
  const d = state.data, row = d.headerRow + 1 + i, tag = keyTag(state.cfg.key), now = Date.now();
  let o = state.outbox.find(x => x.key === d.key && x.row === row && x.headerRow === d.headerRow && x.tag === tag);
  if(!o){
    o = { id: now.toString(36) + Math.random().toString(36).slice(2, 6), tag, key:d.key, book:d.book, tab:d.tab, bookName:d.bookName || "", headerRow:d.headerRow, row,
          cells:[], guards:guardCells(d, i, cells), at:new Date(now).toISOString(), status:"waiting" };
    state.outbox.push(o);
  }
  cells.forEach(c => { const e = o.cells.find(x => x.col === c.col); if(e){ e.value = c.value; e.t = now; } else o.cells.push({ col:c.col, header:c.header, old:c.old, value:c.value, t:now }); });
  o.guards = o.guards.filter(g => !o.cells.some(c => c.col === g.col));
  o.cells = o.cells.filter(c => c.value !== c.old);
  if(o.status === "refused"){ o.status = "waiting"; o.error = ""; }
  if(!o.cells.length) state.outbox.splice(state.outbox.indexOf(o), 1);
  cells.forEach(c => setCell(d, i, c.col, c.value));
  keep(d); saveOutbox();
  d.flash = i; closeDrawer(); tableBody(false);
  setTimeout(() => { if(d.flash === i) d.flash = undefined; }, 1900);
  return o;
}
let flushing = false;
async function flushOutbox(){
  const todo = state.outbox.filter(o => mine(o) && o.status === "waiting");
  if(flushing || !todo.length || !state.cfg.url || !state.cfg.key || !navigator.onLine) return;
  flushing = true;
  let saved = 0, need = 0;
  try{
    for(let k = 0; k < todo.length; k += 20){
      const part = todo.slice(k, k + 20), sentAt = Date.now();
      const j = await api("POST", { changes: part.map(o => ({ type:"edit", book:o.book, tab:o.tab, headerRow:o.headerRow, row:o.row, cells:sendCells(o) })) });
      j.results.forEach((res, n) => {
        const o = part[n]; if(!state.outbox.includes(o)) return;
        const i = o.row - o.headerRow - 1;
        if(res.result === "saved" || res.result === "same"){
          saved++;
          if(res.check_error) sheetWarn(res.check_error);
          const row = res.row || [];
          // Cells changed again while this was being sent stay, with the Sheet's new value as the one seen before.
          o.cells = o.cells.filter(c => c.t > sentAt); o.cells.forEach(c => c.old = row[c.col - 1] || "");
          o.guards.forEach(g => g.old = g.value = row[g.col - 1] || "");
          if(!o.cells.length) state.outbox.splice(state.outbox.indexOf(o), 1);
          patchKept(o.key, o.headerRow, i, (d, i) => { row.forEach((v, j) => { if(!o.cells.some(c => c.col === j + 1)) setCell(d, i, j + 1, v); }); });
        }else if(res.result === "conflict"){ need++; o.status = "conflict"; o.conflicts = res.conflicts; o.server = res.row; }
        else { need++; o.status = "refused"; o.error = res.error || "Refused"; }
      });
    }
  }catch(e){ if(e.server) toast("Edits not sent: " + e.message); }
  finally{ flushing = false; saveOutbox(); }
  if(saved || need) toast((saved ? "Sent " + saved + " kept edit" + (saved > 1 ? "s" : "") + " to the Sheets" : "") + (saved && need ? " · " : "") + (need ? need + " need you" : ""));
  if(state.data && state.view.name === "table") tableBody(false);
  if(need && $("obList")) outboxDrawer();
}
// Put the Sheet's values back for one item (its edit is dropped).
function dropItem(o, rowFromSheet){
  state.outbox.splice(state.outbox.indexOf(o), 1);
  const i = o.row - o.headerRow - 1;
  patchKept(o.key, o.headerRow, i, (d, i) => rowFromSheet ? d.headers.forEach((h, j) => setCell(d, i, j + 1, rowFromSheet[j] || "")) : o.cells.forEach(c => setCell(d, i, c.col, c.old)));
  saveOutbox(); if(state.data && state.view.name === "table") tableBody(false);
}
function outboxDrawer(){
  const list = state.outbox.filter(mine), others = state.outbox.length - list.length;
  const item = o => {
    const head = `<div class="m"><b>${esc(o.bookName || "Workbook")}</b> › ${esc(o.tab)} › row ${esc(o.row)} · ${esc(new Date(o.at).toLocaleString("en-PH"))}</div>`;
    const cells = o.cells.map(c => `<div class="d"><b>${esc(c.header)}</b>: <s>${esc(c.old || "blank")}</s> → <ins>${esc(c.value || "blank")}</ins></div>`).join("");
    let st = "";
    if(o.status === "conflict") st = `<div class="banner warn"><div class="grow"><b>Changed on the Sheet after you edited it</b>${(o.conflicts || []).map(c => `${esc(c.header)} is now “${esc(c.server || "blank")}”.`).join(" ")}
      If the names above are not the row you meant, the rows were moved: use the Sheet's values and edit it again.
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" data-theirs="${o.id}">Use the Sheet's values</button><button class="btn sm primary" data-mine="${o.id}">Save mine over them</button></div></div></div>`;
    else if(o.status === "refused") st = `<div class="banner bad"><div class="grow"><b>The Sheet refused it</b>${esc(o.error)}<div style="margin-top:10px"><button class="btn sm" data-drop="${o.id}">Discard this edit</button></div></div></div>`;
    else st = `<div class="muted" style="margin-top:6px">Waiting to send <button class="btn sm" data-drop="${o.id}" style="margin-left:8px">Discard</button></div>`;
    return `<div class="ev">${head}${cells}${st}</div>`;
  };
  drawer("Edits kept on this device",
    `<div id="obList">${list.length ? `<div class="tl">${list.map(item).join("")}</div>` : `<div class="empty"><b>Nothing waiting</b>All your edits are on the Sheets.</div>`}
     ${others ? `<p class="muted">${others} edit${others > 1 ? "s" : ""} made by another person on this device wait until they sign in here again.</p>` : ""}</div>`,
    `<span class="chg grow">${isOffline() ? "No connection: they are sent when it is back." : "Sent automatically when online."}</span><button class="btn" id="dCancel">Close</button><button class="btn primary" id="obSync" ${list.some(o => o.status === "waiting") && !isOffline() ? "" : "disabled"}>Send now</button>`);
  $("dCancel").onclick = closeDrawer;
  $("obSync").onclick = async () => { $("obSync").disabled = true; $("obSync").textContent = "Sending…"; await flushOutbox(); if($("obList")) outboxDrawer(); };
  const find = id => state.outbox.find(o => o.id === id);
  $("dBody").querySelectorAll("[data-drop]").forEach(b => b.onclick = () => { const o = find(b.dataset.drop); if(o) dropItem(o); outboxDrawer(); });
  $("dBody").querySelectorAll("[data-theirs]").forEach(b => b.onclick = () => { const o = find(b.dataset.theirs); if(o) dropItem(o, o.server); outboxDrawer(); });
  $("dBody").querySelectorAll("[data-mine]").forEach(b => b.onclick = async () => {
    const o = find(b.dataset.mine); if(!o) return;
    const row = o.server || [];
    o.cells.forEach(c => c.old = row[c.col - 1] || ""); o.guards.forEach(g => g.old = g.value = row[g.col - 1] || "");
    o.status = "waiting"; o.conflicts = null; saveOutbox();
    await flushOutbox(); if($("obList")) outboxDrawer();
  });
}
// Sheet checks: the backend read back a saved cell and the Sheet did not hold it. Stays on screen (and on this device)
// until dismissed, so it is not missed like a toast.
function sheetWarn(text){ const a = lsJ("db.checks", []); a.unshift({ t: new Date().toLocaleString(), text }); ls("db.checks", a.slice(0, 20)); drawChecks(); }
function drawChecks(){
  const el = $("sheetChecks"), a = lsJ("db.checks", []); if(!el) return;
  el.innerHTML = a.map((x, i) => `<div class="banner bad" role="alert"><div class="grow"><b>An edit did not go through to the Google Sheet</b>${esc(x.t)} · ${esc(x.text)}</div><button class="btn sm" data-dropcheck="${i}">Dismiss</button></div>`).join("");
  el.querySelectorAll("[data-dropcheck]").forEach(b => b.onclick = () => { const l = lsJ("db.checks", []); l.splice(+b.dataset.dropcheck, 1); ls("db.checks", l); drawChecks(); });
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 3200); }
function errText(e){ return e.setup ? (window.DB_HOSTED ? "Open Settings and enter your key." : "Sign in from the top bar of the Survey Unit panel.") : e.server ? e.message : "No connection to Google (" + (e.name === "AbortError" ? "took too long" : "offline or blocked") + ")."; }

/* ---------- Navigation ---------- */
function go(v){ state.view = v; closeDrawer(); render(); $("main").scrollTop = 0; }
function crumbs(){
  const v = state.view, parts = [`<a data-go="library">Library</a>`];
  const b = v.book && state.books.find(x => x.id === v.book);
  if(b && v.name !== "history") parts.push(v.name === "table" ? `<a data-go="book">${esc(b.name)}</a>` : `<b>${esc(b.name)}</b>`);
  if(v.name === "table") parts.push(`<b>${esc(v.tab)}</b>`);
  if(v.name === "history") parts.push("<b>Recent edits</b>");
  if(v.name === "settings") parts.push("<b>Settings</b>");

$("crumbs").addEventListener("click", e => {

});
$("setBtn").onclick = () => go({ name:"settings" });
$("histBtn").onclick = () => go({ name:"history", book: state.view.book || "" });

/* ---------- Library ---------- */
async function loadBooks(fresh){
  try{
    const j = await api("GET", { action:"books", fresh: fresh ? "1" : "" });
    state.books = j.books; state.booksAt = new Date().toISOString(); state.people = j.people || [];
    ls("db.books", state.books); ls("db.booksAt", state.booksAt);
    if(fresh) toast("Directory loaded again: " + j.books.length + " workbooks");
  }catch(e){ state.libError = e; }
  if(state.view.name === "library") renderLibrary();
}
function renderLibrary(){
  const f = state.filter, bks = state.books;

  else if(state.libError){ const e = state.libError; top = `<div class="banner ${e.server ? "bad" : "warn"} rise"><div class="grow"><b>${e.server ? "Could not load the Directory" : "Showing the list this device kept"}</b>${esc(errText(e))}${state.booksAt ? " List from " + new Date(state.booksAt).toLocaleString("en-PH") + "." : ""}</div></div>`; state.libError = null; }
  const groups = programs.length ? (f.program ? [f.program] : programs) : [""];
  const body = groups.map(g => {
    const list = shown.filter(b => !g || b.program === g);
    return list.length ? `<div class="sect">${esc(g || "Workbooks")} <b>${list.length}</b></div><div class="cards">${list.map((b, i) => card(b, i)).join("")}</div>` : "";
  }).join("");
  $("view").innerHTML = `${top}
    <div class="figs">
      <div class="fig rise" style="--i:0"><div class="k">Workbooks</div><div class="v" data-count="${bks.length}">0</div><div class="s">in the Directory</div></div>
      <div class="fig rise" style="--i:1"><div class="k">Programs</div><div class="v" data-count="${programs.length}">0</div><div class="s" title="${esc(programs.join(" · "))}">${esc(programs.join(" · ") || "—")}</div></div>
      <div class="fig rise" style="--i:2"><div class="k">Kept on device</div><div class="v" data-count="${savedN}">0</div><div class="s">tabs readable offline</div></div>
      <div class="fig rise" style="--i:3"><div class="k">You can</div><div class="v word">${state.me ? (canEdit() ? "View & edit" : "View") : "—"}</div><div class="s">${state.me ? esc(state.me.name) : "Not signed in"}</div></div>
    </div>
    <div class="bar">
      <div class="seg" role="group" aria-label="Program">${["", ...programs].map(p => `<button class="pill" data-prog="${esc(p)}" aria-pressed="${f.program === p}">${esc(p || "All programs")}</button>`).join("")}</div>
      <div class="search">${ICO.search}<input class="f" id="libQ" placeholder="Search workbooks, tabs, what they hold" value="${esc(f.q)}"></div>
    </div>
    ${cats.length > 1 ? `<div class="bar"><div class="seg" role="group" aria-label="Category">${["", ...cats].map(c => `<button class="pill" data-cat="${esc(c)}" aria-pressed="${f.category === c}">${esc(c || "All categories")}</button>`).join("")}</div></div>` : ""}
    ${body || (bks.length ? `<div class="empty"><b>No workbook matches</b>Try another word or clear the filters.</div>` : state.cfg.key ? `<div class="empty"><b>Loading the Directory…</b>Reading the DAR DATABASE DIRECTORY sheet.</div>` : "")}`;
  if($("toSet")) $("toSet").onclick = () => go({ name:"settings" });
