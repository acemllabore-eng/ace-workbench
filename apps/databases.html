  $("view").querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { f.category = b.dataset.cat; renderLibrary(); });
  const qi = $("libQ");
  qi.oninput = () => { f.q = qi.value; const pos = qi.selectionStart; renderLibrary(); const n = $("libQ"); n.focus(); n.setSelectionRange(pos, pos); };
  $("view").querySelectorAll(".card[data-book]").forEach(c => c.onclick = () => go({ name:"book", book:c.dataset.book }));
  countUp();
}
function card(b, i){
  const keys = b.keyTabs ? b.keyTabs.split(/\s*·\s*/).filter(Boolean) : [];
  const has = Object.keys(state.saved).some(k => k.startsWith(b.id + "|"));
  return `<button class="card rise${b.id ? "" : " nolink"}" style="--i:${i + 4}" ${b.id ? `data-book="${esc(b.id)}"` : "disabled"}>
    <div class="top"><span class="tag">${esc(b.category || "Workbook")}</span>${has ? '<span class="tag cy">Offline copy</span>' : ""}${b.id ? "" : '<span class="tag dim">No link in Directory</span>'}</div>
    <h3>${esc(b.name)}</h3><p>${esc(b.holds)}</p>
    ${keys.length ? `<div class="keytabs">${keys.map(k => `<span>${esc(k)}</span>`).join("")}</div>` : ""}
    ${b.id ? `<div class="go">Open tabs ${ICO.go}</div>` : ""}
  </button>`;
}
function countUp(){
  document.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count;
    if(STILL || !to){ el.textContent = fmt(to); return; }
    const t0 = performance.now(), d = 700;
    const step = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(to * e)); if(k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    setTimeout(() => { el.textContent = fmt(to); }, d + 150);   // background tabs get no animation frames
  });
}

/* ---------- One workbook: its tabs ---------- */
async function loadTabs(book, fresh){
  try{
    const j = await api("GET", { action:"tabs", book, fresh: fresh ? "1" : "" });
    state.tabs[book] = { list:j.tabs, at:new Date().toISOString() }; ls("db.tabs", state.tabs);
  }catch(e){ if(state.view.book === book) state.view.err = e; }
  if(state.view.name === "book" && state.view.book === book) renderBook();
}
function renderBook(){
  const v = state.view, b = state.books.find(x => x.id === v.book) || { name:"Workbook", keyTabs:"" };
  const t = state.tabs[v.book], keys = (b.keyTabs || "").split(/\s*·\s*/).map(s => s.trim().toLowerCase()).filter(Boolean);
  const isKey = n => { n = n.toLowerCase(); return keys.some(k => n === k || n.startsWith(k) || k.startsWith(n)); };
  if(!v.asked){ v.asked = true; loadTabs(v.book); }
  const err = v.err; v.err = null;
  // Only the Directory's KEY TABS are listed; a workbook with no key tabs in the Directory lists all its tabs.
  const list = t ? t.list.filter(x => !keys.length || isKey(x.name)) : [];
  const vis = list.filter(x => !x.hidden), hid = list.filter(x => x.hidden);
  const tc = (x, i) => `<button class="tabc rise${isKey(x.name) ? " key" : ""}" style="--i:${i}" data-tab="${esc(x.name)}">
      <span class="ti">${ICO.tab}</span><span style="min-width:0"><b>${esc(x.name)}</b><small>${fmt(Math.max(0, x.rows))} rows · ${fmt(x.cols)} columns${isKey(x.name) ? " · key tab" : ""}</small></span>
      ${state.saved[v.book + "|" + x.name] ? '<span class="saved">offline</span>' : ""}</button>`;
  $("view").innerHTML = `
    ${err ? `<div class="banner ${err.server ? "bad" : "warn"}"><div class="grow"><b>${err.server ? "Could not open this workbook" : "No connection"}</b>${esc(errText(err))}${t && !err.server ? " Tab list kept " + new Date(t.at).toLocaleString("en-PH") + "." : ""}</div></div>` : ""}
    <div class="bar"><div class="grow"><span class="tag">${esc(b.category || "Workbook")}</span><h2 style="margin:8px 0 2px;font-size:20px">${esc(b.name)}</h2><div class="muted">${esc(b.holds || "")}</div></div>
      ${b.url ? `<a class="btn" href="${esc(b.url)}" target="_blank" rel="noopener">${ICO.ext} Open in Google Sheets</a>` : ""}</div>
    ${t ? `<div class="sect">Tabs <b>${vis.length}</b></div><div class="tabs">${vis.map(tc).join("")}</div>
      ${hid.length ? `<details style="margin-top:16px"><summary class="muted" style="cursor:pointer">Hidden tabs (${hid.length})</summary><div class="tabs" style="margin-top:10px">${hid.map(tc).join("")}</div></details>` : ""}`
      : err ? "" : `<div class="empty"><b>Reading the tabs…</b>Opening ${esc(b.name)}.</div>`}`;
  $("view").querySelectorAll("[data-tab]").forEach(el => el.onclick = () => go({ name:"table", book:v.book, tab:el.dataset.tab }));
}

/* ---------- One tab: the table ---------- */
async function loadTab(book, tab, fresh){
  const key = book + "|" + tab;
  const here = () => state.view.name === "table" && state.view.book === book && state.view.tab === tab;
  if(!fresh){ const kept = await idb.get(key); if(kept && here() && (!state.data || state.data.key !== key)) setData(kept, true); }
  try{
    const first = await api("GET", { action:"tab", book, tab, header: state.headerOverride[key] || "", fresh: fresh ? "1" : "" });
    if(!here()) return;
    const old = state.data && state.data.key === key ? state.data : null;
    const d = { key, book, tab, bookName:first.bookName, gid:first.gid, headerRow:first.headerRow, headers:first.headers, total:first.total,
      rows:first.rows, formulas:first.formulas.map(x => x[0] + "," + x[1]), lists:first.lists || {}, at:new Date().toISOString(), built:first.copy_built || "", complete:first.rows.length >= first.total };
    if(old){ d.q = old.q; d.fcol = old.fcol; d.fval = old.fval; d.sort = old.sort; }
    setData(d, false);
    let off = first.rows.length;
    while(off < d.total){
      const pg = await api("GET", { action:"tab", book, tab, header: d.headerRow, offset: off });
      if(state.data !== d) return;
      if(!pg.rows.length) break;
      pg.formulas.forEach(x => d.formulas.push((x[0] + off) + "," + x[1]));
      d.rows = d.rows.concat(pg.rows); off += pg.rows.length;
      d.fset = new Set(d.formulas); overlay(d); prepare(d); tableBody(false); progress();
    }
    d.complete = true; progress(); tableBody(false);
    await keep(d);
    state.saved[key] = d.at; ls("db.savedTabs", state.saved);
  }catch(e){
    if(!here()) return;
    state.tabErr = e;
    renderTable();
  }
}
function setData(d, kept){
  d.fset = new Set(d.formulas); d.live = !kept; d.kept = kept;
  if(kept) d.complete = true;
  d.hiddenCols = lsJ("db.cols." + d.key, []);
  overlay(d);
  state.data = d; prepare(d); renderTable();
}
// Search text per row, and column widths from the first rows.
function prepare(d){
  d.text = d.rows.map(r => r.join("\u0001").toLowerCase());
  const n = d.headers.length, sample = d.rows.slice(0, 300);
  d.widths = d.headers.map((h, j) => {
    let m = Math.min(h.length, 28) * 7.4 + 30;
    sample.forEach(r => { const s = String(r[j] || ""); if(s) m = Math.max(m, Math.min(s.length, 46) * 7.3 + 22); });
    return Math.round(Math.max(80, Math.min(340, m)));
  });
}
const blank = (d, i) => !d.text[i].replace(/\u0001/g, "").trim();
function visibleCols(d){ return d.headers.map((h, j) => j).filter(j => !d.hiddenCols.includes(j)); }
function filtered(d){
  const q = (d.q || "").trim().toLowerCase(), fc = d.fcol, fv = d.fval, idx = [];
  for(let i = 0; i < d.rows.length; i++){
    if(blank(d, i)) continue;
    if(q && !d.text[i].includes(q)) continue;
    if(fc !== undefined && fc !== "" && fv && String(d.rows[i][fc] || "") !== fv) continue;
    idx.push(i);
  }
  if(d.sort){
    const { j, dir } = d.sort, col = new Intl.Collator("en", { numeric:true, sensitivity:"base" });
    idx.sort((a, b) => dir * col.compare(String(d.rows[a][j] || ""), String(d.rows[b][j] || "")));
  }
  return idx;
}
function renderTable(){
  const v = state.view, d = state.data && state.data.key === v.book + "|" + v.tab ? state.data : null;
  const err = state.tabErr; state.tabErr = null;
  if(!d && !err){
    $("view").innerHTML = `<div class="empty"><b>Loading ${esc(v.tab)}…</b>The first time a tab is opened it is read from Google Sheets; after that it comes from the copy the unit's web app keeps, read again every 15 minutes.</div>`;
    if(!v.asked){ v.asked = true; loadTab(v.book, v.tab); }
    return;
  }
  if(!d){
    $("view").innerHTML = `<div class="banner ${err.server ? "bad" : "warn"}"><div class="grow"><b>Could not open ${esc(v.tab)}</b>${esc(errText(err))}${err.server ? "" : " This tab has not been opened on this device before, so there is no saved copy."}</div><button class="btn sm" id="again">Try again</button></div>`;
    $("again").onclick = () => loadTab(v.book, v.tab, true); return;
  }
  if(err) d.err = err;
  const b = state.books.find(x => x.id === d.book);
  const coll = new Intl.Collator("en", { numeric:true }).compare;
  const colOpts = d.headers.map((h, j) => `<option value="${j}" ${String(d.fcol) === String(j) ? "selected" : ""}>${esc(h)}</option>`).join("");
  const vals = d.fcol !== undefined && d.fcol !== "" ? [...new Set(d.rows.map(r => String(r[d.fcol] || "")))].filter(Boolean).sort(coll).slice(0, 400) : [];
  $("view").innerHTML = `
    ${d.err ? `<div class="banner warn"><div class="grow"><b>Showing the copy kept on this device</b>${esc(errText(d.err))} Kept ${new Date(d.at).toLocaleString("en-PH")}.${canEdit() ? " Edits you make are kept here and sent when online." : ""}</div></div>`
      : d.kept ? `<div class="banner warn" id="keptNote"><div class="grow"><b>Saved copy from ${new Date(d.at).toLocaleString("en-PH")}</b>Loading the live tab…</div></div>` : ""}
    <div class="tbar">
      <div class="search">${ICO.search}<input class="f" id="tq" placeholder="Search every column" value="${esc(d.q || "")}"></div>
      <select class="f" id="fcol" aria-label="Filter column"><option value="">Filter by column…</option>${colOpts}</select>
      ${vals.length ? `<select class="f" id="fval" aria-label="Filter value"><option value="">Any value</option>${vals.map(x => `<option ${d.fval === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>` : ""}
      <button class="btn sm" id="colsBtn">Columns</button>
      ${b && b.id && b.url ? `<a class="btn sm" href="https:\/\/docs.google.com/spreadsheets/d/${esc(b.id)}/edit#gid=${esc(d.gid || "")}" target="_blank" rel="noopener">${ICO.ext} Sheets</a>` : ""}
    </div>
    <div class="tbar"><span class="count" id="count"></span><span class="grow"></span>
      <span class="count">Header row <b>${d.headerRow}</b><button class="btn sm" id="hdrBtn" title="Pick which row holds the column names">Change</button></span>
      ${canEdit() ? '<span class="tag cy">Tap a row to edit</span>' : '<span class="tag dim">View only</span>'}</div>
    <div class="prog" id="prog"><i></i></div>
    <div id="tableHost"></div>
    ${d.built ? `<div class="muted" id="builtNote" style="margin-top:10px;font-size:12px">Read from Google Sheets ${new Date(d.built).toLocaleString("en-PH")}, read again every 15 minutes. Refresh (top bar) reads it now.</div>` : ""}`;
  const tq = $("tq"); let t;
  tq.oninput = () => { clearTimeout(t); t = setTimeout(() => { d.q = tq.value; tableBody(true); }, 140); };
  $("fcol").onchange = e => { d.fcol = e.target.value; d.fval = ""; renderTable(); };
  if($("fval")) $("fval").onchange = e => { d.fval = e.target.value; tableBody(true); };
  $("colsBtn").onclick = colsDrawer;
  $("hdrBtn").onclick = () => {
    const n = prompt("Which row holds the column names? (1 = the top row of the tab)", d.headerRow);
    if(n === null) return; const k = Math.floor(+n);
    if(!(k >= 1)) return toast("Enter a row number");
    state.headerOverride[d.key] = k; ls("db.header", state.headerOverride); state.data = null; v.asked = true; renderTable(); loadTab(d.book, d.tab, true);
  };
  progress(); tableBody(true);
}
function progress(){
  const d = state.data, p = $("prog"); if(!p || !d) return;
  p.querySelector("i").style.width = (d.total ? Math.min(100, 100 * d.rows.length / d.total) : 100) + "%";
  p.style.visibility = d.complete ? "hidden" : "visible";
  if(d.live && $("keptNote")) $("keptNote").remove();
}
let vt = null;
function tableBody(reset){
  const d = state.data, host = $("tableHost"); if(!d || !host) return;
  d.idx = filtered(d);
  let total = 0; for(let i = 0; i < d.rows.length; i++) if(!blank(d, i)) total++;
  if($("count")) $("count").innerHTML = `<b>${fmt(d.idx.length)}</b> of ${fmt(total)} rows${d.complete ? "" : ` · loading <b>${Math.round(100 * d.rows.length / Math.max(1, d.total))}%</b>`}`;
  if(!d.idx.length){ host.innerHTML = `<div class="nomatch">${d.rows.length ? "No row matches. Clear the search or the filter." : "This tab has no rows under its header."}</div>`; vt = null; return; }
  if(PHONE()){ vt = null; return phoneList(d, host, reset); }
  const cols = visibleCols(d);
  if(reset || !vt || !vt.tv.isConnected){
    const tpl = "64px " + cols.map(j => d.widths[j] + "px").join(" ");
    const keepTop = !reset && vt && vt.tv.isConnected ? vt.tv.scrollTop : 0;
    host.innerHTML = `<div class="tv" id="tv" style="--cols:${tpl}"><div class="th"><div class="rn">Row</div>${cols.map(j => `<div data-sort="${j}" class="${d.sort && d.sort.j === j ? "sorted" : ""}" title="${esc(d.headers[j])}">${esc(d.headers[j])}${d.sort && d.sort.j === j ? (d.sort.dir > 0 ? " ▲" : " ▼") : ""}</div>`).join("")}</div><div class="tbody" id="tb"></div></div>`;
    vt = { tv:$("tv"), cols, first:-1, last:-1 };
    vt.tv.scrollTop = keepTop;
    vt.tv.addEventListener("scroll", () => requestAnimationFrame(paint), { passive:true });
    vt.tv.querySelector(".th").onclick = e => {
      const h = e.target.closest("[data-sort]"); if(!h) return;
      const j = +h.dataset.sort;
      d.sort = !d.sort || d.sort.j !== j ? { j, dir:1 } : d.sort.dir > 0 ? { j, dir:-1 } : null;
      tableBody(true);
    };
    $("tb").onclick = e => { const r = e.target.closest(".tr"); if(r) openRow(+r.dataset.i); };
  }
  $("tb").style.height = (d.idx.length * ROWH) + "px";
  vt.first = vt.last = -1; paint();
}
function hi(s, q){
  s = esc(s); if(!q) return s;
  const e = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return s.replace(new RegExp(e, "ig"), m => "<mark>" + m + "</mark>");
}
function paint(){
  const d = state.data; if(!vt || !d || !vt.tv.isConnected) return;
  const top = vt.tv.scrollTop, h = vt.tv.clientHeight;
  const first = Math.max(0, Math.floor(top / ROWH) - 12), last = Math.min(d.idx.length, Math.ceil((top + h) / ROWH) + 12);
  if(first === vt.first && last === vt.last) return;
  vt.first = first; vt.last = last;
  const q = (d.q || "").trim(), out = [];
  for(let k = first; k < last; k++){
    const i = d.idx[k], r = d.rows[i];
    out.push(`<div class="tr${d.flash === i ? " flash" : ""}" data-i="${i}" style="top:${k * ROWH}px"><div class="rn">${d.headerRow + 1 + i}</div>${vt.cols.map(j => `<div class="${d.fset.has(i + "," + j) ? "fx" : ""}" title="${esc(r[j])}">${hi(r[j] || "", q)}</div>`).join("")}</div>`);
  }
  $("tb").innerHTML = out.join("");
}
function phoneList(d, host, reset){
  const q = (d.q || "").trim(), cols = visibleCols(d);
  if(reset || !d.shown) d.shown = 60;
  const titleCol = cols[0], show = cols.slice(1, 6);
  host.innerHTML = `<div class="rcs">${d.idx.slice(0, d.shown).map((i, k) => { const r = d.rows[i];
    return `<div class="rc${d.flash === i ? " flash" : ""}" data-i="${i}" style="animation-delay:${Math.min(k % 60, 12) * 30}ms"><div class="h"><b>${hi(r[titleCol] || "—", q)}</b><small>row ${d.headerRow + 1 + i}</small></div>
      <dl>${show.map(j => `<dt>${esc(d.headers[j])}</dt><dd>${hi(r[j] || "—", q)}</dd>`).join("")}</dl></div>`; }).join("")}</div>
    ${d.idx.length > d.shown ? `<div class="more"><button class="btn" id="moreBtn">Show more (${fmt(d.idx.length - d.shown)} left)</button></div>` : ""}`;
  host.querySelector(".rcs").onclick = e => { const c = e.target.closest(".rc"); if(c) openRow(+c.dataset.i); };
  const mb = $("moreBtn");
  if(mb){
    mb.onclick = () => { d.shown += 60; phoneList(d, host, false); };
    if("IntersectionObserver" in window){ const io = new IntersectionObserver(es => { if(es[0].isIntersecting){ io.disconnect(); d.shown += 60; phoneList(d, host, false); } }, { root:$("main"), rootMargin:"300px" }); io.observe(mb); }
  }
}

/* ---------- Drawer: one row, view or edit ---------- */
function closeDrawer(){ $("drawerHost").innerHTML = ""; document.removeEventListener("keydown", escClose); }
function escClose(e){ if(e.key === "Escape") closeDrawer(); }
function drawer(title, body, foot){
  $("drawerHost").innerHTML = `<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><button class="ibtn" id="dClose" aria-label="Close">${ICO.x}</button></header>
    <div class="body" id="dBody">${body}</div>${foot ? `<footer id="dFoot">${foot}</footer>` : ""}</aside>`;
  $("scrim").onclick = $("dClose").onclick = closeDrawer;
  document.addEventListener("keydown", escClose);
}
function openRow(i){
  const d = state.data, r = d.rows[i], live = d.live && !d.err && !isOffline(), edit = canEdit(), rowNum = d.headerRow + 1 + i;
  const pend = state.outbox.find(o => mine(o) && o.key === d.key && o.row === rowNum && o.headerRow === d.headerRow);
  const fields = d.headers.map((h, j) => {
    const isF = d.fset.has(i + "," + j), list = d.lists[j], v = r[j] || "";
    let ctl;
    if(!edit || isF) ctl = `<div class="val">${esc(v) || '<span class="muted">—</span>'}</div>`;
    else if(list && list.length) ctl = `<select class="f" data-j="${j}"><option value=""></option>${list.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}${v && !list.includes(v) ? `<option selected>${esc(v)}</option>` : ""}</select>`;
    else if(v.length > 60 || /remark|note|detail|address/i.test(h)) ctl = `<textarea class="f" data-j="${j}" rows="3">${esc(v)}</textarea>`;
    else ctl = `<input class="f" data-j="${j}" value="${esc(v)}">`;
    return `<div class="fld" data-fj="${j}"><span class="lb">${esc(h)}${isF ? '<span class="tag dim">formula</span>' : ""}${list && list.length ? '<span class="tag cy">list</span>' : ""}</span>${ctl}</div>`;
  }).join("");
  const why = "View only: the head and the admin edit.", saveLbl = live && !pend ? "Save to Sheet" : "Save on this device";
  drawer(`Row ${rowNum} · ${r[0] || d.tab}`, (pend ? `<div class="banner warn"><div class="grow"><b>Edit kept on this device</b>${pend.status === "waiting" ? "Not on the Sheet yet; it is sent when online." : "It needs you: open the list of kept edits."}</div></div>` : "")
      + (edit && !live ? `<div class="banner warn"><div class="grow"><b>No connection</b>Your changes are kept on this device and sent to the Sheet when the connection is back.</div></div>` : "") + fields,
    edit ? `<span class="chg grow" id="chg">No changes</span><button class="btn" id="dCancel">Cancel</button><button class="btn primary" id="dSave" disabled>${saveLbl}</button>`
         : `<span class="chg grow">${esc(why)}</span><button class="btn" id="dCancel">Close</button>`);
  $("dCancel").onclick = closeDrawer;
  if(!edit) return;
  const changed = () => [...document.querySelectorAll("#dBody [data-j]")].filter(el => el.value !== (r[+el.dataset.j] || ""));
  const onChange = () => {
    const c = changed();
    document.querySelectorAll("#dBody .fld").forEach(f => f.classList.toggle("changed", c.some(el => el.dataset.j === f.dataset.fj)));
    $("chg").innerHTML = c.length ? `<b>${c.length}</b> field${c.length > 1 ? "s" : ""} changed` : "No changes";
    $("dSave").disabled = !c.length;
  };
  $("dBody").addEventListener("input", onChange); $("dBody").addEventListener("change", onChange);
  $("dSave").onclick = () => saveRow(i, changed().map(el => ({ col:+el.dataset.j + 1, header:d.headers[+el.dataset.j], old:r[+el.dataset.j] || "", value:el.value })));
}
async function saveRow(i, cells){
  const d = state.data, btn = $("dSave"), row = d.headerRow + 1 + i;
  // No connection, a device copy, or this row already has a kept edit: keep it here, send when online.
  if(isOffline() || !d.live || d.err || state.outbox.some(o => mine(o) && o.key === d.key && o.row === row && o.headerRow === d.headerRow)){
    queueEdit(i, cells); toast(isOffline() ? "Kept on this device · sent when online" : "Kept on this device · sending…"); flushOutbox(); return;
  }
  if(btn){ btn.disabled = true; btn.textContent = "Saving…"; }
  const reset = () => { if(btn && btn.isConnected){ btn.textContent = "Save to Sheet"; btn.disabled = false; } };
  try{
    const j = await api("POST", { changes:[{ type:"edit", book:d.book, tab:d.tab, headerRow:d.headerRow, row:d.headerRow + 1 + i, cells }] });
    const res = j.results[0];
    if(res.result === "saved" || res.result === "same"){
      const n = d.headers.length;
      d.rows[i] = res.row.slice(0, n).concat(new Array(Math.max(0, n - res.row.length)).fill(""));
      d.text[i] = d.rows[i].join("\u0001").toLowerCase();
      d.flash = i; closeDrawer(); tableBody(false);
      setTimeout(() => { if(d.flash === i) d.flash = undefined; }, 1900);
      toast(res.result === "saved" ? "Saved to " + d.tab + " · " + res.changed + " cell" + (res.changed > 1 ? "s" : "") : "Nothing changed");
      if(res.check_error) sheetWarn(res.check_error);
      keep(d);
      return;
    }
    if(res.result === "conflict"){
      const fresh = res.row.slice(0, d.headers.length);
      $("dBody").querySelectorAll(".cfl").forEach(x => x.remove());
      $("dBody").insertAdjacentHTML("afterbegin", `<div class="banner warn cfl"><div class="grow"><b>Someone changed this row after you opened it</b>${res.conflicts.map(c => `${esc(c.header)} is now “${esc(c.server || "blank")}”.`).join(" ")}
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" id="useTheirs">Use the Sheet's values</button><button class="btn sm primary" id="keepMine">Save mine over them</button></div></div></div>`);
      $("useTheirs").onclick = () => { d.rows[i] = fresh; d.text[i] = fresh.join("\u0001").toLowerCase(); tableBody(false); openRow(i); };
      $("keepMine").onclick = () => saveRow(i, cells.map(c => Object.assign({}, c, { old: fresh[c.col - 1] || "" })));
      reset(); return;
    }
    throw Object.assign(new Error(res.error || "Refused"), { server:true });
  }catch(e){
    // Connection lost while saving: keep the edit on this device instead of losing it.
    if(!e.server && !e.setup){ queueEdit(i, cells); toast("No connection · kept on this device, sent when online"); return; }
    if($("dBody")){ $("dBody").querySelectorAll(".cfl").forEach(x => x.remove()); $("dBody").insertAdjacentHTML("afterbegin", `<div class="banner bad cfl"><div class="grow"><b>Not saved</b>${esc(errText(e))}</div></div>`); }
    reset();
  }
}
function colsDrawer(){
  const d = state.data;
  drawer("Columns shown", d.headers.map((h, j) => `<label style="display:flex;gap:10px;align-items:center;padding:6px 4px"><input type="checkbox" data-c="${j}" ${d.hiddenCols.includes(j) ? "" : "checked"}> ${esc(h)}</label>`).join(""),
    `<button class="btn" id="cAll">Show all</button><span class="grow"></span><button class="btn primary" id="cDone">Done</button>`);
  $("cAll").onclick = () => document.querySelectorAll("[data-c]").forEach(c => c.checked = true);
  $("cDone").onclick = () => {
    d.hiddenCols = [...document.querySelectorAll("[data-c]")].filter(c => !c.checked).map(c => +c.dataset.c);
    if(d.hiddenCols.length === d.headers.length) d.hiddenCols = [];
    ls("db.cols." + d.key, d.hiddenCols); closeDrawer(); tableBody(true);
  };
}

/* ---------- Recent edits ---------- */
async function renderHistory(){
  const v = state.view, b = state.books.find(x => x.id === v.book);
  $("view").innerHTML = `<div class="bar"><h2 class="grow" style="margin:0;font-size:20px">Recent edits${b ? " · " + esc(b.name) : ""}</h2>${b ? '<button class="btn sm" id="hAll">All workbooks</button>' : ""}</div><div id="hl"><div class="empty"><b>Reading the edit log…</b></div></div>`;
  if($("hAll")) $("hAll").onclick = () => go({ name:"history", book:"" });
  try{
    const j = await api("GET", { action:"history", book: v.book || "" });
    if(state.view !== v) return;
    $("hl").innerHTML = j.history.length ? `<div class="tl">${j.history.map((h, i) => `<div class="ev rise" style="--i:${Math.min(i, 14)}">
      <div class="m">${esc(new Date(h.time).toLocaleString("en-PH"))} · <b>${esc(h.by)}</b> · ${esc(h.workbook)} › ${esc(h.tab)} › row ${esc(h.row)}</div>
      <div class="d"><b>${esc(h.column)}</b>: <s>${esc(h.old || "blank")}</s> → <ins>${esc(h.value || "blank")}</ins></div></div>`).join("")}</div>`
      : `<div class="empty"><b>No edits yet</b>Every change saved from this app is listed here, newest first.</div>`;
  }catch(e){ if($("hl")) $("hl").innerHTML = `<div class="banner ${e.server ? "bad" : "warn"}"><div class="grow"><b>Could not read the edit log</b>${esc(errText(e))}</div></div>`; }
}

/* ---------- Settings and people ---------- */
function renderSettings(){
  const admin = state.me && state.me.role === "admin";
  $("view").innerHTML = `
    <div class="panel rise"><h2>Sign-in</h2>
      <div class="grid2">
        <input id="cUrl" type="hidden" value="${esc(state.cfg.url)}">
        ${window.DB_HOSTED ? `<label class="l">Your key<input class="f mono" id="cKey" value="${esc(state.cfg.key)}" placeholder="XXXXX-XXXXX" autocomplete="off"></label>` : `<input id="cKey" type="hidden" value="${esc(state.cfg.key)}">`}
        <label class="l">This device's name<input class="f" id="cDev" value="${esc(state.cfg.device)}"></label>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center"><button class="btn primary" id="cSave">${window.DB_HOSTED ? "Save and connect" : "Save device name"}</button><span class="muted" id="cMsg">${state.me ? "Connected as " + esc(state.me.name) + " (" + esc(state.me.role) + ")" : window.DB_HOSTED ? "" : "Not signed in."}</span></div>
      <p class="muted" style="margin:14px 0 0;font-size:12.5px">${window.DB_HOSTED ? "Your key is kept on this device only." : "One sign-in for every app: <b>Sign in</b> in the top bar of the Survey Unit panel. Sign out there too. The key is kept on this device only."} The workbooks stay in Google Sheets; this device keeps a copy of each tab you open, for reading offline.</p>
    </div>
    ${admin ? `<div class="panel rise" style="--i:1"><h2>People</h2>
      <div class="grid2"><label class="l">Name<input class="f" id="pName" placeholder="Full name"></label>
        <label class="l">Role<select class="f" id="pRole"><option value="member">Member (view)</option><option value="head">Head (view and edit)</option><option value="admin">Admin (edit, add people)</option></select></label></div>
      <div style="margin-top:12px"><button class="btn primary" id="pAdd">Add and make a key</button></div><div id="pKey"></div>
      <div class="people">${state.people.map(p => `<div class="person"><b>${esc(p.name)}</b><span class="tag ${p.role === "member" ? "dim" : "cy"}">${esc(p.role)}</span>${p.active ? "" : '<span class="tag dim">off</span>'}${p.name === state.me.name ? "" : `<button class="btn sm" data-newkey="${esc(p.name)}">New key</button><button class="btn sm" data-act="${esc(p.name)}" data-on="${p.active ? "0" : "1"}">${p.active ? "Switch off" : "Switch on"}</button>`}</div>`).join("") || '<span class="muted">Loading…</span>'}</div></div>` : ""}`;
  $("cSave").onclick = async () => {
    if(!window.DB_HOSTED && !state.cfg.key){ state.cfg.device = $("cDev").value.trim().slice(0, 40) || state.cfg.device; saveCfg(); $("cMsg").textContent = "Device name saved. Sign in from the top bar of the panel."; return; }
    if(!okAddr($("cUrl").value.trim())){ $("cMsg").textContent = "That is not a Google Apps Script web app address. It looks like https:\/\/script.google.com/macros/s/…/exec"; return; }
    state.cfg.url = $("cUrl").value.trim(); state.cfg.key = $("cKey").value.trim().toUpperCase(); state.cfg.device = $("cDev").value.trim().slice(0, 40) || state.cfg.device; saveCfg(); awSignin(state.cfg.url, state.cfg.key);
    $("cMsg").textContent = "Connecting…";
    try{ const j = await api("GET", { action:"books" }); state.books = j.books; state.people = j.people || []; ls("db.books", state.books); toast("Connected as " + j.me.name); renderSettings(); }
    catch(e){ $("cMsg").textContent = errText(e); }
  };
  if(!admin) return;
  if(!state.people.length && !state.peopleAsked){ state.peopleAsked = true; loadBooks(false).then(() => { if(state.view.name === "settings") renderSettings(); }); }
  $("pAdd").onclick = async () => {
    const name = $("pName").value.trim(); if(!name) return toast("Enter a name");
    try{
      const j = await api("POST", { changes:[{ type:"addMember", name, role:$("pRole").value }] }), r = j.results[0];
      if(r.result !== "saved") return toast(r.error);
      state.people = j.people; renderSettings();
      $("pKey").innerHTML = `<div class="banner ok" style="margin-top:12px"><div class="grow"><b>Key for ${esc(r.name)} (${esc(r.role)})</b>Shown once. Give it to them privately; they sign in with it from the top bar of the panel.<div class="keybox">${esc(r.key)}</div><button class="btn sm" id="cpKey">Copy key</button></div></div>`;
      $("cpKey").onclick = () => navigator.clipboard && navigator.clipboard.writeText(r.key).then(() => toast("Key copied"));
    }catch(e){ toast(errText(e)); }
  };
  $("view").querySelectorAll("[data-newkey]").forEach(b => b.onclick = async () => {
    if(!confirm("Give " + b.dataset.newkey + " a new key? The old key stops working at once.")) return;
    try{
      const j = await api("POST", { changes:[{ type:"resetKey", name:b.dataset.newkey }] }), r = j.results[0];
      if(r.result !== "saved") return toast(r.error);
      $("pKey").innerHTML = `<div class="banner ok" style="margin-top:12px"><div class="grow"><b>New key for ${esc(r.name)} (${esc(r.role)})</b>Shown once. The old key no longer works. Give this one to them privately.<div class="keybox">${esc(r.key)}</div><button class="btn sm" id="cpKey">Copy key</button></div></div>`;
      $("cpKey").onclick = () => navigator.clipboard && navigator.clipboard.writeText(r.key).then(() => toast("Key copied"));
    }catch(e){ toast(errText(e)); }
  });
  $("view").querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    try{ const j = await api("POST", { changes:[{ type:"setActive", name:b.dataset.act, active:b.dataset.on === "1" }] }); state.people = j.people; renderSettings(); }
    catch(e){ toast(errText(e)); }
  });
}

/* ---------- Effects ---------- */
// Title resolves from scrambled characters.
(function decode(){
  const el = $("title"), text = "Databases";
  if(STILL) return;
  const g = "ABCDEFGHJKLMNPRSTUVWXYZ0123456789#%", steps = 18; let f = 0;
  const t = setInterval(() => { const k = Math.floor(text.length * ++f / steps); el.textContent = text.slice(0, k) + [...text.slice(k)].map(() => g[Math.floor(Math.random() * g.length)]).join(""); if(f >= steps){ clearInterval(t); el.textContent = text; } }, 34);
})();
// Ripple where a button is pressed.
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".btn,.pill,.ibtn,.tabc,.card"); if(!b || STILL || b.disabled) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, x = document.createElement("span");
  x.className = "rip"; x.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  b.appendChild(x); setTimeout(() => x.remove(), 650);
});
// Cards tilt toward the mouse and light follows it.
document.addEventListener("pointermove", e => {
  const c = e.target.closest && e.target.closest(".card[data-book]"); if(!c || STILL || e.pointerType !== "mouse") return;
  const r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  c.style.setProperty("--mx", (px * 100) + "%"); c.style.setProperty("--my", (py * 100) + "%");
  c.style.transform = `perspective(900px) rotateX(${(0.5 - py) * 6}deg) rotateY(${(px - 0.5) * 8}deg)`;
});
document.addEventListener("pointerout", e => { const c = e.target.closest && e.target.closest(".card"); if(c && !c.contains(e.relatedTarget)) c.style.transform = ""; });
// Background: slow constellation of points joined when close, over a faint grid. Stops when the page is hidden.
const bg = (() => {
  const c = $("bg"), g = c.getContext("2d"); let W, H, pts = [], run = false, cy = "79,214,234", gd = "224,176,60", grid = "rgba(224,176,60,.05)";
  function tone(){ const s = getComputedStyle(document.documentElement); cy = s.getPropertyValue("--cy-rgb").trim() || cy; gd = s.getPropertyValue("--accent-rgb").trim() || gd; grid = s.getPropertyValue("--grid").trim() || grid; draw(); }
  function size(){
    const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(70, W * H / 22000));
    pts = Array.from({ length:n }, () => ({ x:Math.random() * W, y:Math.random() * H, vx:(Math.random() - .5) * .2, vy:(Math.random() - .5) * .2, r:Math.random() * 1.4 + .6, k:Math.random() < .3 }));
  }
  function draw(){
    g.clearRect(0, 0, W, H);
    g.strokeStyle = grid; g.lineWidth = 1; g.beginPath();
    for(let x = 0; x < W; x += 56){ g.moveTo(x + .5, 0); g.lineTo(x + .5, H); }
    for(let y = 0; y < H; y += 56){ g.moveTo(0, y + .5); g.lineTo(W, y + .5); }
    g.stroke();
    for(let i = 0; i < pts.length; i++){
      const p = pts[i];
      for(let j = i + 1; j < pts.length; j++){
        const q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
        if(d2 < 16000){ g.strokeStyle = `rgba(${cy},${.18 * (1 - d2 / 16000)})`; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke(); }
      }
      g.fillStyle = `rgba(${p.k ? gd : cy},.6)`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.3); g.fill();
    }
  }
  function frame(){
    if(!run) return;
    pts.forEach(p => { p.x += p.vx; p.y += p.vy; if(p.x < 0 || p.x > W) p.vx *= -1; if(p.y < 0 || p.y > H) p.vy *= -1; });
    draw(); requestAnimationFrame(frame);
  }
  function sync(){ const want = !STILL && !document.hidden; if(want && !run){ run = true; requestAnimationFrame(frame); } else if(!want) run = false; }
  addEventListener("resize", () => { size(); draw(); });
  document.addEventListener("visibilitychange", sync);
  size(); tone(); sync();
  return { tone };
})();

/* ---------- Start ---------- */
window.addEventListener("message", e => { if(e.data && e.data.type === "aw-theme"){ if(e.data.theme) document.documentElement.dataset.theme = e.data.theme; else delete document.documentElement.dataset.theme; bg.tone(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => bg.tone());
addEventListener("online", () => { renderNet(); flushOutbox(); }); addEventListener("offline", () => { state.online = false; renderNet(); });
$("obBtn").onclick = outboxDrawer;
setInterval(() => { if(state.outbox.some(o => mine(o) && o.status === "waiting")) flushOutbox(); }, 60000);
let wasPhone = PHONE();
addEventListener("resize", () => {
  if(PHONE() !== wasPhone){ wasPhone = PHONE(); if(state.view.name === "table") tableBody(true); }
  else if(vt){ vt.first = -1; paint(); }
});
renderNet(); render(); drawChecks();
if(state.cfg.url && state.cfg.key) loadBooks(false).then(flushOutbox);
if(state.me){ $("role").hidden = false; $("role").textContent = state.me.role; $("role").title = "Signed in as " + state.me.name; }
</script>
