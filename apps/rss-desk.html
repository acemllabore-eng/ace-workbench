<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSS Verification Desk</title>
<style>
/* RSS Verification Desk: checks the documentary requirements of each Requisition for Survey Services (RSS) against the
   checklist of form DARMSBT-LTISUR-F-01 REV 00. Part of the ACE Workbench (same look), same mechanics as SR Verification Desk:
   register from LAD BAL (MOD), every change saved on this device first, sent to the Google Sheet when online
   (backend/rss_desk.gs, ?app=rss of the Survey Unit web app), stale changes refused and shown, never overwritten. */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#17181a; --muted:#6b6e73; --line:#e3e1dc; --hover:#f0eee9; --field:#ffffff;
  --accent:#b8860b; --accent-ink:#ffffff; --accent-soft:#f7efd9;
  --ok:#1d7a43; --ok-bg:#e3f2e8; --bad:#b3261e; --bad-bg:#fbe7e4; --warn:#8f5b00; --warn-bg:#fbf0d9; --info:#285fa8; --info-bg:#e6eef9;
  --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-lg:0 16px 40px rgba(0,0,0,.2);
  --font:"Inter","IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  --r:10px; --gap-l:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e0f10; --panel:#17181a; --ink:#ececea; --muted:#9a9c9f; --line:#2a2c2f; --hover:#1f2023; --field:#121315;
  --accent:#e0b03c; --accent-ink:#17130a; --accent-soft:#2a230f;
  --ok:#5fcf8c; --ok-bg:#14271b; --bad:#f2877d; --bad-bg:#331714; --warn:#e3b24f; --warn-bg:#2e2310; --info:#86b2f0; --info-bg:#15233a;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e0f10; --panel:#17181a; --ink:#ececea; --muted:#9a9c9f; --line:#2a2c2f; --hover:#1f2023; --field:#121315;
  --accent:#e0b03c; --accent-ink:#17130a; --accent-soft:#2a230f;
  --ok:#5fcf8c; --ok-bg:#14271b; --bad:#f2877d; --bad-bg:#331714; --warn:#e3b24f; --warn-bg:#2e2310; --info:#86b2f0; --info-bg:#15233a;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.6); color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);min-height:100vh}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:14px var(--gap-l) 0;flex-wrap:wrap}
.hrow h1{font-size:18px;margin:0;letter-spacing:-.01em}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto;min-width:0}
.sync span:not(.dot){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)} .dot.err{background:var(--bad)}
.tabs{display:flex;gap:4px;padding:8px var(--gap-l) 0;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px 10px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding:var(--gap-l);max-width:1280px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.okb{color:var(--ok);border-color:var(--ok)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
.btn[hidden]{display:none}

.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);margin-bottom:var(--gap-l);border:1px solid}
.banner.bad{background:var(--bad-bg);border-color:var(--bad)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn)}
.banner b{display:block;margin-bottom:2px}
.prob{border-top:1px solid var(--line);padding:10px 0 0;margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--hover);color:var(--muted);white-space:nowrap}
.pill.in{background:var(--accent-soft);color:var(--accent)}
.pill.s-Ongoing{background:var(--info-bg);color:var(--info)}
.pill.s-Returned{background:var(--warn-bg);color:var(--warn)}
.pill.s-Complete{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--accent-soft);color:var(--accent)}

/* Register */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:13px}
.chip b{font-family:var(--mono);font-weight:600;margin-left:4px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{color:inherit}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:0 10px;min-width:0;max-width:100%}
.filters input{flex:1 1 240px}
.count{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl tbody tr[data-id]{cursor:pointer}
.tbl tbody tr[data-id]:hover td{background:var(--hover)}
.tbl td.own{max-width:240px}
.tbl select.lhs{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:inherit;padding:0 6px;cursor:pointer}
.tbl small{display:block;color:var(--muted);font-size:12px}
.more{display:flex;justify-content:center;margin-top:12px}

/* Dashboard */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:22px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:8px;border-radius:4px;background:var(--hover);overflow:hidden;display:flex;min-width:80px}
.bar i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
h3.sec{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.scrim[hidden],.drawer[hidden]{display:none}
.dhead{display:flex;align-items:flex-start;gap:10px;padding:14px var(--gap-l);border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.dhead h2{margin:0;font-size:16px}
.dbody{flex:1;overflow:auto;padding:var(--gap-l)}
.dfoot{display:flex;gap:8px;padding:12px var(--gap-l);border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap;align-items:center}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.info div{min-width:0}
.info span{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.info b{font-weight:500;overflow-wrap:anywhere}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;background:var(--field);padding:7px 10px;font-size:14px;font-weight:400;width:100%}
label.f textarea{min-height:64px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--hover);opacity:1}
.ck{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:6px}
.ckrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px 10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start}
.ckrow:last-child{border-bottom:0}
.ckrow .no{font-family:var(--mono);color:var(--muted);font-size:12.5px;padding-top:4px}
.ckrow .lbl{font-weight:500;padding-top:3px}
.ckrow .rem{grid-column:2/-1;display:flex;gap:8px;align-items:center}
.ckrow .rem input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:6px 9px;font-size:13.5px}
.ckrow .rem label{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ckrow.L{background:var(--bad-bg)}
.ckrow.need .rem input[type=text]{border-color:var(--bad)}
.marks{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.marks button{border:0;background:var(--panel);padding:4px 10px;cursor:pointer;font-weight:600;min-width:42px;border-right:1px solid var(--line)}
.marks button:last-child{border-right:0}
.marks button:disabled{cursor:default;opacity:.7}
.marks button[aria-pressed="true"].P{background:var(--ok);color:#fff}
.marks button[aria-pressed="true"].L{background:var(--bad);color:#fff}
.marks button[aria-pressed="true"].NA{background:var(--muted);color:var(--bg)}
.mods td{padding:6px}
.mods input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:6px 9px}
.ferr{color:var(--bad);font-size:13px;width:100%}
.ferr:empty{display:none}
.hist{font-size:12.5px;border-left:2px solid var(--line);padding-left:12px;margin-top:14px}
.hist div{margin-bottom:6px}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}

/* Settings */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--gap-l);margin-bottom:var(--gap-l);box-shadow:var(--shadow)}
.panel h2{font-size:15px;margin:0 0 4px}
.panel p{margin:0 0 14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row label.f{flex:1;min-width:200px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-weight:500;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}

/* Printed form (page 1 of DARMSBT-LTISUR-F-01) */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000;font:11pt/1.35 Arial,Helvetica,sans-serif}
  header.top,main,.scrim,.drawer,.toast{display:none!important}
  #print{display:block}
  #print h1{font-size:13pt;text-align:center;margin:0 0 2mm}
  #print .sub{text-align:center;margin:0 0 5mm;font-size:10pt}
  #print table{width:100%;border-collapse:collapse;margin-bottom:5mm}
  #print td,#print th{border:1px solid #000;padding:2mm;vertical-align:top;font-size:10.5pt}
  #print th{font-weight:bold;text-align:center}
  #print .m{width:12mm;text-align:center;font-weight:bold;font-size:12pt}
  #print .head td{border:0;padding:0.8mm 0}
  #print h2{font-size:11pt;margin:4mm 0 2mm}
  #print .foot{text-align:right;font-size:9pt;margin-top:6mm}
  #print .sig{margin-top:10mm;display:flex;justify-content:space-between;font-size:10pt}
}

@media (max-width:720px){
  .hrow,.tabs,main{padding-left:16px;padding-right:16px}
  .sync{margin-left:0;width:100%}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .info,.fgrid{grid-template-columns:1fr 1fr}
  .dhead,.dbody,.dfoot{padding-left:16px;padding-right:16px}
  .ckrow{grid-template-columns:22px minmax(0,1fr)}
  .ckrow .marks{grid-column:2}
  .ckrow .rem{flex-wrap:wrap}
  .tbl .hide-s{display:none}
}
@media (prefers-reduced-motion:no-preference){ .btn,.chip,.tab{transition:background .12s,border-color .12s} }
</style>
</head>
<body>
<header class="top">
  <div class="hrow">
    <h1>RSS Verification Desk</h1>
    <div class="sync"><span class="dot" id="sDot"></span><span id="sText">Not connected</span>
      <button class="btn sm" id="syncBtn">Sync now</button></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-v="reg">Register</button>
    <button class="tab" role="tab" data-v="dash">Dashboard</button>
    <button class="tab" role="tab" data-v="settings">Settings</button>
  </nav>
</header>
<main id="main"></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="dTitle" role="dialog">
  <div class="dhead"><div style="flex:1;min-width:200px"><h2 id="dTitle">RSS</h2><div class="muted" id="dSub" style="font-size:12.5px"></div></div>
    <div id="dBadges" style="display:flex;gap:6px;flex-wrap:wrap"></div><button class="btn ghost sm" id="dClose">Close</button></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot">
    <div class="ferr" id="fErr" role="alert"></div>
    <button class="btn primary" id="fSave">Save</button>
    <button class="btn danger" id="fReturn">Return for compliance</button>
    <button class="btn" id="fRound">Compliance received</button>
    <button class="btn okb" id="fDone">Mark complete</button>
    <button class="btn" id="fReopen">Reopen</button>
    <span style="flex:1"></span>
    <button class="btn" id="fPrint">Print checklist</button>
    <button class="btn" id="fHist">History</button>
  </div>
</aside>
<div class="toast" id="toast" hidden role="status"></div>
<div id="print"></div>

<script>
"use strict";
const LS = "rss.v1", LS_REG = "rss.reg.v1";
// Page 1 of DARMSBT-LTISUR-F-01 REV 00, in its order (the server keeps the same list in RSS.ITEMS; kept here for offline and printing).
const ITEMS = [
  { id: "title", label: "PHILARIS copy of Title" },
  { id: "taxdec", label: "Tax Declaration No." },
  { id: "f2b", label: "Form 2-B (UPALs)" },
  { id: "f1", label: "Form 1 (conduct of Preliminary Ocular Inspection of LHs for coverage under CARP) with MARPO Certification" },
  { id: "f1a", label: "Form 1-A (Transmittal of accomplished CARPER LAD Form No.1)" },
  { id: "f2", label: "Form 2 (Certificate of Preliminary Projection)" },
  { id: "f3", label: "Form 3 (Notice of Coverage), if under CA" },
  { id: "aop", label: "Affidavit of Publication" },
  { id: "f28", label: "Form 28 (Preliminary list of potential ARBs)" },
  { id: "projmap", label: "DARPO Projection Map" },
  { id: "td", label: "Technical Description or Lot Data Computation" },
  { id: "cadmap", label: "Cadastral Map or reference plan" },
  { id: "f10b", label: "Form 10-B" }
];
const STATUSES = ["Pending", "Ongoing Verification", "Returned for compliance", "Complete"];
const LH_STATUSES = ["For Module", "Compliance", "Pending"];   // column Status; set on the desk, kept in RSS LOG (lh_status)
const MARK = { P: "✓", L: "✗", NA: "N/A" };
const MARK_T = { P: "Present", L: "Lacking", NA: "Not applicable" };
const EDIT = ["verification", "round", "holder", "tax_dec", "checks", "prev_modules", "notes", "date_received", "date_returned", "date_complete", "lh_status"];
const PAGE = 200;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const fmtTime = iso => iso ? new Date(iso).toLocaleString("en-PH", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const fmtDate = s => s ? new Date(s + "T00:00:00").toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" }) : "";
const sKey = s => (s || "Pending").split(" ")[0];
const parse = (s, f) => { if (s && typeof s === "object") return s; try { const v = JSON.parse(s || ""); return v == null ? f : v; } catch (e) { return f; } };

/* ---------- State, kept on this device ---------- */
// One sign-in for every app of the Survey Unit panel: the web app address and key in localStorage "aw.signin".
function awSignin(url, key) {
  try {
    if (url !== undefined) localStorage.setItem("aw.signin", JSON.stringify({ url: url, key: key }));
    return JSON.parse(localStorage.getItem("aw.signin") || "null");
  } catch (e) { return null; }
}
function blank() { return { cfg: { url: "", key: "", device: "" }, me: null, people: [], items: {}, outbox: [], problems: [], lastPull: "", lastSync: "" }; }
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) { s = null; }
  s = Object.assign(blank(), s || {});
  if (!s.cfg.device) s.cfg.device = (/Mobi|Android/i.test(navigator.userAgent) ? "PHONE-" : "PC-") + Math.random().toString(36).slice(2, 7).toUpperCase();
  if (window.RSS_HOSTED && window.RSS_HOSTED.url) s.cfg.url = window.RSS_HOSTED.url;
  const si = awSignin();
  if (si) { if (si.url && !window.RSS_HOSTED) s.cfg.url = si.url; s.cfg.key = si.key || ""; }
  return s;
}
function loadReg() { try { return JSON.parse(localStorage.getItem(LS_REG) || "null"); } catch (e) { return null; } }
let state = load(), reg = loadReg(), regRows = [], regById = {};
let storeOk = true;
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); storeOk = true; } catch (e) { storeOk = false; } }
function saveReg() { try { localStorage.setItem(LS_REG, JSON.stringify(reg)); } catch (e) { toast("This device could not keep the register; it is read again at the next sync."); } }
function indexReg() {
  regRows = []; regById = {};
  if (!reg || !reg.fields) return;
  const F = reg.fields;
  reg.rows.forEach(a => { const o = {}; F.forEach((f, i) => { o[f] = a[i]; }); o.inside = a[1] === 1; regRows.push(o); regById[o.id] = o; });
}
indexReg();
const isAdmin = () => !!state.me && state.me.role === "admin";
const pending = id => state.outbox.some(o => o.id === id);
const recOf = id => state.items[id] || null;
const statusOf = id => (recOf(id) && recOf(id).verification) || "Pending";
const canEdit = id => { const r = recOf(id); return !!state.me && (isAdmin() || !r || !r.holder || r.holder === state.me.name); };

/* ---------- Talking to the Sheet ---------- */
// The key is only ever sent to a Google Apps Script web app (or a test server on this PC).
const okAddr = u => /^https:\/\/script\.google\.com\/(a\/macros\/[\w.-]+|macros)\/s\/[\w-]+\/(exec|dev)$/.test(String(u || "")) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(String(u || ""));
let syncing = false, syncAgain = false, online = navigator.onLine, lastError = "", sourceError = "";
async function call(method, payload) {
  const u = state.cfg.url;
  if (!okAddr(u)) throw new Error("The web app address in Settings is not a Google Apps Script address");
  let r;
  if (method === "GET") r = await fetch(u + (u.includes("?") ? "&" : "?") + new URLSearchParams(Object.assign({ key: state.cfg.key, app: "rss" }, payload)), { redirect: "follow" });
  else r = await fetch(u, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ key: state.cfg.key, device: state.cfg.device, app: "rss" }, payload)) });
  const j = await r.json();
  if (!j.ok) throw Object.assign(new Error(j.error || "The Sheet refused the request"), { server: true });
  return j;
}

async function sync(quiet) {
  if (!state.cfg.url || !state.cfg.key) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; syncAgain = false; renderSync();
  try {
    if (state.outbox.length) {
      const sent = state.outbox.slice(), revs = sent.map(o => o.rev);
      const res = await call("POST", { changes: sent.map(o => ({ type: "save", id: o.id, baseVersion: o.baseVersion, data: o.data })) });
      res.results.forEach((r, i) => {
        const o = sent[i], changedSince = state.outbox.includes(o) && o.rev !== revs[i];   // edited again while this send was out: keep the newer edit queued
        if (!changedSince) state.outbox = state.outbox.filter(x => x !== o);
        const what = "LHID " + o.id + (regById[o.id] ? " · " + regById[o.id].landowner : "");
        if (r.result === "saved" || r.result === "same") {
          state.items[o.id] = Object.assign({}, r.record);
          if (changedSince) { o.baseVersion = r.record.version; Object.assign(state.items[o.id], shownOf(o.data)); }
        } else if (r.result === "conflict") {
          if (r.server) state.items[o.id] = Object.assign({}, r.server); else delete state.items[o.id];
          state.problems.push({ kind: "conflict", id: o.id, mine: o.data, what,
            detail: "Changed on another device or by another verifier first; the Sheet's copy is showing now." });
        } else {
          if (r.server) state.items[o.id] = Object.assign({}, r.server); else delete state.items[o.id];
          state.problems.push({ kind: "rejected", id: o.id, mine: o.data, error: r.error, what });
        }
      });
      if (res.people) state.people = res.people;
      state.me = res.me; save();
    }
    // Ask with 2 minutes of overlap: a save that started just before the last pull can land just after it.
    const since = state.lastPull ? new Date(new Date(state.lastPull).getTime() - 120000).toISOString() : "";
    const p = await call("GET", { action: "pull", since });
    state.me = p.me; state.people = p.people || state.people;
    (p.items || []).forEach(s => {
      const loc = state.items[s.id];
      if (pending(s.id)) return;                      // a local edit is queued: the next send settles it, or flags a conflict
      if (!loc || (Number(s.version) || 0) >= (Number(loc.version) || 0)) state.items[s.id] = s;
    });
    state.lastPull = p.server_time; state.lastSync = new Date().toISOString(); lastError = ""; online = true;
    save();
    // The register (LAD BAL (MOD) + SUMMARY) is fetched again only when the server's copy is newer than this device's.
    if (!reg || reg.stamp !== p.stamp) {
      const g = await call("GET", { action: "register", stamp: reg ? reg.stamp : "" });
      sourceError = g.source_error || "";
      if (!g.same) { reg = { stamp: g.stamp, fields: g.fields, rows: g.rows, flags: g.flags || [], missing: g.missing || [] }; saveReg(); indexReg(); }
    }
  } catch (e) {
    lastError = e.server ? e.message : "";
    if (!e.server) online = false;
    if (!quiet && e.server) toast(e.message);
  } finally {
    syncing = false; render();
    if (editing) refreshDrawerHead();
    if (syncAgain && online && state.outbox.length) setTimeout(() => sync(true), 0);
  }
}

/* ---------- Local changes ---------- */
const shownOf = d => Object.assign({}, d, { checks: JSON.stringify(d.checks || {}), prev_modules: JSON.stringify(d.prev_modules || []) });
function queueSave(id, data, baseOverride) {
  const cur = recOf(id) || { id, version: 0 };
  const o = state.outbox.find(x => x.id === id);
  if (o) { o.data = data; o.rev++; if (baseOverride !== undefined) o.baseVersion = baseOverride; }
  else state.outbox.push({ type: "save", id, baseVersion: baseOverride !== undefined ? baseOverride : Number(cur.version) || 0, data, rev: 1 });
  state.items[id] = Object.assign({}, cur, shownOf(data), { holder: data.holder || cur.holder || (state.me ? state.me.name : "") });
  save(); render(); sync(true);
}

    <h3 class="sec" style="margin-top:16px">Previous module</h3>
    <div class="tblwrap"><table class="tbl mods"><thead><tr><th style="width:42%">Module no.</th><th>Remarks</th></tr></thead><tbody>
      ${draft.prev_modules.map((m, i) => `<tr><td><input data-mod="${i}" data-k="no" value="${esc(m.no)}" aria-label="Module no. ${i + 1}" ${dis}></td><td><input data-mod="${i}" data-k="remarks" value="${esc(m.remarks)}" aria-label="Module remarks ${i + 1}" ${dis}></td></tr>`).join("")}
    </tbody></table></div>
    ${g.module_no && can && !draft.prev_modules.some(m => m.no === g.module_no) ? `<p class="note"><button class="btn sm" id="useMod">Use ${esc(g.module_no)} from LAD BAL (MOD)</button></p>` : ""}
    <label class="f" style="margin-top:14px"><span>Notes</span><textarea id="dNotes" maxlength="1000" ${dis}>${esc(draft.notes)}</textarea></label>
    <p class="note">${[draft.date_returned ? "Returned " + fmtDate(draft.date_returned) : "", draft.date_complete ? "Complete " + fmtDate(draft.date_complete) : "",
      rec && rec.updated_by ? "Last saved by " + esc(rec.updated_by) + " " + fmtTime(rec.updated_at) : ""].filter(Boolean).join(" · ")}</p>
    <div id="dHist"></div>`;
  buttons();
}
function readForm() {
  if (!editing || !$("dTax")) return;
  draft.tax_dec = $("dTax").value.trim(); draft.date_received = $("dRec").value; draft.notes = $("dNotes").value.trim(); draft.lh_status = $("dLhs").value;
  if (isAdmin()) draft.holder = $("dHolder").value;
  document.querySelectorAll("#ck .ckrow").forEach(row => {
    const id = row.dataset.item, c = draft.checks[id] || {};
    c.r = row.querySelector("[data-rem]").value.trim(); c.f = row.querySelector("[data-fu]").checked;
    if (c.m || c.r || c.f) draft.checks[id] = c; else delete draft.checks[id];
  });
  document.querySelectorAll("[data-mod]").forEach(el => { draft.prev_modules[+el.dataset.mod][el.dataset.k] = el.value.trim(); });
}
const marked = () => ITEMS.filter(it => (draft.checks[it.id] || {}).m).length;
const lackIds = () => ITEMS.filter(it => (draft.checks[it.id] || {}).m === "L");
function buttons() {
  const can = canEdit(editing), st = draft.verification;
  $("fSave").hidden = !can; $("fReturn").hidden = !can || st === "Complete" || st === "Returned for compliance";
  $("fRound").hidden = !can || st !== "Returned for compliance";
  $("fDone").hidden = !can || st === "Complete"; $("fReopen").hidden = !can || st !== "Complete";
  $("fHist").hidden = !recOf(editing) || !recOf(editing).version;
}
function commit(next) {
  readForm();
  const d = JSON.parse(JSON.stringify(draft));
  Object.assign(d, next || {});
  d.prev_modules = d.prev_modules.filter(m => m.no || m.remarks);
  Object.keys(d.checks).forEach(k => { const c = d.checks[k]; if (!c.m && !c.r && !c.f) delete d.checks[k]; });
  if (d.verification === "Pending" && Object.values(d.checks).some(c => c.m)) d.verification = "Ongoing Verification";
  const before = draftFrom(editing); before.prev_modules = before.prev_modules.filter(m => m.no || m.remarks);
  if (recOf(editing) && JSON.stringify(EDIT.map(k => d[k])) === JSON.stringify(EDIT.map(k => before[k]))) { closeDrawer(); return toast("No change to save."); }
  queueSave(editing, d);
  toast("Saved on this device" + (online ? "; sending to the Sheet." : ". It goes to the Sheet when online."));
  closeDrawer();
}
function closeDrawer() { $("scrim").hidden = $("drawer").hidden = true; editing = null; draft = null; }
async function showHistory() {
  $("dHist").innerHTML = '<p class="muted">Loading history…</p>';
  try {
    const h = await call("GET", { action: "history", id: editing });
    $("dHist").innerHTML = `<div class="hist"><b>History</b>${h.history.slice().reverse().map(x => `<div><span class="mono">v${x.version}</span> · ${esc(fmtTime(x.time))} · ${esc(x.by)}<br><span class="muted">${esc(describe(x.changed))}</span></div>`).join("") || "<div>No saved versions.</div>"}</div>`;
  } catch (e) { $("dHist").innerHTML = `<p class="muted">History needs a connection. ${esc(e.message)}</p>`; }
}
function describe(changed) {
  const c = parse(changed, {}), out = [];
  Object.keys(c).forEach(k => {
    if (k === "checks") { const m = parse(c[k], {}); out.push("checklist: " + (Object.entries(m).filter(([, v]) => v.m).map(([i, v]) => ((ITEMS.find(x => x.id === i) || { label: i }).label.split(" (")[0]) + " " + MARK[v.m]).join(", ") || "cleared")); }
    else if (k === "prev_modules") out.push("previous module: " + (parse(c[k], []).map(x => x.no).join(", ") || "cleared"));
    else out.push(k.replace(/_/g, " ") + ": " + (c[k] || "—"));
  });
  return out.join(" · ");
}

/* ---------- Printing ---------- */
function printForm(id) {
  const g = id ? regById[id] || {} : {};
  if (id && editing === id) readForm();
  const d = id ? (editing === id ? draft : draftFrom(id)) : { checks: {}, prev_modules: [], tax_dec: "" };
  const mods = d.prev_modules.filter(m => m.no || m.remarks);
  while (mods.length < 3) mods.push({ no: "", remarks: "" });
  const line = (k, v) => `<tr><td style="width:38%">${k}</td><td>${esc(v || "")}</td></tr>`;
  $("print").innerHTML = `<h1>RSS VERIFICATION CHECKLIST</h1><p class="sub">Requisition for Survey Services · DARPO Masbate</p>
    <table class="head">${line("LHID", g.lhid)}${line("Landowner", g.landowner)}${line("Location", [g.barangay, g.municipality].filter(Boolean).join(", "))}${line("Title no. / Lot no.", [g.title, g.lot].filter(Boolean).join(" / "))}${line("Area (ha)", g.area)}${line("RSS no. / date", [g.rss_no, g.rss_date].filter(Boolean).join(" / "))}${line("Status of landholding", id ? (g.inside ? "Inside balance" : "Outside balance") : "")}</table>
    <h2>DOCUMENTARY REQUIREMENTS:</h2>
    <table><thead><tr><th class="m"></th><th>Documents</th><th style="width:38%">Remarks</th></tr></thead><tbody>
      ${ITEMS.map(it => { const c = d.checks[it.id] || {}; return `<tr><td class="m">${c.m ? MARK[c.m] : ""}</td><td>${esc(it.label)}${it.id === "taxdec" ? " " + (d.tax_dec ? "<u>" + esc(d.tax_dec) + "</u>" : "________________") : ""}</td><td>${c.r ? (c.f ? "☑ " : "☐ ") + esc(c.r) : ""}</td></tr>`; }).join("")}
    </tbody></table>
    <h2>PREVIOUS MODULE:</h2>
    <table><thead><tr><th class="m"></th><th>Module No.</th><th style="width:45%">Remarks</th></tr></thead><tbody>
      ${mods.map(m => `<tr><td class="m">${m.no ? "✓" : ""}</td><td>${esc(m.no)}&nbsp;</td><td>${esc(m.remarks)}</td></tr>`).join("")}</tbody></table>
    ${id ? `<p>Verification: <b>${esc(d.verification || "Pending")}</b>${d.round > 1 ? ", round " + d.round : ""}${d.notes ? "<br>Notes: " + esc(d.notes) : ""}</p>` : ""}
    <div class="sig"><span>Verified by: ${esc(id && d.holder ? d.holder : "______________________")}</span><span>Date: ${id && d.date_complete ? fmtDate(d.date_complete) : "______________"}</span></div>
    <p class="foot">DARMSBT-LTISUR-F-01 REV 00 · printed ${new Date().toLocaleString("en-PH")} from RSS Verification Desk</p>`;
  window.print();
}

function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 3400); }

/* ---------- Events ---------- */
$("tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) { view = t.dataset.v; render(); } });
$("syncBtn").onclick = () => sync(false);
$("scrim").onclick = closeDrawer; $("dClose").onclick = closeDrawer;
$("fSave").onclick = () => commit();
$("fReturn").onclick = () => {
  readForm();
  const l = lackIds();
  if (!l.length) { $("fErr").textContent = "Mark at least one document lacking (✗) to return the RSS for compliance."; return; }
  const bare = l.filter(it => !(draft.checks[it.id] || {}).r);
  if (bare.length) { drawDrawer(); $("fErr").textContent = "Write a remark for every lacking document first: " + bare.map(x => x.label.split(" (")[0]).join(", ") + "."; return; }
  commit({ verification: "Returned for compliance", date_returned: today() });
};
$("fRound").onclick = () => {
  readForm();
  if (!confirm("Compliance received? Round " + (draft.round + 1) + " starts, and the " + lackIds().length + " lacking document(s) are cleared for checking again. Their remarks stay.")) return;
  lackIds().forEach(it => { draft.checks[it.id].m = ""; });
  draft.round += 1; draft.verification = "Ongoing Verification";
  drawDrawer(); $("fErr").textContent = ""; toast("Round " + draft.round + ": check the documents again, then Save.");
};
$("fDone").onclick = () => {
  readForm();
  if (marked() < ITEMS.length) { $("fErr").textContent = (ITEMS.length - marked()) + " document(s) not marked yet. Mark every document ✓ or N/A."; return; }
  if (lackIds().length) { $("fErr").textContent = "A lacking document cannot be complete. Return the RSS for compliance instead."; return; }
  commit({ verification: "Complete", date_complete: today() });
};
$("fReopen").onclick = () => { readForm(); draft.verification = "Ongoing Verification"; draft.date_complete = ""; drawDrawer(); toast("Reopened. Save to keep it."); };
$("fPrint").onclick = () => printForm(editing);
$("fHist").onclick = showHistory;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("drawer").hidden) closeDrawer(); });

$("dBody").addEventListener("click", e => {
  const b = e.target.closest("[data-mark]");
  if (b && !b.disabled) {
    readForm();
    const id = b.closest(".ckrow").dataset.item, c = draft.checks[id] = draft.checks[id] || {};
    c.m = c.m === b.dataset.mark ? "" : b.dataset.mark;
    if (draft.verification === "Pending" && c.m) draft.verification = "Ongoing Verification";
    const top = $("dBody").scrollTop;
    $("fErr").textContent = ""; drawDrawer(); $("dBody").scrollTop = top;
    const row = document.querySelector(`.ckrow[data-item="${id}"]`);
    if (row && c.m === "L" && !c.r) row.querySelector("[data-rem]").focus({ preventScroll: true });
    return;
  }
  if (e.target.id === "useMod") {
    readForm();
    const g = regById[editing], i = draft.prev_modules.findIndex(m => !m.no);
    if (i >= 0) draft.prev_modules[i].no = g.module_no; else draft.prev_modules.push({ no: g.module_no, remarks: "" });
    drawDrawer();
  }
});

$("main").addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-lhs]")) return;
  const row = t.closest("tr[data-id]"); if (row) return openDrawer(row.dataset.id);
  const bal = t.closest("[data-bal]"); if (bal) { fBal = bal.dataset.bal; shown = PAGE; return render(); }
  if (t.id === "fMine") { fMine = !fMine; shown = PAGE; return render(); }
  if (t.id === "fClear") { fStat = fTown = fText = ""; fMine = false; fBal = "in"; shown = PAGE; return render(); }
  if (t.id === "more") { shown += PAGE; return render(); }
  if (t.id === "pBlank") return printForm(null);
  const act = t.closest("[data-act]");
  if (act) {
    const i = +act.dataset.i, p = state.problems[i];
    if (act.dataset.act === "open") return openDrawer(p.id, p.mine);
    state.problems.splice(i, 1); save();
    if (act.dataset.act === "mine") { const s = recOf(p.id); return queueSave(p.id, p.mine, s ? Number(s.version) || 0 : 0); }
    return render();
  }
  if (t.id === "cSave") {
    if (!okAddr($("cUrl").value.trim())) return toast("That is not a Google Apps Script web app address. It looks like https://script.google.com/macros/s/…/exec");
    if (state.outbox.length && $("cKey").value.trim().toUpperCase() !== state.cfg.key) return toast(state.outbox.length + " change(s) are not sent yet under the current key. Sync first.");
    state.cfg.url = $("cUrl").value.trim(); state.cfg.key = $("cKey").value.trim().toUpperCase(); state.lastPull = ""; lastError = ""; save(); awSignin(state.cfg.url, state.cfg.key);
    return sync(false).then(() => { if (state.me) toast("Connected as " + state.me.name); });
  }
  if (t.id === "cForget") {
    if (state.outbox.length) return toast(state.outbox.length + " change(s) are not sent yet. Sync first.");
    if (!confirm("Remove the register and the records kept on this device? They are read again from the Sheet at the next sync.")) return;
    const cfg = state.cfg; state = blank(); state.cfg = cfg; reg = null; indexReg(); save();
    try { localStorage.removeItem(LS_REG); } catch (err) {}
    return render();
  }
});
let qT;
$("main").addEventListener("input", e => { if (e.target.id === "q") { clearTimeout(qT); qT = setTimeout(() => { fText = e.target.value; shown = PAGE; render(); }, 200); } });
$("main").addEventListener("change", e => {
  if (e.target.id === "fStat") { fStat = e.target.value; shown = PAGE; render(); }
  if (e.target.id === "fTown") { fTown = e.target.value; shown = PAGE; render(); }
  if (e.target.dataset.lhs) {
    const id = e.target.dataset.lhs;
    queueSave(id, Object.assign(draftFrom(id), { lh_status: e.target.value }));
    toast("Status saved on this device" + (online ? "; sending to the Sheet." : ". It goes to the Sheet when online."));
  }
});

// Theme from the ACE Workbench shell when shown inside it.
window.addEventListener("message", e => { if (e.data && e.data.type === "aw-theme") { if (e.data.theme) document.documentElement.dataset.theme = e.data.theme; else delete document.documentElement.dataset.theme; } });
window.addEventListener("online", () => { online = true; sync(true); });
window.addEventListener("offline", () => { online = false; renderSync(); });
window.addEventListener("storage", e => { if (e.key === LS && !editing) { state = load(); render(); } if (e.key === LS_REG) { reg = loadReg(); indexReg(); render(); } });
setInterval(() => { if (!document.hidden && !editing) sync(true); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(true); });
save(); render(); sync(true);
</script>
</body>
</html>
