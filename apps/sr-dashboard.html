<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SR Status Dashboard</title>
<!--
  SR Status Dashboard: survey status of the SR Verification Desk's SRs, one pie per kind of survey, with the attachments of the SRs at a status.
  Reads the SR Desk's own copy on this PC (localStorage "srdesk-v1": register, records, unsynced queue), so it must be
  opened from the same place as sr-desk.html (same folder on the same server, or both as files). It never writes anything.
  With no SR Desk data on this PC it shows made-up sample data, marked as such.
  Copy of record: outputs/sr-verification-desk/app/sr-dashboard.html; outputs/app-hub/apps/sr-dashboard.html is a verbatim copy.
-->
<style>
:root {
  --bg: #070b14; --surface: #0d1424; --surface-2: #121b30; --line: #1d2a44; --grid: #16213a;
  --fg: #e6eefc; --muted: #8b9bb8; --faint: #5d6c88;
  --cyan: #22c3e6; --in: #3987e5; --out: #d95926; --endorse: #199e70; --comply: #c98500; --days: #9085e9;
  --good: #0ca30c; --warn: #fab219; --crit: #e66767;
  --mono: "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
  --body: "Segoe UI", system-ui, -apple-system, sans-serif;
  --panel-bg: linear-gradient(180deg, rgba(18,27,48,.85), rgba(13,20,36,.85)); --ctrl-bg: rgba(13,20,36,.7); --chip-bg: rgba(7,11,20,.6);
  --tip-bg: rgba(7,11,20,.94); --sunk: rgba(7,11,20,.35); --banner-fg: #f6d58a; --hi: rgba(34,195,230,.07); --hi-2: rgba(34,195,230,.12);
  --grid-line: rgba(34,195,230,.035); --glow-a: rgba(34,195,230,.13); --glow-b: rgba(144,133,233,.10);
  color-scheme: dark;
}
/* Light theme (2026-11-20): follows the Survey Unit panel's choice (message "aw-theme", or aw.theme on this device), else the system setting. */
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f6fb; --surface: #ffffff; --surface-2: #eef2f8; --line: #d3dbe8; --grid: #e2e8f1; --fg: #142033; --muted: #52627c; --faint: #7d8ca5; --cyan: #0a87a8;
  --panel-bg: #ffffff; --ctrl-bg: #ffffff; --chip-bg: #f6f8fc; --tip-bg: rgba(255,255,255,.97); --sunk: #f7f9fc; --banner-fg: #6b4a00; --hi: rgba(10,135,168,.07); --hi-2: rgba(10,135,168,.12);
  --grid-line: rgba(10,135,168,.05); --glow-a: rgba(10,135,168,.08); --glow-b: rgba(144,133,233,.07); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f3f6fb; --surface: #ffffff; --surface-2: #eef2f8; --line: #d3dbe8; --grid: #e2e8f1; --fg: #142033; --muted: #52627c; --faint: #7d8ca5; --cyan: #0a87a8;
  --panel-bg: #ffffff; --ctrl-bg: #ffffff; --chip-bg: #f6f8fc; --tip-bg: rgba(255,255,255,.97); --sunk: #f7f9fc; --banner-fg: #6b4a00; --hi: rgba(10,135,168,.07); --hi-2: rgba(10,135,168,.12);
  --grid-line: rgba(10,135,168,.05); --glow-a: rgba(10,135,168,.08); --glow-b: rgba(144,133,233,.07); color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; min-height: 100vh;
  background-image:
    radial-gradient(900px 500px at 85% -10%, var(--glow-a), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, var(--glow-b), transparent 60%),
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: auto, auto, 32px 32px, 32px 32px; background-attachment: fixed; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* Header */
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); display: flex; align-items: center; gap: 8px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: pulse 2s infinite; }
.live.off { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
h1 { margin: 4px 0 2px; font-size: 26px; font-weight: 600; letter-spacing: .01em; }
.src { color: var(--muted); font-size: 12.5px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.msel { position: relative; font-size: 12.5px; }
.msel summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--ctrl-bg); color: var(--fg); border-radius: 8px; padding: 6px 10px; max-width: 300px; white-space: nowrap; user-select: none; }
.msel summary::-webkit-details-marker { display: none; }
.msel .ms-l { color: var(--muted); }
.msel .ms-v { overflow: hidden; text-overflow: ellipsis; font-weight: 600; min-width: 0; }
.msel .ms-n { color: var(--muted); font-weight: 400; }
.msel .ms-c { color: var(--muted); font-size: 10px; }
.msel.on summary { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
.msel.off summary { opacity: .5; cursor: not-allowed; }
.msel .ms-pop { position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; width: max-content; min-width: 260px; max-width: min(380px, calc(100vw - 16px)); max-height: 340px; overflow: auto;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.28); padding: 6px; }
.msel .ms-act { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 2px 4px 6px; margin-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
.msel .ms-act button { border: 0; background: none; color: var(--cyan); cursor: pointer; font: inherit; padding: 2px 4px; }
.msel .ms-act button[disabled] { color: var(--muted); opacity: .5; cursor: default; }
.msel .ms-pop label { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px; border-radius: 6px; cursor: pointer; }
.msel .ms-pop label:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.msel .ms-pop input { accent-color: var(--cyan); margin: 0; }
.msel .ms-pop b { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--ctrl-bg); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; color: var(--muted); cursor: pointer; font-family: var(--mono); font-size: 12px; }
.seg button[aria-pressed="true"] { background: rgba(34,195,230,.14); color: var(--fg); box-shadow: inset 0 0 0 1px rgba(34,195,230,.45); }
.btn { border: 1px solid var(--line); background: var(--ctrl-bg); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.btn:hover, .seg button:hover { color: var(--fg); }

.banner { border: 1px solid rgba(250,178,25,.45); background: rgba(250,178,25,.08); color: var(--banner-fg); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
.banner b { color: var(--warn); }
.filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 10px 12px; align-items: end; margin-bottom: 12px; padding: 12px 16px; }
.filters label { display: grid; gap: 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.filters select { font: 13px var(--body); letter-spacing: 0; text-transform: none; color: var(--fg); background-color: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 28px 7px 10px; width: 100%; min-width: 0; appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--cyan) 50%), linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.filters select.on { border-color: rgba(34,195,230,.7); box-shadow: 0 0 0 1px rgba(34,195,230,.35), 0 0 14px rgba(34,195,230,.18); }
.filters option { background: var(--surface); color: var(--fg); }
.filters .btn[disabled] { opacity: .4; cursor: default; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.chips:empty { display: none; }
.chip { font-family: var(--mono); font-size: 11.5px; color: var(--fg); background: rgba(34,195,230,.12); border: 1px solid rgba(34,195,230,.4); border-radius: 999px; padding: 2px 4px 2px 10px; display: inline-flex; align-items: center; gap: 4px; }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--fg); }
.snap { display: grid; gap: 8px; }
.snap .row { display: grid; grid-template-columns: minmax(0, 230px) 1fr 220px; gap: 12px; align-items: center; font-size: 12.5px; }
.snap .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.snap .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snap .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; box-shadow: 0 0 8px currentColor; }
.snap .track { height: 10px; border-radius: 0 5px 5px 0; background: rgba(139,155,184,.08); overflow: hidden; }
.snap .track i { display: block; height: 100%; border-radius: 0 5px 5px 0; box-shadow: 0 0 12px currentColor; animation: grow .9s ease-out both; transform-origin: left; }
.snap .n { font-family: var(--mono); text-align: right; color: var(--fg); }
.snap .n small { color: var(--muted); margin-left: 6px; }
.snap .n .alt { color: var(--muted); }
@keyframes grow { from { transform: scaleX(0); } }
.legend button { border: 1px solid var(--line); background: var(--chip-bg); border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 12px; color: var(--fg); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; }
.legend button[aria-pressed="false"] { color: var(--faint); }
.legend button[aria-pressed="false"] i { opacity: .25; box-shadow: none; }
.legend.big { margin: 4px 0 10px; }
.pill-commit { display: inline-block; margin-top: 3px; font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 999px; color: var(--fg); background: rgba(34,195,230,.14); box-shadow: inset 0 0 0 1px rgba(34,195,230,.45); white-space: nowrap; }
.cover { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.cover b { color: var(--cyan); }

/* Panels */
.panel { position: relative; background: var(--panel-bg); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; backdrop-filter: blur(6px); }
.panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; border-color: rgba(34,195,230,.6); border-style: solid; pointer-events: none; }
.panel::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; border-top-left-radius: 12px; }
.panel::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; border-bottom-right-radius: 12px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.kpi .k { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font-family: var(--mono); font-size: 34px; font-weight: 600; margin: 6px 0 2px; letter-spacing: -.02em; text-shadow: 0 0 18px rgba(34,195,230,.25); }
.kpi .v small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.kpi .s { color: var(--muted); font-size: 12.5px; }
.delta { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
.delta.up-bad, .delta.down-bad { color: #ffb4b4; background: rgba(230,103,103,.15); }
.delta.up-good, .delta.down-good { color: #9be89b; background: rgba(12,163,12,.16); }
.delta.flat { color: var(--muted); background: rgba(139,155,184,.12); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.wide { grid-column: 1 / -1; }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }
.chart-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.read { color: var(--muted); font-size: 12.5px; margin: 2px 0 8px; }
.read b { color: var(--fg); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; box-shadow: 0 0 8px currentColor; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--crit) 0 4px, transparent 4px 7px) !important; box-shadow: none; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--faint); font-family: var(--mono); font-size: 11px; }
.chart .end-label { fill: var(--fg); font-size: 12px; font-weight: 600; }
.tip { position: absolute; pointer-events: none; background: var(--tip-bg); border: 1px solid rgba(34,195,230,.5); border-radius: 8px; padding: 8px 10px;
  font-size: 12px; min-width: 150px; box-shadow: 0 0 24px rgba(34,195,230,.18); opacity: 0; transition: opacity .12s; z-index: 5; }
.tip .t { font-family: var(--mono); color: var(--cyan); font-size: 11px; letter-spacing: .08em; margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); }
.tip .r b { font-family: var(--mono); color: var(--fg); font-weight: 600; }
.tip .r i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.notes { margin-top: 12px; color: var(--muted); font-size: 12.5px; }
.notes ul { margin: 6px 0 0; padding-left: 18px; }
.notes li { margin: 2px 0; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
td { font-family: var(--mono); }
.table-scroll { overflow-x: auto; }
#table-wrap[hidden] { display: none; }

.pie { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); gap: 16px 32px; align-items: center; }
.pie svg { max-width: 320px; height: auto; margin: 0 auto; }
.pie .grow { transform-origin: 150px 150px; animation: spin 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes spin { from { transform: rotate(-120deg) scale(.6); opacity: 0; } }
.pie .slice { transition: transform .18s ease-out, opacity .18s; cursor: pointer; }
.chart .c-v { fill: var(--fg); font-size: 22px; font-weight: 600; }
.chart .c-l { fill: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.chart .c-w { fill: var(--cyan); font-size: 11px; }
.pie-list { display: grid; gap: 4px; min-width: 0; }
.pie-list .pr { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 44px 78px; gap: 10px; align-items: center; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; border: 1px solid transparent; }
.pie-list .pr.on { background: var(--hi); border-color: var(--line); }
.pie-list.both .pr { grid-template-columns: 10px minmax(0, 1fr) 52px 84px 44px 60px; }
.pie-list.both .n.alt { color: var(--muted); }
.pie-list .pr.hd { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding-top: 0; }
.pie-list .pr.hd span:nth-child(n+3) { text-align: right; }
.pie-list .sw { width: 10px; height: 10px; border-radius: 3px; box-shadow: 0 0 8px currentColor; }
.pie-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pie-list .n { font-family: var(--mono); color: var(--fg); text-align: right; }
.pie-list .p { font-family: var(--mono); color: var(--muted); text-align: right; }
.pie-list .pr > span:last-child { text-align: right; }
.pie-list .pr.sub { padding-top: 2px; padding-bottom: 2px; font-size: 12px; color: var(--muted); }
.pie-list .pr.sub .nm { padding-left: 14px; position: relative; }
.pie-list .pr.sub .nm::before { content: ""; position: absolute; left: 2px; top: -6px; width: 7px; height: 12px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); border-bottom-left-radius: 3px; }
.pie-list .pr.sub .sw { width: 8px; height: 8px; justify-self: center; }
.pie-list .pr.sub .n { color: var(--fg); }
.pie-list .sub-note { font-family: var(--mono); font-size: 10.5px; color: var(--faint); padding: 4px 8px 0; letter-spacing: .04em; }
.pie .sub-arc { transition: transform .18s ease-out, opacity .18s; cursor: pointer; }
.week { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.week[hidden] { display: none; }
.week input[type=range] { flex: 1; min-width: 0; accent-color: var(--cyan); cursor: pointer; }
.week .btn { padding: 3px 10px; font-family: var(--mono); }
.week .btn[disabled] { opacity: .4; cursor: default; }
.week b { color: var(--fg); font-weight: 600; white-space: nowrap; }
.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.ping { animation: ping 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ping { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0; } .ping, .live, .pie .grow { animation: none; } }

/* Per-kind panels (2026-11-20) */
.kinds { display: grid; gap: 22px; }
/* Each kind of survey is its own island: a colour band down the left, a tinted header strip and the kind's name on a badge (--kc set per panel). */
.kindp { border-left: 5px solid var(--kc); padding-top: 0; overflow: hidden; }
.kindp::before { border-color: var(--kc); }
.kind-head { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin: 0 -18px 12px -18px; padding: 12px 18px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--kc) 22%, transparent), color-mix(in srgb, var(--kc) 4%, transparent)); border-bottom: 1px solid color-mix(in srgb, var(--kc) 45%, transparent); }
.kind-head h2 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kind-badge { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .06em; padding: 3px 10px; border-radius: 6px; background: var(--kc); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.kind-head .right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
/* Drag to rearrange: the grip on each kind's header. While dragging, every kind folds to its header so the list is short enough to drop anywhere. */
.grip { border: 1px solid transparent; background: none; color: var(--muted); cursor: grab; padding: 4px 6px; border-radius: 6px; font-size: 16px; line-height: 1; touch-action: none; user-select: none; }
.grip:hover, .grip:focus-visible { color: var(--fg); border-color: var(--line); background: var(--ctrl-bg); }
.kinds.reordering { gap: 10px; }
.kinds.reordering .kindp > :not(.kind-head) { display: none; }
.kinds.reordering .kind-head { margin-bottom: 0; }
.kinds.reordering, .kinds.reordering * { cursor: grabbing !important; user-select: none; }
.kindp.dragging { opacity: .85; box-shadow: 0 0 0 2px var(--kc), 0 10px 30px rgba(0,0,0,.35); z-index: 2; }
.kindp.moved { animation: kmoved .7s ease-out; }
@keyframes kmoved { from { box-shadow: 0 0 0 3px var(--kc); } to { box-shadow: 0 0 0 0 transparent; } }
.order-reset { margin-left: 8px; }
/* ALL kinds panel (2026-11-23): above the kinds, with each kind's share of it as chips under the header. */
.kinds-all { margin-bottom: 22px; }
.kinds-all:empty { display: none; }
.kind-split { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: -2px 0 12px; font-size: 12px; color: var(--muted); }
.kind-split span { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--chip-bg); }
.kind-split i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.kind-split b { color: var(--fg); font-family: var(--mono); font-weight: 600; }
.lh tbody tr[data-seq] { cursor: pointer; }
.lh tbody tr[data-seq]:hover td { background: var(--hi); }
.lh .open { color: var(--cyan); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
@media print {
  :root { --bg: #fff; --surface: #fff; --surface-2: #f1f4f8; --line: #c9d1dd; --grid: #e2e8f1; --fg: #111; --muted: #444; --faint: #666; --cyan: #0a6f8a;
    --panel-bg: #fff; --ctrl-bg: #fff; --chip-bg: #fff; --sunk: #fff; --hi: transparent; --hi-2: #eef3f8; color-scheme: light; }
  body { background: #fff !important; }
  .controls, .btn, .grip, .hint, .tip, .cat-edit, .notes, #banner, .lh .open { display: none !important; }
  body.print-one .kinds > .panel:not(.print-me) { display: none !important; }
  .panel { break-inside: auto; backdrop-filter: none; box-shadow: none; }
  .pie { break-inside: avoid; } .pie .grow, .att-in { animation: none !important; }
  .kind-head { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .kind-badge, .sw, .pie svg, .legend i { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pie-list .nm { white-space: normal; }
  .table-scroll { overflow: visible; } .lh tbody tr[data-seq]:hover td { background: none; }
  .tt-bar, .tt-filter, .tt-note { display: none !important; }
}
.hint { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin: 10px 0 0; }
.pie .slice, .pie-list .pr[data-k], .pie-list .pr[data-s] { cursor: pointer; }
.pie-list .pr.pick { background: var(--hi-2); border-color: rgba(34,195,230,.5); }
.att { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; }
.att:empty { display: none; }
.att-in { animation: attIn .45s cubic-bezier(.2,.8,.2,1) both; transform-origin: top center; }
@keyframes attIn { from { opacity: 0; transform: translateY(-10px) scale(.97); } }
.att .pie { grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); }
.att .pie svg { max-width: 240px; }
.att h3, .cat h3 { margin: 0; font-size: 14px; font-weight: 600; }
.att .chart-head .btn, .cat .btn { padding: 4px 10px; }
.cat { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--sunk); }
.cat-edit { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; display: grid; gap: 10px; }
.cat-pick { display: grid; gap: 2px; max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.cat-pick label { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 4px; font-size: 13px; cursor: pointer; }
.cat-pick label:hover { background: var(--hi); }
.cat-pick label[hidden] { display: none; }
.cat-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cat-row input { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--bg); color: var(--fg); font: 13px var(--body); }
.cat .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.btn.primary { color: var(--bg); background: var(--cyan); border-color: var(--cyan); font-weight: 600; }
.rem-empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px 14px; text-align: center; color: var(--muted); font-size: 13px; }
.lh td { font-family: var(--body); white-space: normal; text-align: left; }
.lh td.mono { font-family: var(--mono); }
.lh .sub { color: var(--muted); font-size: 11.5px; }
@media (max-width: 600px) { .att .pie { grid-template-columns: 1fr; } }
@media (max-width: 900px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .pie { grid-template-columns: 1fr; } .pie-list .pr { grid-template-columns: 10px minmax(0, 1fr) auto 40px 64px; gap: 8px; } .snap .row { grid-template-columns: minmax(0, 1fr) auto; } .snap .track { grid-column: 1 / -1; grid-row: 2; } }
@media (max-width: 480px) { .filters { grid-template-columns: 1fr; } .kpi .v { font-size: 28px; } h1 { font-size: 22px; } .panel { padding: 14px; } }
@media print { body { background: #fff; color: #000; } .controls { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow"><span class="live" id="live"></span>SR Verification Desk · Survey status</div>
      <h1>Where the SRs are</h1>
      <div class="src" id="src">Loading…</div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Commitment for registration" id="commit"><button data-c="all">All LHs</button><button data-c="in">Commitment</button><button data-c="out">Not commitment</button></div>
      <span id="f-odc-box"></span><span id="f-ali-box"></span>
      <div class="seg" role="group" aria-label="Measure" id="metric"><button data-m="count">SRs</button><button data-m="area">Area (ha)</button></div><button class="btn" id="export-xlsx" title="Download the SRs shown (Commitment filter applied) as an Excel file: SRs, Summary, Missing documents">Export to Excel</button><button class="btn order-reset" id="order-reset" hidden title="Put the kinds of survey back in order by name">Reset order</button>
    </div>
  </header>
  <div id="banner"></div>
  <!-- One panel per kind of survey: survey status pie; a status click opens the attachments pie of its SRs; a missing document opens its remark categories. -->
  <!-- ALL kinds together (2026-11-23): one survey status pie of every SR shown, whatever its kind; always first, not dragged. -->
  <section class="kinds kinds-all" id="kinds-all"></section>
  <section class="kinds" id="kinds"></section>
  <div class="notes" id="notes"></div>
</div>

<script>
"use strict";
/* ---------- Data: the SR Desk's copy on this PC ---------- */
const STORE = "srdesk-v1";
const AT_DARPO = "SR AT DARPO";
const SURVEYS = ["CONDUCTED INITIAL PULONG PULONG", "COMPLETED FIELDWORK", "SR AT DARPO", "SR RECEIVED BY RPMO",
  "SR TRANSMITTED TO LMS FOR IVAS", "SR TRANSMITTED TO CPMO FOR LRA APPROVAL", "SR TRANSMITTED TO LRA FOR APPROVAL",
  "ASP FROM LMS RECEIVED BY RPMO", "ASP FROM LMS RECEIVED BY CPMO", "ASP FROM LRA RECEIVED BY CPMO", "ASP FROM LRA RECEIVED BY RPMO",
  "ASP FROM LMS RECEIVED BY PPMO", "ASP FROM LRA RECEIVED BY PPMO", "FOR REPLACEMENT"];
const OLD_STATUS = { "Received": "Pending", "Awaiting SR": "Pending", "In verification": "Ongoing Verification", "Returned": "Compliance", "Endorsed": "" };
const isIso = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ""));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayNum = s => Math.round(new Date(s + "T00:00:00Z") / 86400000);
const isoOf = n => new Date(n * 86400000).toISOString().slice(0, 10);
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function mapSurvey(raw) { // same rule as sr-desk.html
  const t = String(raw || "").replace(/^\s*\d+(-[A-Z])?\s*-\s*/i, "").replace(/\s+/g, " ").trim().toUpperCase();
  if (/PULONG/.test(t)) return SURVEYS[0];
  return SURVEYS.includes(t) ? t : "";
}
// Area Validated (hectares) as a number; blank or unreadable is null, so it is counted as missing, never as 0 ha.
function toHa(v) { if (typeof v === "number") return isFinite(v) ? v : null; const n = parseFloat(String(v ?? "").replace(/,/g, "").trim()); return isFinite(n) ? n : null; }
function readDesk() {
  let s = null; try { s = JSON.parse(localStorage.getItem(STORE)); } catch (e) { s = null; }
  if (!s || !Array.isArray(s.register) || !s.register.length) return null;
  const recs = s.records || {}, queue = s.queue || {};
  const list = s.register.filter(reg => reg.kind !== "No batch tracker").map(reg => { // same rule as sr-desk.html: no kind of survey, not listed
    const q = queue[reg.seq], rec = recs[reg.seq];
    let d;
    if (q && q.data) d = Object.assign({}, q.data, { overrides: q.data.overrides || {} });
    else if (rec) d = { status: rec.status, survey: rec.survey || mapSurvey(reg.surveyStatus), received: rec.received || "", decided: rec.decided || "",
      statusDate: rec.status_date || "", rpmoReceived: rec.rpmo_received || "", verifier: rec.verifier || "", round: rec.round || 1, overrides: rec.overrides || {} };
    else { const sv = mapSurvey(reg.surveyStatus); d = { status: sv === AT_DARPO ? "Pending" : "", survey: sv, received: isIso(reg.srReceived) ? reg.srReceived : "",
      decided: "", statusDate: sv && isIso(reg.statusDate) ? reg.statusDate : "", verifier: "", round: 1 }; }
    if (Object.prototype.hasOwnProperty.call(OLD_STATUS, d.status)) { const old = d.status; d.status = OLD_STATUS[old]; if (!d.survey) d.survey = old === "Endorsed" ? "SR RECEIVED BY RPMO" : AT_DARPO; }
    const ov = d.overrides || {}; // an Admin's field corrections in the SR Desk win over the register
    return { seq: reg.seq, kind: reg.kind || "", darmo: ov.darmo ?? reg.darmo ?? "", marpo: ov.marpo ?? reg.marpo ?? "",
      status: d.status || "", survey: d.survey || "", received: d.received || "", decided: d.decided || "", statusDate: d.statusDate || "",
      rpmoReceived: d.rpmoReceived || "", round: d.round || 1, area: toHa(ov.area ?? reg.area),
      // Attachment marks and notes, for the attachments pie (same places sr-desk.html reads them)
      route: d.route || (rec && rec.route) || "", ans: d.ans || (rec && rec.data && rec.data.ans) || {}, notes: d.notes || (rec && rec.data && rec.data.notes) || {},
      claimant: ov.claimant ?? reg.claimant ?? "", title: ov.title ?? reg.title ?? "", lot: ov.lot ?? reg.lot ?? "", verifier: d.verifier || "",
      odc: ov.odc ?? reg.odc ?? "", ali: reg.ali ?? "" }; // MASBATE CCLOA ACCOUNTING columns P (ODC Status) and CA (OnALI 1), via the register
  });
  return { list, pulledAt: s.pulledAt || "", lastSync: s.lastSync || "", pending: Object.keys(queue).length, sample: false };
}
/* Made-up SRs for when this PC has no SR Desk data. Fixed seed, so the picture is the same each time.
   Each one walks through the statuses; like the real SR Desk, only its current status, that status's date and the DARPO/RPMO dates are kept. */
function sampleDesk() {
  let x = 20261116; const rnd = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
  const t = dayNum(todayIso()), list = [];
  const KS = ["2025-A", "2025-B", "SBA 3", "SBA 4"], DM = [["Sample DARMO North", ["Sample MARPO 1", "Sample MARPO 2"]], ["Sample DARMO South", ["Sample MARPO 3", "Sample MARPO 4"]]];
  const place = o => { const dm = DM[Math.floor(rnd() * 2)]; return Object.assign(o, { kind: KS[Math.floor(rnd() * 4)], darmo: dm[0], marpo: dm[1][Math.floor(rnd() * 2)] }); };
  const PATH = [[SURVEYS[0], 6, 20], [SURVEYS[1], 10, 35], [AT_DARPO, 5, 25], [SURVEYS[3], 4, 15], [SURVEYS[4], 15, 45], [SURVEYS[7], 0, 0]];
  for (let i = 0; i < 320; i++) {
    let day = t - Math.floor(rnd() * 150), k = 0;
    const s = { seq: "S" + i, status: "", received: "", decided: "", rpmoReceived: "", round: 1 };
    while (true) {
      if (PATH[k][0] === AT_DARPO) s.received = isoOf(day);
      if (PATH[k][0] === SURVEYS[3]) { s.decided = isoOf(day); s.rpmoReceived = isoOf(day); }
      const next = day + PATH[k][1] + Math.floor(rnd() * (PATH[k][2] - PATH[k][1] + 1));
      if (k === PATH.length - 1 || next > t) break;
      day = next; k++;
    }
    s.survey = PATH[k][0]; s.statusDate = isoOf(day);
    if (s.survey === AT_DARPO) { const q = rnd(); s.status = t - day > 14 && q < .45 ? "Compliance" : q > .55 ? "Ongoing Verification" : "Pending"; }
    if (s.status === "Compliance") s.decided = isoOf(day + 14);
    if (rnd() < .25 && k < 2) s.statusDate = ""; // some field statuses have no date, as in the trackers
    s.area = rnd() < .04 ? null : Math.round((0.3 + rnd() * rnd() * 12) * 10000) / 10000; // a few with no area, as in the register
    // Made-up attachment marks for SRs that reached DARPO, so the attachments pie has something to show
    s.route = rnd() < .5 ? "DENR" : "LRA"; s.ans = {}; s.notes = {}; s.claimant = "SAMPLE CLAIMANT " + i; s.title = "T-" + (1000 + i); s.lot = String(1 + i % 90);
    if (k >= 2 && rnd() < .85) { const a = s.ans[s.route] = {}, n = s.notes[s.route] = {};
      docList(s.route).forEach(d => { const q = rnd(); a[d.key] = d.asNeeded ? (q < .7 ? "na" : "present") : q < .12 ? "missing" : q < .2 && k === 2 ? undefined : "present";
        if (a[d.key] === "missing") n[d.key] = ["REPRINT", "For sign", "No copy", ""][Math.floor(rnd() * 4)]; }); }
    list.push(place(s));
  }
  return { list, pulledAt: "", lastSync: "", pending: 0, sample: true };
}

/* ---------- Status keys ---------- */
const HA = "\u0000ha"; // suffix of the area key next to each status's count
const statusOf = s => s.survey || NOT_SET;
/* ---------- Attachments (the SR Desk's "Attachments" tab) ----------
   Document lists: the same as CL[route].docGroups in sr-desk.html, and keyed the same way ("d<group>.<item>"); change both together.
   Marks: "present", "missing", "na"; notes: the verifier's remark on a document. */
const DOC_GROUPS = {
  DENR: [{ items: ["Plan (w/ dry seal of GE)", "CARP Survey Profile", "PARPO/MARPO/GE Joint Certification", "Certification as to Award Limit",
    "PHILARIS/ Verified copy of Title", "Field Notes Cover & GE Cert. duly notarized", "Field Notes Inside", "Transmittal of Survey Returns (3 copies)",
    "Assume & Traverse Computation (Original & Duplicate Copy)", "Lot Data Computation (Original & Duplicate Copy)", "Reference Data", "Validated DLSD File",
    "Order of Cancellation (if covered by approved subd. plan)", "Order of Rejection (if covered by unapproved subd. plan)",
    "PARPO/GE Joint Certification (DAR Contract)", "Certificate of Instrument Registration pursuant to Section 22, DMC 2007-29"] }],
  LRA: [{ items: ["Plan (in mylar or drafting film) duly signed and sealed by GE affiliated by LRA", "Certified True Copy of Title",
    "Duly Notarized Field Notes (signed by MARPO/CARPO & PARPO) and Notarized Field Notes Cover available at Provincial GEP Offices",
    "Lot Data Computation Original & Duplicate Copy (manual or computerized)", "Indorsement Letter from DAR SPLIT Operations"] },
    { asNeeded: true, items: ["Cadastral Map/LDC/LDS", "Previous Approved Plan", "If title is TCT under CLOA or E. Patent submit trace back of title to determine mode of Original Title"] },
    { items: ["CARP Survey Profile", "PARPO/MARPO /GE Joint Certification (2 copies)", "Certification as to Award Limit (2 copies)"] }]
};
function docList(route) { const out = []; (DOC_GROUPS[route] || []).forEach((g, gi) => g.items.forEach((t, i) => out.push({ key: `d${gi}.${i}`, text: t, asNeeded: !!g.asNeeded }))); return out; }
// Same label as a missing document's finding on the SR Desk dashboard, so remark categories are shared with it.
const missLabel = text => `Missing: ${text}`;
const COMPLETE = "Complete", PARTLY = "Partly marked", UNCHECKED = "Attachments not marked yet";
/* Each SR in srs: every document marked Missing counts it in that document's slice (an SR lacking two documents counts in both);
   with none missing it is Complete (every required document marked Present or N/A), Partly marked, or not marked yet. */
function attachStats(srs) {
  const miss = {}, rem = {}, groups = { [COMPLETE]: [], [PARTLY]: [], [UNCHECKED]: [] };
  srs.forEach(s => {
    const docs = docList(s.route), a = (s.ans || {})[s.route] || {}, nt = (s.notes || {})[s.route] || {};
    const marked = docs.filter(d => a[d.key]), missing = docs.filter(d => a[d.key] === "missing");
    if (!docs.length || !marked.length) { groups[UNCHECKED].push(s); return; }
    if (missing.length) { missing.forEach(d => { const l = missLabel(d.text); (miss[l] = miss[l] || []).push(s);
      (rem[l] = rem[l] || {})[s.seq] = String(nt[d.key] || "").trim() || "Missing (no remark)"; }); return; }
    groups[docs.every(d => d.asNeeded || a[d.key]) ? COMPLETE : PARTLY].push(s);
  });
  return { miss, rem, groups };
}
const RCAT_STORE = STORE + "-rcat"; // the SR Desk's remark categories (this device)
const remKey = t => String(t || "").trim().replace(/\s+/g, " ").toLowerCase(); // same as sr-desk.html
const loadRcats = () => { try { return JSON.parse(localStorage.getItem(RCAT_STORE)) || {}; } catch (e) { return {}; } };
const saveRcats = r => { try { localStorage.setItem(RCAT_STORE, JSON.stringify(r)); } catch (e) {} };

/* ---------- Pie chart (hand-drawn SVG donut, works offline). A click on a slice, ring part or key row calls opt.onPick. ---------- */
function pieChart(el, r, prev, opt) {
  const C = 150, R = 124, R0 = 76, RS0 = R + 5, RS1 = R + 19, id = el.id; // RS0-RS1: outer ring of sub-categories
  const sl = opt.series.map(s => ({ s, v: r[s.key] || 0 })).filter(o => o.v > 0);
  const sum = sl.reduce((a, o) => a + o.v, 0);
  if (!sum) { el.innerHTML = `<p class="read" style="padding:40px 0;text-align:center">${esc(opt.empty || "Nothing to draw.")}</p>`; return; }
  let a = 0; sl.forEach(o => { o.a0 = a; a += o.v / sum * 2 * Math.PI; o.a1 = a; o.mid = (o.a0 + o.a1) / 2; });
  const pt = (ang, rr) => (C + rr * Math.sin(ang)).toFixed(2) + "," + (C - rr * Math.cos(ang)).toFixed(2);
  const arc = (a0, a1, ro = R, ri = R0) => { a1 = Math.min(a1, a0 + 2 * Math.PI - 1e-4); const big = a1 - a0 > Math.PI ? 1 : 0;
    return `M${pt(a0, ro)}A${ro},${ro} 0 ${big} 1 ${pt(a1, ro)}L${pt(a1, ri)}A${ri},${ri} 0 ${big} 0 ${pt(a0, ri)}Z`; };
  // Sub-categories (opt.subs: slice key -> [{name, rank, n, ha, v}]) split that slice's arc in the outer ring, in shades of its colour
  const subs = [];
  sl.forEach((o, k) => { const parts = ((opt.subs || {})[o.s.key] || []).filter(q => q.v > 0), tot = parts.reduce((t, q) => t + q.v, 0);
    let b = o.a0; o.parts = parts.map(q => { const sp = Object.assign({}, q, { parent: k, a0: b, a1: b += q.v / tot * (o.a1 - o.a0), of: q.v / tot });
      sp.mid = (sp.a0 + sp.a1) / 2; sp.idx = subs.push(sp) - 1; return sp; }); });
  const SHADE = [1, .62, .36, .18], shade = q => SHADE[q.rank] ?? .18;
  const pct = v => { const p = v / sum * 100; return p > 0 && p < 1 ? "<1%" : Math.round(p) + "%"; };
  const sign = d => d > 0 ? "+" + opt.num(d) : d < 0 ? "−" + opt.num(-d) : "±0";
  let g = `<defs><filter id="${id}-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="${id}-core"><stop offset="0" stop-color="rgba(34,195,230,.12)"/><stop offset="1" stop-color="rgba(34,195,230,0)"/></radialGradient></defs>
    <circle cx="${C}" cy="${C}" r="${RS1 + 6}" fill="none" stroke="var(--grid)" stroke-dasharray="2 4"/>
    <circle cx="${C}" cy="${C}" r="${R0 - 9}" fill="url(#${id}-core)" stroke="var(--line)"/>
    <g class="${opt.spin ? "grow" : ""}" filter="url(#${id}-glow)">${sl.map((o, k) => `<path class="slice" data-k="${k}" d="${arc(o.a0, o.a1)}" fill="${o.s.color}" fill-opacity=".9" stroke="var(--surface)" stroke-width="2"/>`).join("")}
      ${subs.map(q => `<path class="sub-arc" data-s="${q.idx}" d="${arc(q.a0, q.a1, RS1, RS0)}" fill="${sl[q.parent].s.color}" fill-opacity="${shade(q)}" stroke="var(--surface)" stroke-width="1.5"/>`).join("")}</g>
    <text class="c-v" x="${C}" y="${C + 2}" text-anchor="middle">${opt.center ?? opt.num(sum)}</text>
    <text class="c-l" x="${C}" y="${C + 22}" text-anchor="middle">${esc(opt.unit)}</text>
    <text class="c-w" x="${C}" y="${C + 38}" text-anchor="middle">${esc(opt.cw ?? "now")}</text>`;
  // opt.both (Survey Status panels, 2026-11-21, user: "make the area and SRs here appear not on toggle only"): an SRs column and an
  // Area (ha) column side by side; Share stays the share of what the pie measures (the SRs / Area toggle).
  const B = opt.both, isHa = opt.unit === "hectares";
  const cols = (n, ha, v) => B ? `<span class="n${isHa ? " alt" : ""}">${n.toLocaleString()}</span><span class="n${isHa ? "" : " alt"}">${fmtHa(ha)}</span>` : `<span class="n">${opt.num(v)}</span>`;
  const list = `<div class="pie-list${B ? " both" : ""}"><div class="pr hd"><span></span><span>${esc(opt.col || "Status")}</span>${B ? "<span>SRs</span><span>Area (ha)</span>" : `<span>${esc(opt.unit)}</span>`}<span title="${B ? "Share of " + (isHa ? "the area" : "the SRs") + ", as the pie shows" : ""}">Share</span><span></span></div>` +
    sl.map((o, k) => { const d = prev ? o.v - (prev[o.s.key] || 0) : null;
      return `<div class="pr" data-k="${k}" title="${esc(o.s.status)}"><i class="sw" style="background:${o.s.color};color:${o.s.color}"></i><span class="nm">${esc(o.s.name)}</span>
        ${cols(B ? B.n(o.s) : 0, B ? B.ha(o.s) : 0, o.v)}<span class="p">${pct(o.v)}</span><span>${d == null ? "" : `<span class="delta flat">${sign(d)}</span>`}</span></div>` +
        o.parts.map(q => `<div class="pr sub" data-s="${q.idx}" title="${esc(o.s.status)}: ${esc(q.name)}"><i class="sw" style="background:${o.s.color};color:${o.s.color};opacity:${shade(q)}"></i><span class="nm">${esc(q.name)}</span>
        ${cols(q.n || 0, q.ha || 0, q.v)}<span class="p">${Math.round(q.of * 100)}%</span><span></span></div>`).join(""); }).join("") +
    (subs.length ? `<div class="sub-note">Outer ring and indented rows: ${esc(opt.subNote || "")}; their % is of that status</div>` : "") + `</div>`;
  el.innerHTML = `<div class="pie"><svg viewBox="0 0 300 300" role="img" aria-label="${esc(opt.label)}">${g}</svg>${list}</div><div class="tip"></div>`;
  const tip = el.querySelector(".tip"), paths = [...el.querySelectorAll(".slice")], items = [...el.querySelectorAll(".pr[data-k]")];
  const arcs = [...el.querySelectorAll(".sub-arc")], subRows = [...el.querySelectorAll(".pr[data-s]")];

  const noArea = list.filter(s => s.area == null).length;
  $("notes").innerHTML = `<b>How these are counted</b><ul>
    <li><b>All kinds</b> (first panel): every SR shown, whatever its kind, at its current survey status. The chips under its header give each kind's part (SRs, or hectares with <b>Area (ha)</b>). Click a status to split its SRs <b>by kind of survey</b>, then a kind to list them; attachments are in each kind's own panel.</li>
    <li>One pie per <b>kind of survey</b>: every SR of that kind at its current survey status, from this PC's SR Desk copy. The outer ring splits <b>SR AT DARPO</b> by DARPO status (Pending, Ongoing Verification, Compliance).</li>
    <li><b>Area</b> is the register's Area Validated, in hectares (an Admin's correction in the SR Desk is used). An SR with no area adds 0 ha${noArea ? `: ${noArea.toLocaleString()} here` : ""}. The status tables show both. <b>SRs</b> / <b>Area (ha)</b> at the top picks what the pie and the Share column measure.</li>
    <li>Click a status (or a DARPO status in the outer ring) to open the <b>attachments</b> of those SRs, from the SR Desk's Attachments tab. Each missing document counts every SR that lacks it, so an SR lacking two documents is in both slices. An SR with nothing missing is <b>Complete</b> (every required document marked Present or N/A), <b>Partly marked</b>, or <b>not marked yet</b>.</li>
    <li>Click a missing document to sort its remarks into <b>categories</b>. They are the same categories as on the SR Desk dashboard (saved on this device only); reopen the SR Desk to see changes made here.</li>
    <li><b>Commitment</b> marks the ${COMMIT.size.toLocaleString()} LHs committed for registration in ${esc(COMMIT_SRC)} (by Seq No, with the New Milestone quarter). <b>Commitment</b> / <b>Not commitment</b> at the top limits every pie to them; with <b>All LHs</b>, each kind's count, each status's tooltip and the SR lists still show which are committed. The same list is on the SR Desk Dashboard.</li>
    <li>Read-only for SRs: nothing on this page is written to the SR Desk or the Sheet.</li></ul>`;
}

function renderKind(kind, i, srs, SER, AREA, rcats) {
  const r = { now: true, total: srs.length, totalHa: 0, cm: 0 }; SER.forEach(x => { r[x.key] = 0; r[x.key + HA] = 0; r[x.key + CM] = 0; });
  srs.forEach(s => { const k = keyOf(statusOf(s)); r[k]++; r[k + HA] += s.area || 0; r.totalHa += s.area || 0; if (commitQ(s) !== undefined) { r[k + CM]++; r.cm++; } });
  const present = SER.filter(x => r[x.key]);
  /* Header follows the key (2026-11-23, user: unselecting FOR REPLACEMENT "should change this area and count"): a hidden status leaves the SR count, hectares and commitment count. */
  const off = present.filter(x => hidden.has(x.key)), vis = { n: r.total, ha: r.totalHa, cm: r.cm };
  off.forEach(x => { vis.n -= r[x.key]; vis.ha -= r[x.key + HA]; vis.cm -= r[x.key + CM]; });
  $("kc-" + i).innerHTML = `pie shows ${ui.commit === "all" ? "all" : ui.commit === "in" ? "the commitment" : "the not-commitment"} <b>${vis.n.toLocaleString()}</b>${off.length ? ` of ${r.total.toLocaleString()}` : ""} SRs · <b>${fmtHa(vis.ha)}</b> ha${ui.commit === "all" ? ` · <b>${vis.cm.toLocaleString()}</b> commitment` : ""}${off.length ? ` · ${off.length} status${off.length === 1 ? "" : "es"} hidden` : ""}`;
  $("kl-" + i).innerHTML = present.map(x => `<button aria-pressed="${!hidden.has(x.key)}" data-k="${esc(x.key)}" title="${esc(x.members ? x.members.join(", ") : x.key)}"><i style="background:${x.color};color:${x.color}"></i>${esc(x.name)}</button>`).join("");
  $("kl-" + i).querySelectorAll("button").forEach(b => b.onclick = () => { const k = b.dataset.k; hidden.has(k) ? hidden.delete(k) : hidden.add(k);
    try { localStorage.setItem("srdash-hidden", JSON.stringify([...hidden])); } catch (e) {} render(); });
  const show = present.filter(x => !hidden.has(x.key)).map(x => Object.assign({}, x, { key: AREA ? x.key + HA : x.key, status: x.key }));
  const DARPO_SUBS = ["Pending", "Ongoing Verification", "Compliance"], darpo = {};
  srs.forEach(s => { if (statusOf(s) !== AT_DARPO) return; const k = s.status || NOT_SET, o = darpo[k] || (darpo[k] = { n: 0, ha: 0 }); o.n++; o.ha += s.area || 0; });
  const subRank = k => DARPO_SUBS.includes(k) ? DARPO_SUBS.indexOf(k) : 3;
  const parts = Object.keys(darpo).sort((p, q) => subRank(p) - subRank(q)).map(k => ({ name: k, rank: subRank(k), n: darpo[k].n, ha: darpo[k].ha, v: AREA ? darpo[k].ha : darpo[k].n }));
  let pick = ui.pick[kind];
  if (pick && !show.some(x => x.status === pick.st)) pick = null;
  const el = $("kpie-" + i);
  if (!show.length) el.innerHTML = `<p class="read" style="padding:40px 0;text-align:center">Every status is hidden. Click one in the key to show it.</p>`;
  else pieChart(el, r, null, { label: `${kind}: ${AREA ? "share of area at each survey status, hectares" : "share of SRs at each survey status"}`, spin: firstPaint, series: show,
    subNote: "DARPO status of the SRs at DARPO", subs: keyOf(AT_DARPO) === AT_DARPO ? { [AREA ? AT_DARPO + HA : AT_DARPO]: parts } : null,
    num: AREA ? fmtHa : v => v.toLocaleString(), unit: AREA ? "hectares" : "SRs", cw: kind, tipTitle: kind, pick: pick && pick.st, pickSub: pick && pick.sub,
    both: { n: s => r[s.status] || 0, ha: s => r[s.status + HA] || 0 },
    onPick: (st, sub) => { const cur = ui.pick[kind]; ui.pick[kind] = cur && cur.st === st && (cur.sub || null) === (sub || null) ? null : { st, sub: sub || null };
      delete ui.att[kind]; delete ui.cat[kind]; savePick(); ui.anim = ui.pick[kind] ? kind : null; render(); ui.anim = null;
      const a = $("katt-" + i); if (a && ui.pick[kind]) a.scrollIntoView({ block: "nearest", behavior: "smooth" }); },
    extra: z => `<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>All ${esc(kind)} SRs</span><b>${z.total} · ${fmtHa(z.totalHa)} ha</b></div>` });
  $("kh-" + i).textContent = pick ? "" : kind === ALL_KINDS ? "Click a status to see its SRs by kind of survey." : "Click a status to see the attachments of its SRs: what each one lacks and which are complete.";
  if (!pick) { $("katt-" + i).innerHTML = ""; return; }
  kind === ALL_KINDS ? renderByKind(i, srs, pick, AREA) : renderAtt(kind, i, srs, pick, rcats);
}

/* All kinds panel (2026-11-23, user: "make this in the red box the attachments into kinds of survey"): a status click opens a pie of
   that status's SRs by kind of survey, in each kind's colour; a click on a kind lists its SRs at that status. Attachments stay in each kind's panel. */
function renderByKind(i, srs, pick, AREA) {
  const kind = ALL_KINDS, set = srs.filter(s => keyOf(statusOf(s)) === pick.st && (!pick.sub || (s.status || NOT_SET) === pick.sub));
  const name = (pick.st === OTHER ? "Other statuses" : pick.st) + (pick.sub ? " › " + pick.sub : "");
  const names = Object.keys(kindColor), row = { now: true }, by = {};
  names.forEach(k => { row[k] = 0; row[k + HA] = 0; row[k + CM] = 0; by[k] = []; });
  set.forEach(s => { const k = s.kind || NOT_SET; if (!(k in by)) return; by[k].push(s); row[k]++; row[k + HA] += s.area || 0; if (commitQ(s) !== undefined) row[k + CM]++; });
  const ha = set.reduce((t, s) => t + (s.area || 0), 0);
  const series = names.filter(k => row[k]).map(k => ({ key: AREA ? k + HA : k, status: k, name: k, color: kindColor[k] }));
  let a = ui.att[kind]; if (a && !by[a]) a = ui.att[kind] = null;
  const box = $("katt-" + i);
  box.innerHTML = `<div class="${ui.anim === kind ? "att-in" : ""}"><div class="chart-head"><div><h3>By kind of survey · ${esc(name)}</h3>
      <p class="read"><b>${set.length}</b> SR${set.length === 1 ? "" : "s"} · <b>${fmtHa(ha)}</b> ha at this status, split by kind of survey. Click a kind to list its SRs; each kind's own panel below shows their attachments.</p></div>
      <button class="btn" id="kx-${i}">Close</button></div>
    <div class="legend big" id="kapl-${i}" aria-label="Show or hide a kind of survey"></div><div class="chart" id="kap-${i}"></div><div id="kd-${i}"></div></div>`;
  $("kx-" + i).onclick = () => { delete ui.pick[kind]; delete ui.att[kind]; savePick(); render(); };
  const vis = subKey($("kapl-" + i), "kind:", series), off = series.length - vis.length;
  const visN = vis.reduce((t, x) => t + row[x.status], 0), visHa = vis.reduce((t, x) => t + row[x.status + HA], 0);
  if (off) box.querySelector(".chart-head .read").insertAdjacentHTML("beforeend", ` Shown: <b>${visN}</b> of ${set.length} SRs · <b>${fmtHa(visHa)}</b> ha (${off} kind${off === 1 ? "" : "s"} hidden).`);
  pieChart($("kap-" + i), row, null, { label: `SRs at ${name} by kind of survey`, spin: ui.anim === kind, series: vis, col: "Kind of survey",
    num: AREA ? fmtHa : v => v.toLocaleString(), unit: AREA ? "hectares" : "SRs", center: AREA ? fmtHa(visHa) : visN, cw: "at this status", tipTitle: name,
    empty: off ? SUB_EMPTY : "No SRs at this status.", pick: vis.some(x => x.status === a) ? a : null, both: { n: s => row[s.status] || 0, ha: s => row[s.status + HA] || 0 },
    onPick: st => { ui.att[kind] = ui.att[kind] === st ? null : st; render(); } });
  if (!a) return;
  $("kd-" + i).innerHTML = `<div class="cat att-in"><div class="chart-head"><h3>${esc(a)} · ${esc(name)} · ${by[a].length} SR${by[a].length === 1 ? "" : "s"}</h3></div>${by[a].length ? lhTable(by[a]) : `<p class="read">None.</p>`}</div>`;
  bindRows($("kd-" + i));
}

function renderAtt(kind, i, srs, pick, rcats) {
  const set = srs.filter(s => keyOf(statusOf(s)) === pick.st && (!pick.sub || (s.status || NOT_SET) === pick.sub));
  const name = (pick.st === OTHER ? "Other statuses" : pick.st) + (pick.sub ? " › " + pick.sub : "");
  const { miss, rem, groups } = attachStats(set);
  const docs = Object.keys(miss).sort((a, b) => miss[b].length - miss[a].length || a.localeCompare(b));
  const top = docs.length > ATT_MAX + 1 ? docs.slice(0, ATT_MAX) : docs, folded = docs.slice(top.length);
  const series = top.map((l, j) => ({ key: l, status: l, name: l.replace(/^Missing: /, ""), color: ATT_COLORS[j % ATT_COLORS.length], srs: miss[l] }))
    .concat(folded.length ? [{ key: OTHER_MISS, status: OTHER_MISS, name: `${OTHER_MISS} (${folded.length})`, color: OTHER_COLOR, srs: uniq(folded.map(l => miss[l])) }] : [])
    .concat([COMPLETE, PARTLY, UNCHECKED].map(g => ({ key: g, status: g, name: g, color: GROUP_COLOR[g], srs: groups[g] })));
  const row = {}; series.forEach(x => { row[x.key] = x.srs.length; });
  const lacking = uniq(Object.values(miss)).length;
  let a = ui.att[kind]; if (a && !docs.includes(a) && !series.some(x => x.key === a)) a = ui.att[kind] = null;
  const box = $("katt-" + i);
  box.innerHTML = `<div class="${ui.anim === kind ? "att-in" : ""}"><div class="chart-head"><div><h3>Attachments · ${esc(kind)} · ${esc(name)}</h3>
      <p class="read"><b>${set.length}</b> SR${set.length === 1 ? "" : "s"}: <b>${lacking}</b> lacking at least one document, <b>${groups[COMPLETE].length}</b> complete, ${groups[PARTLY].length} partly marked, ${groups[UNCHECKED].length} not marked yet. Share is of the slice totals: an SR lacking two documents counts in both. Click a missing document to sort its remarks into categories; click Complete or another group to list its SRs.</p></div>
      <button class="btn" id="kx-${i}">Close</button></div>
    <div class="legend big" id="kapl-${i}" aria-label="Show or hide an attachment group"></div><div class="chart" id="kap-${i}"></div><div id="kd-${i}"></div></div>`;
  $("kx-" + i).onclick = () => { delete ui.pick[kind]; delete ui.att[kind]; delete ui.cat[kind]; savePick(); render(); };
  const vis = subKey($("kapl-" + i), "att:", series), off = series.length - vis.length, aSl = a ? (folded.includes(a) ? OTHER_MISS : a) : null;
  pieChart($("kap-" + i), row, null, { label: `Attachments of ${kind} SRs at ${name}`, spin: ui.anim === kind, series: vis, num: v => v.toLocaleString(), unit: "SRs", col: "Attachment",
    center: off ? uniq(vis.map(x => x.srs)).length : set.length, cw: off ? "in the shown slices" : "at this status", empty: off ? SUB_EMPTY : "No SRs at this status.",
    pick: vis.some(x => x.key === aSl) ? aSl : null,
    tipFor: (o, p) => `<div class="t">${esc(name)}</div><div class="r"><span><i style="background:${o.s.color}"></i>${esc(o.s.name)}</span><b>${p}</b></div><div class="r"><span>SRs</span><b>${o.v}</b></div>`,
    onPick: st => { ui.att[kind] = ui.att[kind] === st ? null : st; delete ui.cat[kind]; render(); } });
  const d = $("kd-" + i);
  if (!a) return;
  if (a === OTHER_MISS) {
    d.innerHTML = `<div class="cat att-in"><h3>${OTHER_MISS}</h3><p class="read">Pick one to sort its remarks.</p><div class="legend">${folded.map(l => `<button data-doc="${esc(l)}"><i style="background:${OTHER_COLOR}"></i>${esc(l.replace(/^Missing: /, ""))} · ${miss[l].length}</button>`).join("")}</div></div>`;
    d.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => { ui.att[kind] = b.dataset.doc; delete ui.cat[kind]; render(); });
    return;
  }
  if (!miss[a]) { // Complete, Partly marked or not marked yet: list the SRs
    const g = series.find(x => x.key === a);
    d.innerHTML = `<div class="cat att-in"><div class="chart-head"><h3>${esc(a)} · ${g.srs.length} SR${g.srs.length === 1 ? "" : "s"}</h3></div>${g.srs.length ? lhTable(g.srs) : `<p class="read">None.</p>`}</div>`;
    return;
  }
  catPanel(kind, i, a, miss[a], rem[a] || {}, rcats, d);
}

/* Remark categories for one missing document: same storage and keys as the SR Desk dashboard (rcats[label][category] = [remark keys]). */
function catPanel(kind, i, label, srs, rm, rcats, d) {
  const distinct = new Map(); // remark key -> {text, srs}
  srs.forEach(s => { const t = rm[s.seq] || "", k = remKey(t); const o = distinct.get(k) || { text: t, srs: [] }; o.srs.push(s); distinct.set(k, o); });
  const cats = rcats[label] || {}, catNames = Object.keys(cats), catOf = {};
  catNames.forEach(c => cats[c].forEach(k => { catOf[k] = c; }));
  const cs = catNames.map((c, j) => ({ key: c, status: c, name: c, color: PALETTE[j % PALETTE.length], n: cats[c].filter(k => distinct.has(k)).length,
    srs: uniq(cats[c].filter(k => distinct.has(k)).map(k => distinct.get(k).srs)) })).filter(x => x.srs.length);
  const inCat = uniq(cs.map(x => x.srs)).length, row = {}; cs.forEach(x => { row[x.key] = x.srs.length; });
  const remList = [...distinct.entries()].filter(([k]) => !catOf[k]).sort((p, q) => q[1].srs.length - p[1].srs.length || p[1].text.localeCompare(q[1].text));
  let pc = ui.cat[kind]; if (pc && !cs.some(x => x.key === pc)) pc = ui.cat[kind] = null;
  const picked = pc ? cs.find(x => x.key === pc).srs : [];
  d.innerHTML = `<div class="cat att-in"><div class="chart-head"><div><h3>Remark categories</h3><p class="read">${esc(label)} · ${srs.length} SR${srs.length === 1 ? "" : "s"}</p></div><button class="btn" id="kcx-${i}">Close</button></div>
    ${cs.length ? `<div class="legend big" id="kcpl-${i}" aria-label="Show or hide a category"></div><div class="chart" id="kcp-${i}"></div><p class="read">${srs.length - inCat} of ${srs.length} SRs not in a category yet. Click a category to list its SRs.</p>`
      : `<div class="rem-empty">No categories yet for this document. Tick the remarks that mean the same thing, name the category, then press Combine. The pie starts with your first category.</div>`}
    ${picked.length ? `<h3 style="margin-top:10px">${picked.length} SR${picked.length === 1 ? "" : "s"} in ${esc(pc)}</h3>${lhTable(picked, s => rm[s.seq] || "")}` : ""}
    <div class="cat-edit">
      ${catNames.length ? `<div class="chips">${catNames.map((c, j) => `<span class="chip">${esc(c)} <b>${cats[c].length}</b><button data-uncat="${j}" title="Delete this category; its remarks go back to the list">Ungroup</button></span>`).join("")}</div>` : ""}
      <div class="cat-row"><input id="kq-${i}" type="search" placeholder="Search remarks" aria-label="Search remarks" autocomplete="off"><span class="cover" id="kqn-${i}">${remList.length} distinct remark${remList.length === 1 ? "" : "s"}</span></div>
      <div class="cat-pick">${remList.length ? "" : `<div class="read" style="padding:8px">Every remark is in a category. Ungroup one to edit it.</div>`}${remList.map(([k, o], j) => `<label><input type="checkbox" data-j="${j}"><span>${esc(o.text || "(blank)")}</span><span class="cover">${o.srs.length}</span></label>`).join("")}</div>
      <div class="cat-row"><input id="kn-${i}" list="kns-${i}" maxlength="60" placeholder="Category name, e.g. Not notarized" aria-label="Category name"><datalist id="kns-${i}">${catNames.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
        <button class="btn primary" id="kadd-${i}">Combine</button></div>
      <p class="read" style="margin:0">Typing an existing name adds to it. Categories are saved on this device only, shared with the SR Desk dashboard.</p></div></div>`;
  $("kcx-" + i).onclick = () => { ui.att[kind] = null; delete ui.cat[kind]; render(); };
  const csVis = cs.length ? subKey($("kcpl-" + i), "cat:" + label + ":", cs) : cs, csOff = cs.length - csVis.length;
  if (cs.length) pieChart($("kcp-" + i), row, null, { label: `Remark categories of ${label}`, spin: true, series: csVis, num: v => v.toLocaleString(), unit: "SRs", col: "Category",
    center: csOff ? uniq(csVis.map(x => x.srs)).length : inCat, cw: csOff ? "in the shown categories" : "in a category", empty: SUB_EMPTY,
    pick: csVis.some(x => x.key === pc) ? pc : null, tipFor: (o, p) => `<div class="t">${esc(label)}</div><div class="r"><span><i style="background:${o.s.color}"></i>${esc(o.s.name)}</span><b>${p}</b></div><div class="r"><span>SRs</span><b>${o.v}</b></div><div class="r"><span>Remarks</span><b>${o.s.n}</b></div>`,
    onPick: st => { ui.cat[kind] = ui.cat[kind] === st ? null : st; render(); } });
  d.querySelectorAll("[data-uncat]").forEach(b => b.onclick = () => { const r = loadRcats(), c = catNames[+b.dataset.uncat]; if (r[label]) { delete r[label][c]; if (!Object.keys(r[label]).length) delete r[label]; } saveRcats(r); render(); });
  const q = $("kq-" + i); q.oninput = () => { const words = q.value.toLowerCase().split(/\s+/).filter(Boolean), rows = [...d.querySelectorAll(".cat-pick label")];
    let n = 0; rows.forEach(x => { const hit = words.every(w => x.textContent.toLowerCase().includes(w)); x.hidden = !hit; n += hit; });
    const ticked = rows.filter(x => x.querySelector("input").checked).length;
    $("kqn-" + i).textContent = (words.length ? `${n} of ${rows.length} shown` : `${rows.length} distinct remark${rows.length === 1 ? "" : "s"}`) + (ticked ? ` · ${ticked} ticked` : ""); };
  $("kadd-" + i).onclick = () => {
    const nm = $("kn-" + i).value.trim().replace(/\s+/g, " "), picks = [...d.querySelectorAll(".cat-pick input:checked")].map(c => remList[+c.dataset.j][0]);
    if (!picks.length) { $("kqn-" + i).textContent = "Tick at least one remark"; return; }
    if (!nm) { $("kn-" + i).focus(); $("kn-" + i).placeholder = "Type a name for the category"; return; }
    const r = loadRcats(), c = r[label] = r[label] || {}; // read fresh, so a category made in the SR Desk meanwhile is kept
    Object.keys(c).forEach(x => { c[x] = c[x].filter(k => !picks.includes(k)); if (!c[x].length) delete c[x]; });
    c[nm] = (c[nm] || []).concat(picks); saveRcats(r); render();
  };
}

/* Print one kind of survey exactly as shown (pie, open attachments, categories and SR list), on a white page; the other kinds are left out. */
/* Order of the kinds: dragged by the grip (mouse, pen or touch) or moved with ↑ / ↓ on a focused grip. Saved on this device ("srdash-order");
   a kind not in the saved order (new in the register) goes after the saved ones, by name. */
const ORDER_STORE = "srdash-order";
const loadOrder = () => { try { const o = JSON.parse(localStorage.getItem(ORDER_STORE)); return Array.isArray(o) ? o : []; } catch (e) { return []; } };
const saveOrder = o => { try { o ? localStorage.setItem(ORDER_STORE, JSON.stringify(o)) : localStorage.removeItem(ORDER_STORE); } catch (e) {} };
function orderKinds(byName) {
  const o = loadOrder().filter(k => byName.includes(k));
  return o.concat(byName.filter(k => !o.includes(k)));
}
const domOrder = () => [...$("kinds").querySelectorAll(".kindp")].map(p => p.dataset.kind);
function flashMoved(p) { p.classList.remove("moved"); void p.offsetWidth; p.classList.add("moved"); }
function bindGrip(g) {
  const box = $("kinds"), p = g.closest(".kindp");
  g.onkeydown = e => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    const sib = e.key === "ArrowUp" ? p.previousElementSibling : p.nextElementSibling;
    if (!sib) return;
    e.key === "ArrowUp" ? box.insertBefore(p, sib) : box.insertBefore(sib, p);
    saveOrder(domOrder()); $("order-reset").hidden = false; g.focus(); p.scrollIntoView({ block: "nearest" }); flashMoved(p);
  };
  /* 2026-11-23 fix: the move/up listeners were on the grip with pointer capture, but moving the kind in the list (insertBefore)
     takes it out of the page for an instant, which drops the capture. After the first reorder the grip got no more moves and
     no pointerup, so the drag froze and the list stayed folded. Listeners are now on the document, filtered by pointer id.
     The edge scroll keeps going while the pointer rests near the top or bottom (it used to step only when the pointer moved). */
  g.onpointerdown = e => {
    if (e.button !== 0 || box.classList.contains("reordering")) return;
    e.preventDefault();
    const id = e.pointerId, before = domOrder().join("|");
    const top0 = p.getBoundingClientRect().top;
    box.classList.add("reordering"); p.classList.add("dragging");
    scrollBy(0, p.getBoundingClientRect().top - top0); // the list just folded; keep the dragged kind where it was, under the pointer
    let lastY = e.clientY, raf = 0, done = false;
    const place = () => {
      raf = 0;
      if (done) return;
      const others = [...box.querySelectorAll(".kindp")].filter(x => x !== p);
      const next = others.find(x => { const r = x.getBoundingClientRect(); return lastY < r.top + r.height / 2; });
