<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SR Status Dashboard</title>
<!--
  SR Status Dashboard: survey status of the SR Verification Desk's SRs, now and week by week.
  Reads the SR Desk's own copy on this PC (localStorage "srdesk-v1": register, records, unsynced queue), so it must be
  opened from the same place as sr-desk.html (same folder on the same server, or both as files). It never writes anything.
  With no SR Desk data on this PC it shows made-up sample data, marked as such.
  Copy of record: outputs/sr-verification-desk/app/sr-dashboard.html; outputs/app-hub/apps/sr-dashboard.html is a verbatim copy.
-->
<style>
:root {
  --bg: #070b14; --surface: #0d1424; --surface-2: #121b30; --line: #1d2a44; --grid: #16213a;
  --fg: #e6eefc; --muted: #8b9bb8; --faint: #5d6c88;
  --cyan: #22c3e6; --in: #3987e5; --out: #d95926; --endorse: #199e70; --comply: #c98500; --days: #9085e9;
  --good: #0ca30c; --warn: #fab219; --crit: #e66767;
  --mono: "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
  --body: "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; min-height: 100vh;
  background-image:
    radial-gradient(900px 500px at 85% -10%, rgba(34,195,230,.13), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(144,133,233,.10), transparent 60%),
    linear-gradient(rgba(34,195,230,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,195,230,.035) 1px, transparent 1px);
  background-size: auto, auto, 32px 32px, 32px 32px; background-attachment: fixed; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* Header */
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); display: flex; align-items: center; gap: 8px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: pulse 2s infinite; }
.live.off { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
h1 { margin: 4px 0 2px; font-size: 26px; font-weight: 600; letter-spacing: .01em; }
.src { color: var(--muted); font-size: 12.5px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: rgba(13,20,36,.7); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; color: var(--muted); cursor: pointer; font-family: var(--mono); font-size: 12px; }
.seg button[aria-pressed="true"] { background: rgba(34,195,230,.14); color: var(--fg); box-shadow: inset 0 0 0 1px rgba(34,195,230,.45); }
.btn { border: 1px solid var(--line); background: rgba(13,20,36,.7); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.btn:hover, .seg button:hover { color: var(--fg); }

.banner { border: 1px solid rgba(250,178,25,.45); background: rgba(250,178,25,.08); color: #f6d58a; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
.banner b { color: var(--warn); }
.filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 10px 12px; align-items: end; margin-bottom: 12px; padding: 12px 16px; }
.filters label { display: grid; gap: 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.filters select { font: 13px var(--body); letter-spacing: 0; text-transform: none; color: var(--fg); background-color: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 28px 7px 10px; width: 100%; min-width: 0; appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--cyan) 50%), linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.filters select.on { border-color: rgba(34,195,230,.7); box-shadow: 0 0 0 1px rgba(34,195,230,.35), 0 0 14px rgba(34,195,230,.18); }
.filters option { background: var(--surface); color: var(--fg); }
.filters .btn[disabled] { opacity: .4; cursor: default; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.chips:empty { display: none; }
.chip { font-family: var(--mono); font-size: 11.5px; color: var(--fg); background: rgba(34,195,230,.12); border: 1px solid rgba(34,195,230,.4); border-radius: 999px; padding: 2px 4px 2px 10px; display: inline-flex; align-items: center; gap: 4px; }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--fg); }
.snap { display: grid; gap: 8px; }
.snap .row { display: grid; grid-template-columns: minmax(0, 230px) 1fr 220px; gap: 12px; align-items: center; font-size: 12.5px; }
.snap .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.snap .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snap .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; box-shadow: 0 0 8px currentColor; }
.snap .track { height: 10px; border-radius: 0 5px 5px 0; background: rgba(139,155,184,.08); overflow: hidden; }
.snap .track i { display: block; height: 100%; border-radius: 0 5px 5px 0; box-shadow: 0 0 12px currentColor; animation: grow .9s ease-out both; transform-origin: left; }
.snap .n { font-family: var(--mono); text-align: right; color: var(--fg); }
.snap .n small { color: var(--muted); margin-left: 6px; }
.snap .n .alt { color: var(--muted); }
@keyframes grow { from { transform: scaleX(0); } }
.legend button { border: 1px solid var(--line); background: rgba(7,11,20,.6); border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 12px; color: var(--fg); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; }
.legend button[aria-pressed="false"] { color: var(--faint); }
.legend button[aria-pressed="false"] i { opacity: .25; box-shadow: none; }
.legend.big { margin: 4px 0 10px; }
.cover { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.cover b { color: var(--cyan); }

/* Panels */
.panel { position: relative; background: linear-gradient(180deg, rgba(18,27,48,.85), rgba(13,20,36,.85)); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; backdrop-filter: blur(6px); }
.panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; border-color: rgba(34,195,230,.6); border-style: solid; pointer-events: none; }
.panel::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; border-top-left-radius: 12px; }
.panel::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; border-bottom-right-radius: 12px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.kpi .k { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font-family: var(--mono); font-size: 34px; font-weight: 600; margin: 6px 0 2px; letter-spacing: -.02em; text-shadow: 0 0 18px rgba(34,195,230,.25); }
.kpi .v small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.kpi .s { color: var(--muted); font-size: 12.5px; }
.delta { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
.delta.up-bad, .delta.down-bad { color: #ffb4b4; background: rgba(230,103,103,.15); }
.delta.up-good, .delta.down-good { color: #9be89b; background: rgba(12,163,12,.16); }
.delta.flat { color: var(--muted); background: rgba(139,155,184,.12); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.wide { grid-column: 1 / -1; }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }
.chart-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.read { color: var(--muted); font-size: 12.5px; margin: 2px 0 8px; }
.read b { color: var(--fg); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; box-shadow: 0 0 8px currentColor; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--crit) 0 4px, transparent 4px 7px) !important; box-shadow: none; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--faint); font-family: var(--mono); font-size: 11px; }
.chart .end-label { fill: var(--fg); font-size: 12px; font-weight: 600; }
.tip { position: absolute; pointer-events: none; background: rgba(7,11,20,.94); border: 1px solid rgba(34,195,230,.5); border-radius: 8px; padding: 8px 10px;
  font-size: 12px; min-width: 150px; box-shadow: 0 0 24px rgba(34,195,230,.18); opacity: 0; transition: opacity .12s; z-index: 5; }
.tip .t { font-family: var(--mono); color: var(--cyan); font-size: 11px; letter-spacing: .08em; margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); }
.tip .r b { font-family: var(--mono); color: var(--fg); font-weight: 600; }
.tip .r i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.notes { margin-top: 12px; color: var(--muted); font-size: 12.5px; }
.notes ul { margin: 6px 0 0; padding-left: 18px; }
.notes li { margin: 2px 0; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
td { font-family: var(--mono); }
.table-scroll { overflow-x: auto; }
#table-wrap[hidden] { display: none; }

.pie { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); gap: 16px 32px; align-items: center; }
.pie svg { max-width: 320px; height: auto; margin: 0 auto; }
.pie .grow { transform-origin: 150px 150px; animation: spin 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes spin { from { transform: rotate(-120deg) scale(.6); opacity: 0; } }
.pie .slice { transition: transform .18s ease-out, opacity .18s; cursor: pointer; }
.chart .c-v { fill: var(--fg); font-size: 22px; font-weight: 600; }
.chart .c-l { fill: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.chart .c-w { fill: var(--cyan); font-size: 11px; }
.pie-list { display: grid; gap: 4px; min-width: 0; }
.pie-list .pr { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 44px 78px; gap: 10px; align-items: center; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; border: 1px solid transparent; }
.pie-list .pr.on { background: rgba(34,195,230,.07); border-color: var(--line); }
.pie-list .pr.hd { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding-top: 0; }
.pie-list .pr.hd span:nth-child(n+3) { text-align: right; }
.pie-list .sw { width: 10px; height: 10px; border-radius: 3px; box-shadow: 0 0 8px currentColor; }
.pie-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pie-list .n { font-family: var(--mono); color: var(--fg); text-align: right; }
.pie-list .p { font-family: var(--mono); color: var(--muted); text-align: right; }
.pie-list .pr > span:last-child { text-align: right; }
.pie-list .pr.sub { padding-top: 2px; padding-bottom: 2px; font-size: 12px; color: var(--muted); }
.pie-list .pr.sub .nm { padding-left: 14px; position: relative; }
.pie-list .pr.sub .nm::before { content: ""; position: absolute; left: 2px; top: -6px; width: 7px; height: 12px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); border-bottom-left-radius: 3px; }
.pie-list .pr.sub .sw { width: 8px; height: 8px; justify-self: center; }
.pie-list .pr.sub .n { color: var(--fg); }
.pie-list .sub-note { font-family: var(--mono); font-size: 10.5px; color: var(--faint); padding: 4px 8px 0; letter-spacing: .04em; }
.pie .sub-arc { transition: transform .18s ease-out, opacity .18s; cursor: pointer; }
.week { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.week[hidden] { display: none; }
.week input[type=range] { flex: 1; min-width: 0; accent-color: var(--cyan); cursor: pointer; }
.week .btn { padding: 3px 10px; font-family: var(--mono); }
.week .btn[disabled] { opacity: .4; cursor: default; }
.week b { color: var(--fg); font-weight: 600; white-space: nowrap; }
.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.1s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.ping { animation: ping 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ping { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0; } .ping, .live, .pie .grow { animation: none; } }

@media (max-width: 900px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .pie { grid-template-columns: 1fr; } .pie-list .pr { grid-template-columns: 10px minmax(0, 1fr) auto 40px 64px; gap: 8px; } .snap .row { grid-template-columns: minmax(0, 1fr) auto; } .snap .track { grid-column: 1 / -1; grid-row: 2; } }
@media (max-width: 480px) { .filters { grid-template-columns: 1fr; } .kpi .v { font-size: 28px; } h1 { font-size: 22px; } .panel { padding: 14px; } }
@media print { body { background: #fff; color: #000; } .controls { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow"><span class="live" id="live"></span>SR Verification Desk · Survey status</div>
      <h1>Where the SRs are</h1>
      <div class="src" id="src">Loading…</div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Time range" id="range">
        <button data-w="8">8 wk</button><button data-w="12">12 wk</button><button data-w="26">26 wk</button><button data-w="0">All</button>
      </div>
      <div class="seg" role="group" aria-label="Measure" id="metric"><button data-m="count">SRs</button><button data-m="area">Area (ha)</button></div>
      <button class="btn" id="tbl-btn" aria-expanded="false">Show table</button>
    </div>
  </header>
  <div id="banner"></div>
  <section class="panel filters" id="filters" aria-label="Filters"></section>

  <section class="grid">
    <div class="panel wide">
      <div class="chart-head"><div><h2>Survey status now</h2><p class="read" id="r-now"></p></div>
        <div class="cover" id="now-total"></div></div>
      <div class="snap" id="snap"></div>
    </div>
    <div class="panel wide">
      <div class="chart-head"><div><h2 id="h-status">Mix of survey statuses, week by week</h2><p class="read" id="r-status"></p></div>
        <div class="cover" id="cover"></div></div>
      <div class="legend big" id="legend" aria-label="Show or hide a status"></div>
      <div class="chart" id="c-status"></div>
      <div class="week" id="wk-row"><button class="btn" id="wk-prev" aria-label="Previous week">&lsaquo;</button><input type="range" id="wk" min="0" max="0" value="0" aria-label="Week shown in the pie"><button class="btn" id="wk-next" aria-label="Next week">&rsaquo;</button><b id="wk-name"></b></div>
    </div>
    <div class="panel wide" id="table-wrap" hidden>
      <div class="chart-head"><h2 id="h-table">Weekly figures</h2></div>
      <div class="table-scroll" id="table"></div>
    </div>
  </section>
  <div class="notes" id="notes"></div>
</div>

<script>
"use strict";
/* ---------- Data: the SR Desk's copy on this PC ---------- */
const STORE = "srdesk-v1";
const AT_DARPO = "SR AT DARPO";
const SURVEYS = ["CONDUCTED INITIAL PULONG PULONG", "COMPLETED FIELDWORK", "SR AT DARPO", "SR RECEIVED BY RPMO",
  "SR TRANSMITTED TO LMS FOR IVAS", "SR TRANSMITTED TO CPMO FOR LRA APPROVAL", "SR TRANSMITTED TO LRA FOR APPROVAL",
  "ASP FROM LMS RECEIVED BY RPMO", "ASP FROM LMS RECEIVED BY CPMO", "ASP FROM LRA RECEIVED BY CPMO", "ASP FROM LRA RECEIVED BY RPMO",
  "ASP FROM LMS RECEIVED BY PPMO", "ASP FROM LRA RECEIVED BY PPMO", "FOR REPLACEMENT"];
const OLD_STATUS = { "Received": "Pending", "Awaiting SR": "Pending", "In verification": "Ongoing Verification", "Returned": "Compliance", "Endorsed": "" };
const isIso = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ""));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayNum = s => Math.round(new Date(s + "T00:00:00Z") / 86400000);
const isoOf = n => new Date(n * 86400000).toISOString().slice(0, 10);
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function mapSurvey(raw) { // same rule as sr-desk.html
  const t = String(raw || "").replace(/^\s*\d+(-[A-Z])?\s*-\s*/i, "").replace(/\s+/g, " ").trim().toUpperCase();
  if (/PULONG/.test(t)) return SURVEYS[0];
  return SURVEYS.includes(t) ? t : "";
}
// Area Validated (hectares) as a number; blank or unreadable is null, so it is counted as missing, never as 0 ha.
function toHa(v) { if (typeof v === "number") return isFinite(v) ? v : null; const n = parseFloat(String(v ?? "").replace(/,/g, "").trim()); return isFinite(n) ? n : null; }
function readDesk() {
  let s = null; try { s = JSON.parse(localStorage.getItem(STORE)); } catch (e) { s = null; }
  if (!s || !Array.isArray(s.register) || !s.register.length) return null;
  const recs = s.records || {}, queue = s.queue || {};
  const list = s.register.filter(reg => reg.kind !== "No batch tracker").map(reg => { // same rule as sr-desk.html: no kind of survey, not listed
    const q = queue[reg.seq], rec = recs[reg.seq];
    let d;
    if (q && q.data) d = Object.assign({}, q.data, { overrides: q.data.overrides || {} });
    else if (rec) d = { status: rec.status, survey: rec.survey || mapSurvey(reg.surveyStatus), received: rec.received || "", decided: rec.decided || "",
      statusDate: rec.status_date || "", rpmoReceived: rec.rpmo_received || "", verifier: rec.verifier || "", round: rec.round || 1, overrides: rec.overrides || {} };
    else { const sv = mapSurvey(reg.surveyStatus); d = { status: sv === AT_DARPO ? "Pending" : "", survey: sv, received: isIso(reg.srReceived) ? reg.srReceived : "",
      decided: "", statusDate: sv && isIso(reg.statusDate) ? reg.statusDate : "", verifier: "", round: 1 }; }
    if (Object.prototype.hasOwnProperty.call(OLD_STATUS, d.status)) { const old = d.status; d.status = OLD_STATUS[old]; if (!d.survey) d.survey = old === "Endorsed" ? "SR RECEIVED BY RPMO" : AT_DARPO; }
    const ov = d.overrides || {}; // an Admin's field corrections in the SR Desk win over the register
    return { seq: reg.seq, kind: reg.kind || "", darmo: ov.darmo ?? reg.darmo ?? "", marpo: ov.marpo ?? reg.marpo ?? "",
      status: d.status || "", survey: d.survey || "", received: d.received || "", decided: d.decided || "", statusDate: d.statusDate || "",
      rpmoReceived: d.rpmoReceived || "", round: d.round || 1, area: toHa(ov.area ?? reg.area) };
  });
  return { list, pulledAt: s.pulledAt || "", lastSync: s.lastSync || "", pending: Object.keys(queue).length, sample: false };
}
/* Made-up SRs for when this PC has no SR Desk data. Fixed seed, so the picture is the same each time.
   Each one walks through the statuses; like the real SR Desk, only its current status, that status's date and the DARPO/RPMO dates are kept. */
function sampleDesk() {
  let x = 20261116; const rnd = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
  const t = dayNum(todayIso()), list = [];
  const KS = ["2025-A", "2025-B", "SBA 3", "SBA 4"], DM = [["Sample DARMO North", ["Sample MARPO 1", "Sample MARPO 2"]], ["Sample DARMO South", ["Sample MARPO 3", "Sample MARPO 4"]]];
  const place = o => { const dm = DM[Math.floor(rnd() * 2)]; return Object.assign(o, { kind: KS[Math.floor(rnd() * 4)], darmo: dm[0], marpo: dm[1][Math.floor(rnd() * 2)] }); };
  const PATH = [[SURVEYS[0], 6, 20], [SURVEYS[1], 10, 35], [AT_DARPO, 5, 25], [SURVEYS[3], 4, 15], [SURVEYS[4], 15, 45], [SURVEYS[7], 0, 0]];
  for (let i = 0; i < 320; i++) {
    let day = t - Math.floor(rnd() * 150), k = 0;
    const s = { seq: "S" + i, status: "", received: "", decided: "", rpmoReceived: "", round: 1 };
    while (true) {
      if (PATH[k][0] === AT_DARPO) s.received = isoOf(day);
      if (PATH[k][0] === SURVEYS[3]) { s.decided = isoOf(day); s.rpmoReceived = isoOf(day); }
      const next = day + PATH[k][1] + Math.floor(rnd() * (PATH[k][2] - PATH[k][1] + 1));
      if (k === PATH.length - 1 || next > t) break;
      day = next; k++;
    }
    s.survey = PATH[k][0]; s.statusDate = isoOf(day);
    if (s.survey === AT_DARPO) { const q = rnd(); s.status = t - day > 14 && q < .45 ? "Compliance" : q > .55 ? "Ongoing Verification" : "Pending"; }
    if (s.status === "Compliance") s.decided = isoOf(day + 14);
    if (rnd() < .25 && k < 2) s.statusDate = ""; // some field statuses have no date, as in the trackers
    s.area = rnd() < .04 ? null : Math.round((0.3 + rnd() * rnd() * 12) * 10000) / 10000; // a few with no area, as in the register
    list.push(place(s));
  }
  return { list, pulledAt: "", lastSync: "", pending: 0, sample: true };
}

/* ---------- Weekly series (weeks run Monday to Sunday) ----------
   The SR Desk keeps an SR's current status and a few dates, not its full history. The status at a week's end is rebuilt from the dates it has:
   received at DARPO = SR AT DARPO; received by RPMO, or endorsed (decided and now past DARPO) = SR RECEIVED BY RPMO; status date = current status.
   Before an SR's first dated step it is not counted. An SR with no dated step at all is in "Survey status now" only. */
const mondayOf = n => n - ((new Date(n * 86400000).getUTCDay() + 6) % 7);
const RPMO = "SR RECEIVED BY RPMO";
const HA = "\u0000ha"; // suffix of the area key next to each status's count
const statusOf = s => s.survey || NOT_SET;
function steps(s) {
  const ev = [], add = (d, st) => { if (isIso(d)) ev.push([dayNum(d), st]); };
  const past = SURVEYS.indexOf(s.survey) > SURVEYS.indexOf(AT_DARPO);
  add(s.received, AT_DARPO);
  if (past) add(s.rpmoReceived || (s.status !== "Compliance" ? s.decided : ""), RPMO);
  add(s.statusDate, statusOf(s));
  return ev.sort((a, b) => a[0] - b[0] || SURVEYS.indexOf(a[1]) - SURVEYS.indexOf(b[1]));
}
function build(desk, keys) {
  const t = dayNum(todayIso()), L = desk.list;
  const withSteps = L.map(s => ({ s, ev: steps(s) })).filter(o => o.ev.length);
  const starts = withSteps.map(o => o.ev[0][0]);
  const first = starts.length ? mondayOf(Math.min(...starts)) : mondayOf(t) - 7 * 11;
  const rows = [];
  for (let m = first; m <= mondayOf(t); m += 7) {
    const end = Math.min(m + 6, t), r = { m, label: isoOf(m), partial: m + 6 > t, total: 0, totalHa: 0 };
    keys.forEach(k => { r[k] = 0; r[k + HA] = 0; });
    withSteps.forEach(({ s, ev }) => { let st = null; for (const e of ev) if (e[0] <= end) st = e[1];
      if (st) { const k = keyOf(st, keys), ha = s.area || 0; r[k]++; r.total++; r[k + HA] += ha; r.totalHa += ha; } });
    rows.push(r);
  }
  return { rows, dated: withSteps.length, total: L.length };
}

/* ---------- Pie chart (hand-drawn SVG donut, works offline): the mix of statuses at the end of one week ---------- */
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const shortDate = iso => { const [, mo, d] = iso.split("-"); return `${MON[+mo - 1]} ${+d}`; };
const weekName = r => r.now ? "Now · every SR" : `Week of ${shortDate(r.label)}${r.partial ? " (so far)" : ""}`;
function pieChart(el, r, prev, opt) {
  const C = 150, R = 124, R0 = 76, RS0 = R + 5, RS1 = R + 19, id = el.id; // RS0-RS1: outer ring of sub-categories
  const sl = opt.series.map(s => ({ s, v: r[s.key] || 0 })).filter(o => o.v > 0);
  const sum = sl.reduce((a, o) => a + o.v, 0);
  if (!sum) { el.innerHTML = `<p class="read" style="padding:40px 0;text-align:center">No SRs at the shown statuses at the end of this week.</p>`; return; }
  let a = 0; sl.forEach(o => { o.a0 = a; a += o.v / sum * 2 * Math.PI; o.a1 = a; o.mid = (o.a0 + o.a1) / 2; });
  const pt = (ang, rr) => (C + rr * Math.sin(ang)).toFixed(2) + "," + (C - rr * Math.cos(ang)).toFixed(2);
  const arc = (a0, a1, ro = R, ri = R0) => { a1 = Math.min(a1, a0 + 2 * Math.PI - 1e-4); const big = a1 - a0 > Math.PI ? 1 : 0;
    return `M${pt(a0, ro)}A${ro},${ro} 0 ${big} 1 ${pt(a1, ro)}L${pt(a1, ri)}A${ri},${ri} 0 ${big} 0 ${pt(a0, ri)}Z`; };
  // Sub-categories (opt.subs: slice key -> [{name, rank, n, ha, v}]) split that slice's arc in the outer ring, in shades of its colour
  const subs = [];
  sl.forEach((o, k) => { const parts = ((opt.subs || {})[o.s.key] || []).filter(q => q.v > 0), tot = parts.reduce((t, q) => t + q.v, 0);
    let b = o.a0; o.parts = parts.map(q => { const sp = Object.assign({}, q, { parent: k, a0: b, a1: b += q.v / tot * (o.a1 - o.a0), of: q.v / tot });
      sp.mid = (sp.a0 + sp.a1) / 2; sp.idx = subs.push(sp) - 1; return sp; }); });
  const SHADE = [1, .62, .36, .18], shade = q => SHADE[q.rank] ?? .18;
  const pct = v => { const p = v / sum * 100; return p > 0 && p < 1 ? "<1%" : Math.round(p) + "%"; };
  const sign = d => d > 0 ? "+" + opt.num(d) : d < 0 ? "−" + opt.num(-d) : "±0";
  let g = `<defs><filter id="${id}-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="${id}-core"><stop offset="0" stop-color="rgba(34,195,230,.12)"/><stop offset="1" stop-color="rgba(34,195,230,0)"/></radialGradient></defs>
    <circle cx="${C}" cy="${C}" r="${RS1 + 6}" fill="none" stroke="var(--grid)" stroke-dasharray="2 4"/>
    <circle cx="${C}" cy="${C}" r="${R0 - 9}" fill="url(#${id}-core)" stroke="var(--line)"/>
    <g class="${opt.spin ? "grow" : ""}" filter="url(#${id}-glow)">${sl.map((o, k) => `<path class="slice" data-k="${k}" d="${arc(o.a0, o.a1)}" fill="${o.s.color}" fill-opacity=".9" stroke="var(--surface)" stroke-width="2"/>`).join("")}
      ${subs.map(q => `<path class="sub-arc" data-s="${q.idx}" d="${arc(q.a0, q.a1, RS1, RS0)}" fill="${sl[q.parent].s.color}" fill-opacity="${shade(q)}" stroke="var(--surface)" stroke-width="1.5"/>`).join("")}</g>
    <text class="c-v" x="${C}" y="${C + 2}" text-anchor="middle">${opt.num(sum)}</text>
    <text class="c-l" x="${C}" y="${C + 22}" text-anchor="middle">${esc(opt.unit)}</text>
    <text class="c-w" x="${C}" y="${C + 38}" text-anchor="middle">${r.now ? "now" : esc(shortDate(r.label)) + (r.partial ? " · so far" : "")}</text>`;
  const list = `<div class="pie-list"><div class="pr hd"><span></span><span>Status</span><span>${esc(opt.unit)}</span><span>Share</span><span>${prev ? "vs wk before" : ""}</span></div>` +
    sl.map((o, k) => { const d = prev ? o.v - (prev[o.s.key] || 0) : null;
      return `<div class="pr" data-k="${k}" title="${esc(o.s.status)}"><i class="sw" style="background:${o.s.color};color:${o.s.color}"></i><span class="nm">${esc(o.s.name)}</span>
        <span class="n">${opt.num(o.v)}</span><span class="p">${pct(o.v)}</span><span>${d == null ? "" : `<span class="delta flat">${sign(d)}</span>`}</span></div>` +
        o.parts.map(q => `<div class="pr sub" data-s="${q.idx}" title="${esc(o.s.status)}: ${esc(q.name)}"><i class="sw" style="background:${o.s.color};color:${o.s.color};opacity:${shade(q)}"></i><span class="nm">${esc(q.name)}</span>
        <span class="n">${opt.num(q.v)}</span><span class="p">${Math.round(q.of * 100)}%</span><span></span></div>`).join(""); }).join("") +
    (subs.length ? `<div class="sub-note">Outer ring and indented rows: ${esc(opt.subNote || "")}; their % is of that status</div>` : "") + `</div>`;
  el.innerHTML = `<div class="pie"><svg viewBox="0 0 300 300" role="img" aria-label="${esc(opt.label)}, ${esc(weekName(r))}">${g}</svg>${list}</div><div class="tip"></div>`;
  const tip = el.querySelector(".tip"), paths = [...el.querySelectorAll(".slice")], items = [...el.querySelectorAll(".pr[data-k]")];
  const arcs = [...el.querySelectorAll(".sub-arc")], subRows = [...el.querySelectorAll(".pr[data-s]")];
  const push = (node, mid, on) => { node.style.transform = on ? `translate(${(7 * Math.sin(mid)).toFixed(2)}px,${(-7 * Math.cos(mid)).toFixed(2)}px)` : ""; };
  // focus(k): slice k with its ring; focus(k, j): only sub-category j of slice k
  const focus = (k, sj) => { paths.forEach((p, j) => { const on = j === k; push(p, sl[j].mid, on); p.style.opacity = k == null || on ? "" : ".35"; });
    arcs.forEach((a, j) => { const sp = subs[j], on = sp.parent === k && (sj == null || sj === j); push(a, sl[sp.parent].mid, sp.parent === k);
      a.style.opacity = k == null || on ? "" : ".25"; });
    items.forEach((it, j) => it.classList.toggle("on", j === k && sj == null)); subRows.forEach((it, j) => it.classList.toggle("on", j === sj)); };
  const tipAt = (k, ev, sj) => { const o = sl[k], st = o.s.status, sp = sj == null ? null : subs[sj];
    tip.innerHTML = `<div class="t">${esc(weekName(r))}</div>` + (sp
      ? `<div class="r"><span><i style="background:${o.s.color};opacity:${shade(sp)}"></i>${esc(o.s.name)} \u203a ${esc(sp.name)}</span><b>${pct(sp.v)}</b></div>
        <div class="r"><span>SRs</span><b>${sp.n.toLocaleString()}</b></div><div class="r"><span>Area</span><b>${fmtHa(sp.ha)} ha</b></div>
        <div class="r"><span>Of ${esc(o.s.name)}</span><b>${Math.round(sp.of * 100)}%</b></div>`
      : `<div class="r"><span><i style="background:${o.s.color}"></i>${esc(o.s.name)}</span><b>${pct(o.v)}</b></div>
        <div class="r"><span>SRs</span><b>${(r[st] || 0).toLocaleString()}</b></div><div class="r"><span>Area</span><b>${fmtHa(r[st + HA] || 0)} ha</b></div>` +
        o.parts.map(q => `<div class="r"><span>\u00a0\u00a0${esc(q.name)}</span><b>${opt.num(q.v)}</b></div>`).join("")) + (opt.extra ? opt.extra(r) : "");
    const b = el.getBoundingClientRect(), tw = tip.offsetWidth || 170; let left = ev.clientX - b.left + 14;
    if (left + tw > el.clientWidth) left = Math.max(0, ev.clientX - b.left - tw - 14);
    tip.style.left = left + "px"; tip.style.top = Math.max(0, ev.clientY - b.top + 14) + "px"; tip.style.opacity = 1; };
  paths.forEach((p, k) => { p.addEventListener("pointermove", ev => { focus(k); tipAt(k, ev); });
    p.addEventListener("pointerleave", () => { focus(null); tip.style.opacity = 0; }); });
  items.forEach((it, k) => { it.addEventListener("pointerenter", () => focus(k)); it.addEventListener("pointerleave", () => focus(null)); });
  arcs.forEach((a, j) => { const k = subs[j].parent; a.addEventListener("pointermove", ev => { focus(k, j); tipAt(k, ev, j); });
    a.addEventListener("pointerleave", () => { focus(null); tip.style.opacity = 0; }); });
  subRows.forEach((it, j) => { const k = subs[j].parent; it.addEventListener("pointerenter", () => focus(k, j)); it.addEventListener("pointerleave", () => focus(null)); });
}

/* ---------- Page ---------- */
/* Filters: one value per field, "" = all. Each list shows how many SRs match the other filters. */
const FILTERS = [["kind", "Kind of survey"], ["survey", "Survey status"], ["darmo", "DARMO"], ["marpo", "MARPO"]];
const BLANK = "(blank)", NOT_SET = "Not set";
const fval = (s, k) => k === "survey" ? (s.survey || NOT_SET) : (String(s[k] || "").trim() || BLANK);
let ui = { weeks: 12, table: false, metric: "count", week: "", f: { kind: "", survey: "", darmo: "", marpo: "" } };
try { if (localStorage.getItem("srdash-metric") === "area") ui.metric = "area"; } catch (e) {}
const fmtHa = v => (Math.round(v * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
try { const f = JSON.parse(localStorage.getItem("srdash-filters")); if (f) FILTERS.forEach(([k]) => { if (typeof f[k] === "string") ui.f[k] = f[k]; }); } catch (e) {}
const saveFilters = () => { try { localStorage.setItem("srdash-filters", JSON.stringify(ui.f)); } catch (e) {} };
const matches = (s, skip) => FILTERS.every(([k]) => k === skip || !ui.f[k] || fval(s, k) === ui.f[k]);
function renderFilters(list) {
  const order = k => k === "survey" ? (a, b) => (SURVEYS.indexOf(a) + 1 || 99) - (SURVEYS.indexOf(b) + 1 || 99) : (a, b) => (a === BLANK) - (b === BLANK) || a.localeCompare(b);
  const on = FILTERS.filter(([k]) => ui.f[k]);
  $("filters").innerHTML = FILTERS.map(([k, name]) => {
    const pool = list.filter(s => matches(s, k)), counts = {};
    pool.forEach(s => { const v = fval(s, k); counts[v] = (counts[v] || 0) + 1; });
    if (ui.f[k] && !counts[ui.f[k]]) counts[ui.f[k]] = 0; // keep the chosen value listed even when nothing matches now
    const vals = Object.keys(counts).sort(order(k));
    return `<label>${name}<select data-f="${k}" class="${ui.f[k] ? "on" : ""}"><option value="">All (${pool.length.toLocaleString()})</option>
      ${vals.map(v => `<option value="${esc(v)}" ${v === ui.f[k] ? "selected" : ""}>${esc(v)} (${counts[v].toLocaleString()})</option>`).join("")}</select></label>`;
  }).join("") + `<button class="btn" id="f-clear" ${on.length ? "" : "disabled"}>Clear</button>
    <div class="chips">${on.map(([k, name]) => `<span class="chip">${name}: ${esc(ui.f[k])}<button data-x="${k}" aria-label="Remove ${name} filter">×</button></span>`).join("")}</div>`;
  $("filters").querySelectorAll("select").forEach(el => el.onchange = () => { ui.f[el.dataset.f] = el.value; saveFilters(); render(); });
  $("filters").querySelectorAll("[data-x]").forEach(b => b.onclick = () => { ui.f[b.dataset.x] = ""; saveFilters(); render(); });
  $("f-clear").onclick = () => { FILTERS.forEach(([k]) => ui.f[k] = ""); saveFilters(); render(); };
}
try { const w = localStorage.getItem("srdash-range"); if (w !== null) ui.weeks = +w; } catch (e) {}
const $ = id => document.getElementById(id);
function sayTrend(a, b, upWord, downWord) { return b > a ? upWord : b < a ? downWord : "held steady"; }

/* Colour follows the status, never its rank: the first seven statuses found in all of this PC's SRs (in survey order) get the seven
   series colours, checked with the dataviz palette validator on this surface; any further statuses share "Other statuses" in grey. */
const PALETTE = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c", "#9085e9"], OTHER = "Other statuses", OTHER_COLOR = "#8b9bb8";
const short = st => st.replace("CONDUCTED INITIAL PULONG PULONG", "INITIAL PULONG-PULONG").replace(" FOR LRA APPROVAL", "").replace(" FOR APPROVAL", "");
const sortStatus = (a, b) => (SURVEYS.indexOf(a) + 1 || 99) - (SURVEYS.indexOf(b) + 1 || 99);
let keyOf = st => st;
function seriesFor(rawList) {
  const present = [...new Set(rawList.map(statusOf))].sort(sortStatus);
  const own = present.slice(0, present.length > 8 ? 7 : 8), rest = present.slice(own.length);
  keyOf = st => own.includes(st) ? st : OTHER;
  return own.map((st, i) => ({ key: st, name: short(st), color: PALETTE[i] || OTHER_COLOR })).concat(rest.length ? [{ key: OTHER, name: `${OTHER} (${rest.length})`, color: OTHER_COLOR, members: rest }] : []);
}
const hidden = new Set();
try { (JSON.parse(localStorage.getItem("srdash-hidden")) || []).forEach(k => hidden.add(k)); } catch (e) {}

function render() {
  const raw = readDesk() || sampleDesk(), desk = Object.assign({}, raw, { list: raw.list.filter(s => matches(s)) });
  renderFilters(raw.list);
  const filtered = FILTERS.some(([k]) => ui.f[k]);
  const SER = seriesFor(raw.list), keys = SER.map(x => x.key);
  const B = build(desk, keys);
  const all = B.rows, rows = ui.weeks ? all.slice(-ui.weeks) : all;

  $("live").classList.toggle("off", desk.sample);
  $("src").innerHTML = desk.sample ? `Sample data · no SR Desk copy found on this PC${filtered ? ` · ${B.total} of ${raw.list.length} sample SRs match` : ""}`
    : `${filtered ? `${B.total.toLocaleString()} of ${raw.list.length.toLocaleString()}` : B.total.toLocaleString()} SRs from this PC's SR Desk copy · register pulled ${esc(desk.pulledAt ? desk.pulledAt.replace("T", " ").slice(0, 16) : "—")}${desk.pending ? ` · ${desk.pending} change${desk.pending > 1 ? "s" : ""} not yet synced (included)` : ""}`;
  $("banner").innerHTML = desk.sample ? `<div class="banner"><b>SAMPLE DATA, made up.</b> This PC has no SR Desk data yet. Open the SR Verification Desk from this same place, connect it in Settings and let it sync; this page then shows the real SRs and updates on its own.</div>` : "";
  if (filtered && !B.total) $("banner").innerHTML += `<div class="banner"><b>No SRs match these filters.</b> Change one or press Clear.</div>`;
  document.querySelectorAll("#range button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.w === ui.weeks)));

  // Now: every SR, every status (no folding: this is a list, not lines)
  const AREA = ui.metric === "area";
  document.querySelectorAll("#metric button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === ui.metric)));
  const now = {}, nowHa = {}; desk.list.forEach(s => { const st = statusOf(s); now[st] = (now[st] || 0) + 1; nowHa[st] = (nowHa[st] || 0) + (s.area || 0); });
  const totalHa = Object.values(nowHa).reduce((a, b) => a + b, 0), noArea = desk.list.filter(s => s.area == null).length;
  const val = st => AREA ? nowHa[st] : now[st], sum = AREA ? totalHa : B.total;
  const order = Object.keys(now).sort(sortStatus), max = Math.max(1e-9, ...order.map(val));
  const colorOf = st => (SER.find(x => x.key === keyOf(st)) || {}).color || OTHER_COLOR;
  $("now-total").innerHTML = `<b>${B.total.toLocaleString()}</b> SRs · <b>${fmtHa(totalHa)}</b> ha`;
  $("r-now").innerHTML = (AREA ? "Total area (hectares, Area Validated) of the SRs at each survey status today." : "How many SRs are at each survey status today.") +
    ` Every SR is counted here.${noArea ? ` ${noArea.toLocaleString()} SR${noArea === 1 ? " has" : "s have"} no area in the register and add 0 ha.` : ""}`;
  $("snap").innerHTML = order.length ? order.map(st => `<div class="row" title="${esc(st)}"><div class="name"><i class="sw" style="background:${colorOf(st)};color:${colorOf(st)}"></i><span>${esc(st)}</span></div>
      <div class="track"><i style="width:${val(st) / max * 100}%;background:${colorOf(st)};color:${colorOf(st)}"></i></div>
      <div class="n">${AREA ? `${fmtHa(nowHa[st])} ha <span class="alt">· ${now[st].toLocaleString()} SRs</span>` : `${now[st].toLocaleString()} SRs <span class="alt">· ${fmtHa(nowHa[st])} ha</span>`}<small>${sum ? Math.round(val(st) / sum * 100) : 0}%</small></div></div>`).join("") : `<p class="read">No SRs.</p>`;

  // Pie stops: each finished week (rebuilt from dates), then Now = exactly "Survey status now" (every SR, same grouping as the key)
  const nowRow = { label: todayIso(), now: true, total: B.total, totalHa }; keys.forEach(k => { nowRow[k] = 0; nowRow[k + HA] = 0; });
  Object.keys(now).forEach(st => { const k = keyOf(st); nowRow[k] += now[st]; nowRow[k + HA] += nowHa[st]; });
  const stops = rows.filter(r => !r.partial).concat(nowRow);
  // DARPO status of the SRs now at SR AT DARPO: the sub-categories on the Now pie (the SR Desk keeps no history of it, so not on past weeks)
  const DARPO_SUBS = ["Pending", "Ongoing Verification", "Compliance"], darpo = {};
  desk.list.forEach(s => { if (statusOf(s) !== AT_DARPO) return; const k = s.status || NOT_SET, o = darpo[k] || (darpo[k] = { n: 0, ha: 0 }); o.n++; o.ha += s.area || 0; });
  const subRank = k => DARPO_SUBS.includes(k) ? DARPO_SUBS.indexOf(k) : 3;
  const darpoParts = Object.keys(darpo).sort((p, q) => subRank(p) - subRank(q))
    .map(k => ({ name: k, rank: subRank(k), n: darpo[k].n, ha: darpo[k].ha, v: AREA ? darpo[k].ha : darpo[k].n }));
  // Week by week
  const SK = x => AREA ? x.key + HA : x.key; // the value this chart draws for a status
  const show = SER.filter(x => !hidden.has(x.key) && stops.some(r => r[x.key])).map(x => Object.assign({}, x, { key: SK(x), status: x.key }));
  $("h-status").textContent = AREA ? "Mix of survey statuses by area, week by week (ha)" : "Mix of survey statuses, week by week";
  let wi = stops.findIndex(r => !r.now && r.label === ui.week); if (wi < 0) wi = stops.length - 1; // "" = Now
  curRows = stops;
  $("legend").innerHTML = SER.filter(x => nowRow[x.key] || all.some(r => r[x.key])).map(x => `<button aria-pressed="${!hidden.has(x.key)}" data-k="${esc(x.key)}" title="${esc(x.members ? x.members.join(", ") : x.key)}">
      <i style="background:${x.color};color:${x.color}"></i>${esc(x.name)}</button>`).join("");
  $("legend").querySelectorAll("button").forEach(b => b.onclick = () => { const k = b.dataset.k; hidden.has(k) ? hidden.delete(k) : hidden.add(k);
    try { localStorage.setItem("srdash-hidden", JSON.stringify([...hidden])); } catch (e) {} render(); });
  $("cover").innerHTML = stops[wi].now ? `pie shows all <b>${B.total.toLocaleString()}</b> SRs, as in Survey status now` : `past weeks cover <b>${B.dated.toLocaleString()}</b> of ${B.total.toLocaleString()} SRs`;
  const z = stops[wi], a = z.now ? null : stops[wi - 1], f = v => AREA ? fmtHa(v) + " ha" : v, zSum = show.reduce((t, x) => t + (z[x.key] || 0), 0);
  const top = show.slice().sort((p, q) => z[q.key] - z[p.key]).filter(x => z[x.key])[0];
  $("r-status").innerHTML = !B.total ? "No SRs, so there is nothing to draw." :
    `Each slice is ${AREA ? "the share of area (ha) of the SRs" : "the share of SRs"} at that status; slices add up to the shown statuses. The pie opens on <b>Now</b>, the same figures as Survey status now; there the outer ring splits <b>SR AT DARPO</b> by DARPO status (Pending, Ongoing Verification, Compliance). Move the slider back to see the mix at the end of past weeks: a slice that <b>grows</b> week to week means SRs are piling up at that step.` +
    (top ? ` ${z.now ? "Now" : `At the end of the ${esc(weekName(z).replace("Week", "week"))}`} the biggest is <b>${esc(top.name)}</b> with <b>${f(z[top.key])}</b> (${zSum ? Math.round(z[top.key] / zSum * 100) : 0}%)${a ? `, ${sayTrend(a[top.key], z[top.key], "up", "down")} from ${f(a[top.key])} the week before` : ""}.` : "") +
    ` Click a status in the key to hide or show it.`;
  $("wk-row").hidden = !show.length || stops.length < 2;
  $("wk").max = stops.length - 1; $("wk").value = wi; $("wk-name").textContent = weekName(z);
  $("wk-prev").disabled = wi <= 0; $("wk-next").disabled = wi >= stops.length - 1;
  if (show.length) pieChart($("c-status"), z, a, { label: AREA ? "Share of area at each survey status, hectares" : "Share of SRs at each survey status",
    spin: !weekStep, series: show, subNote: "DARPO status of the SRs at DARPO",
    subs: z.now && keyOf(AT_DARPO) === AT_DARPO ? { [AREA ? AT_DARPO + HA : AT_DARPO]: darpoParts } : null, num: AREA ? fmtHa : v => v.toLocaleString(), unit: AREA ? "hectares" : "SRs",
    extra: r => `<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>${r.now ? "All SRs" : "All dated SRs"}</span><b>${r.total} · ${fmtHa(r.totalHa)} ha</b></div>` });
  else $("c-status").innerHTML = `<p class="read" style="padding:40px 0;text-align:center">${B.total ? "Every status is hidden. Click one in the key to show it." : "Nothing to draw."}</p>`;

  $("table-wrap").hidden = !ui.table; $("tbl-btn").textContent = ui.table ? "Hide table" : "Show table"; $("tbl-btn").setAttribute("aria-expanded", String(ui.table));
  const cols = SER.filter(x => all.some(r => r[x.key]));
  $("h-table").textContent = "Weekly figures: SRs and area (ha) at each status, end of week";
  if (ui.table) $("table").innerHTML = `<table><thead><tr><th>Week of</th>${cols.map(x => `<th title="${esc(x.key)}" colspan="2">${esc(x.name)}</th>`).join("")}<th colspan="2">All dated</th></tr>
    <tr><th></th>${cols.map(() => "<th>SRs</th><th>ha</th>").join("")}<th>SRs</th><th>ha</th></tr></thead><tbody>
    ${rows.slice().reverse().map(r => `<tr><td>${r.label}${r.partial ? " (so far)" : ""}</td>${cols.map(x => `<td>${r[x.key]}</td><td>${fmtHa(r[x.key + HA])}</td>`).join("")}<td>${r.total}</td><td>${fmtHa(r.totalHa)}</td></tr>`).join("")}</tbody></table>`;

  const undated = B.total - B.dated;
  $("notes").innerHTML = `<b>How these are counted</b><ul>
    <li><b>Survey status now</b> counts every SR at its current survey status, from this PC's SR Desk copy.</li>
    <li><b>Area</b> is the register's Area Validated, in hectares (an Admin's correction in the SR Desk is used). An SR with no area adds 0 ha${noArea ? `: ${noArea.toLocaleString()} here` : ""}. Switch between <b>SRs</b> and <b>Area (ha)</b> at the top.</li>
    <li>The SR Desk keeps each SR's current status and a few dates, not a full history. The week-by-week pie is rebuilt from those dates: the date received at DARPO, the date received by RPMO (or the date endorsed to RPMO), and the date of the current status. Before an SR's first dated step it is not counted.</li>
    <li>${undated.toLocaleString()} SR${undated === 1 ? " has" : "s have"} no dated step at all, so ${undated === 1 ? "it is" : "they are"} in "Survey status now" but not in the pie's past weeks (they are in its Now). A step with no recorded date does not show: the SR stays counted at its last dated step until its next dated one. For example, an SR now at "ASP FROM LMS RECEIVED BY RPMO" counts as "SR RECEIVED BY RPMO" until that ASP date, even though it was transmitted to LMS in between.</li>
    <li>The pie opens on <b>Now</b>: every SR at its current survey status, the same figures as Survey status now. Earlier stops on the slider are finished weeks (Monday to Sunday), rebuilt from dates; the week in progress is covered by Now. The table still lists the week in progress.</li>
    <li>The outer ring on <b>Now</b> splits SR AT DARPO by its <b>DARPO status</b> (Pending, Ongoing Verification, Compliance; "Not set" if blank). Past weeks have no ring: the SR Desk keeps only each SR's current DARPO status. No other survey status has a sub-status in the SR Desk.</li>
    <li>Filters use each SR's <b>current</b> kind, survey status, DARMO and MARPO. So "Survey status: SR RECEIVED BY RPMO" shows the past weeks of the SRs now at RPMO, including the weeks they were still at DARPO. An Admin's corrections in the SR Desk are used.</li>
    <li>Read-only. Nothing on this page is written to the SR Desk or the Sheet.</li></ul>`;
}

document.querySelectorAll("#range button").forEach(b => b.onclick = () => { ui.weeks = +b.dataset.w; try { localStorage.setItem("srdash-range", ui.weeks); } catch (e) {} render(); });
let curRows = [];
let weekStep = false; // stepping through weeks redraws without the opening spin
const pickWeek = i => { i = Math.max(0, Math.min(curRows.length - 1, i)); ui.week = i === curRows.length - 1 ? "" : curRows[i].label; weekStep = true; render(); weekStep = false; };
$("wk").oninput = () => pickWeek(+$("wk").value);
$("wk-prev").onclick = () => pickWeek(+$("wk").value - 1);
$("wk-next").onclick = () => pickWeek(+$("wk").value + 1);
$("tbl-btn").onclick = () => { ui.table = !ui.table; render(); };
document.querySelectorAll("#metric button").forEach(b => b.onclick = () => { ui.metric = b.dataset.m; try { localStorage.setItem("srdash-metric", ui.metric); } catch (e) {} render(); });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
addEventListener("storage", e => { if (e.key === STORE) render(); }); // the SR Desk synced in another tab
render();
</script>
<script id="aw-tt-loader">/* Sort, filter and search on every table (fx/table-tools.js). The panel also adds it; it runs once. Skipped on the Apps Script copies, which have no fx folder. */(function(){if(/google/.test(location.hostname))return;var s=document.createElement("script");s.src="fx/table-tools.js";document.head.appendChild(s);})();</script>
</body>
</html>
