<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SR Verification Desk</title>
<style>
:root {
  --bg: #F3F5F2; --surface: #FFFFFF; --surface-2: #EBEEE9; --line: #D6DBD3; --fg: #18201B; --muted: #5B675F;
  --accent: #1E4E8C; --accent-fg: #FFFFFF; --accent-bg: #E3ECF8;
  --pass: #1D7343; --pass-bg: #E2F2E8; --fail: #B0261C; --fail-bg: #FBE6E3; --warn: #8F5B00; --warn-bg: #FBF0D9; --na: #6F7A72; --na-bg: #ECEFEB;
  --shadow: 0 10px 40px rgba(20, 30, 25, .18);
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  --gap-s: 8px; --gap-l: 20px; --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --surface: #181D1A; --surface-2: #20261F; --line: #313A34; --fg: #E4E9E5; --muted: #98A39C;
  --accent: #8FB5EE; --accent-fg: #0D1A2C; --accent-bg: #1C2B40;
  --pass: #6BCB93; --pass-bg: #17301F; --fail: #F28C82; --fail-bg: #3A1B18; --warn: #E3B24F; --warn-bg: #352812; --na: #8E9890; --na-bg: #232924;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181D1A; --surface-2: #20261F; --line: #313A34; --fg: #E4E9E5; --muted: #98A39C;
  --accent: #8FB5EE; --accent-fg: #0D1A2C; --accent-bg: #1C2B40;
  --pass: #6BCB93; --pass-bg: #17301F; --fail: #F28C82; --fail-bg: #3A1B18; --warn: #E3B24F; --warn-bg: #352812; --na: #8E9890; --na-bg: #232924;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--gap-s) var(--gap-l); padding-block: 16px 0; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.brand p { margin: 2px 0 12px; color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 2px; }
.tab { border: 0; background: none; padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:hover { color: var(--fg); }
.notice { background: var(--warn-bg); color: var(--warn); font-size: 12.5px; }
.notice .wrap { padding-block: 6px; }

main .wrap { padding-block: var(--gap-l) 48px; display: grid; gap: var(--gap-l); }
#reg-results { display: grid; gap: var(--gap-l); min-width: 0; }

/* Controls */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary.return { background: var(--fail); border-color: var(--fail); color: var(--surface); }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn.link { border: 0; background: none; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.btn.link.armed { color: var(--fail); }
.field { display: grid; gap: 4px; }
.field label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.field input, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 7px 10px; min-width: 0; }

/* Register */
.chips { display: flex; flex-wrap: wrap; gap: var(--gap-s); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; }
.chip b { font-variant-numeric: tabular-nums; font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); }
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)); gap: var(--gap-s) 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.mono, td.num, td .sub { white-space: nowrap; }
td.who { min-width: 160px; }
.sub { color: var(--muted); font-size: 12.5px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.route { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--fg); }
.pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.st-received { background: var(--na-bg); color: var(--na); }
.st-inprog { background: var(--accent-bg); color: var(--accent); }
.st-returned { background: var(--fail-bg); color: var(--fail); }
.st-endorsed { background: var(--pass-bg); color: var(--pass); }
.prog { display: grid; gap: 4px; min-width: 88px; }
.bar { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .p { background: var(--pass); } .bar .f { background: var(--fail); } .bar .n { background: var(--na); }
.age-old { color: var(--fail); font-weight: 600; }

.panel h2 { font-size: 15px; margin: 0; font-weight: 600; }
.panel-head { padding: 14px 16px 10px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.panel-body { padding: 0 16px 16px; }
.cat-edit { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; display: grid; gap: 10px; }
.cat-pick { display: grid; gap: 2px; max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; }
.cat-pick label { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 4px; font-size: 13px; cursor: pointer; }
.cat-pick label:hover { background: var(--surface-2); }
.cat-pick label[hidden] { display: none; }
.rem-empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px 16px; text-align: center; color: var(--muted); }
.cat-pick .sub { font-size: 12px; }
.cat-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cat-row input { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; background: var(--surface); }
/* Series colours (2026-11-19): categorical slots from the validated dataviz default palette, stepped for each mode. */
:root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; } }
:root[data-theme="dark"] { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; }
/* Dashboard (2026-11-21): survey status pies of SBA 4 and 2025-A, the same mechanics as the SR Flow Dashboard (sr-dashboard.html),
   in the app's own tokens. Scoped to .sdk so nothing else on the page changes. */
.sdk { display: grid; gap: 16px; }
.sdk-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 16px; flex-wrap: wrap; }
.sdk-top h2 { margin: 0; font-size: 18px; font-weight: 600; }
.sdk .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); }
.sdk .seg button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12.5px; font-weight: 500; }
.sdk .seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); }
.sdk-kind { border-left: 5px solid var(--kc); overflow: hidden; }
.sdk .kind-head { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 12px 16px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--kc) 18%, transparent), color-mix(in srgb, var(--kc) 3%, transparent)); border-bottom: 1px solid color-mix(in srgb, var(--kc) 40%, transparent); }
.sdk .kind-head h2 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sdk .kind-badge { font-size: 13px; font-weight: 700; letter-spacing: .04em; padding: 3px 10px; border-radius: 6px; background: var(--kc); color: #fff; }
.sdk-ctl { display: flex; gap: 8px; flex-wrap: wrap; }
.msel { position: relative; font-size: 12.5px; }
.msel summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: var(--radius); padding: 6px 10px; max-width: 300px; white-space: nowrap; user-select: none; }
.msel summary::-webkit-details-marker { display: none; }
.msel .ms-l { color: var(--muted); }
.msel .ms-v { overflow: hidden; text-overflow: ellipsis; font-weight: 600; min-width: 0; }
.msel .ms-n { color: var(--muted); font-weight: 400; }
.msel .ms-c { color: var(--muted); font-size: 10px; }
.msel.on summary { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.msel.off summary { opacity: .5; cursor: not-allowed; }
.msel .ms-pop { position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; width: max-content; min-width: 260px; max-width: min(380px, calc(100vw - 16px)); max-height: 340px; overflow: auto;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 28px rgba(0,0,0,.28); padding: 6px; }
.msel .ms-act { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 2px 4px 6px; margin-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
.msel .ms-act button { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; padding: 2px 4px; }
.msel .ms-act button[disabled] { color: var(--muted); opacity: .5; cursor: default; }
.msel .ms-pop label { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px; border-radius: 6px; cursor: pointer; }
.msel .ms-pop label:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.msel .ms-pop input { accent-color: var(--accent); margin: 0; }
.msel .ms-pop b { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.pill.commit { margin-top: 3px; font-size: 11px; padding: 1px 7px; background: var(--accent-bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); font-family: inherit; }
.sdk .cover { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sdk .cover b { color: var(--fg); }
.sdk-body { padding: 12px 16px 16px; }
.sdk .legend { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.sdk .legend button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 12px; color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.sdk .legend button i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sdk .legend button[aria-pressed="false"] { color: var(--muted); }
.sdk .legend button[aria-pressed="false"] i { opacity: .25; }
.sdk .chart { position: relative; width: 100%; }
.sdk .chart svg { display: block; width: 100%; overflow: visible; }
.sdk .pie { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 16px 28px; align-items: center; }
.sdk .pie svg { max-width: 300px; height: auto; margin: 0 auto; }
.sdk .pie .grow { transform-origin: 150px 150px; animation: sdk-spin .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes sdk-spin { from { transform: rotate(-120deg) scale(.6); opacity: 0; } }
.sdk .pie .slice, .sdk .pie .sub-arc { stroke: var(--surface); transition: transform .18s ease-out, opacity .18s; cursor: pointer; }
.sdk .pie .slice { stroke-width: 2; } .sdk .pie .sub-arc { stroke-width: 1.5; }
.sdk .c-v { fill: var(--fg); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sdk .c-l { fill: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.sdk .c-w { fill: var(--accent); font-size: 11px; }
.sdk .pie-list { display: grid; gap: 3px; min-width: 0; }
.sdk .pie-list .pr { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 44px; gap: 10px; align-items: center; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; border: 1px solid transparent; }
.sdk .pie-list.both .pr { grid-template-columns: 10px minmax(0, 1fr) 52px 84px 44px; }
.sdk .pie-list .pr.on { background: var(--surface-2); border-color: var(--line); }
.sdk .pie-list .pr.pick { background: var(--accent-bg); border-color: var(--accent); }
.sdk .pie-list .pr[data-k], .sdk .pie-list .pr[data-s] { cursor: pointer; }
.sdk .pie-list .pr.hd { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 0; }
.sdk .pie-list .pr.hd span:nth-child(n+3) { text-align: right; }
.sdk .pie-list .sw { width: 10px; height: 10px; border-radius: 3px; }
.sdk .pie-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sdk .pie-list .n, .sdk .pie-list .p { font-variant-numeric: tabular-nums; text-align: right; }
.sdk .pie-list .n { color: var(--fg); font-weight: 500; } .sdk .pie-list .p, .sdk .pie-list .n.alt { color: var(--muted); }
.sdk .pie-list .pr.sub { padding-top: 2px; padding-bottom: 2px; font-size: 12px; color: var(--muted); }
.sdk .pie-list .pr.sub .nm { padding-left: 14px; position: relative; }
.sdk .pie-list .pr.sub .nm::before { content: ""; position: absolute; left: 2px; top: -6px; width: 7px; height: 12px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); border-bottom-left-radius: 3px; }
.sdk .pie-list .pr.sub .sw { width: 8px; height: 8px; justify-self: center; }
.sdk .pie-list .sub-note { font-size: 11px; color: var(--muted); padding: 4px 8px 0; }
.sdk .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 150px; box-shadow: var(--shadow); opacity: 0; transition: opacity .12s; z-index: 5; }
.sdk .tip .t { color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .04em; margin-bottom: 4px; }
.sdk .tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); }
.sdk .tip .r b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.sdk .tip .r i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.sdk .hint { margin: 10px 0 0; }
.sdk .att { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; }
.sdk .att:empty { display: none; }
.sdk .att-in { animation: sdk-in .4s cubic-bezier(.2,.8,.2,1) both; transform-origin: top center; }
@keyframes sdk-in { from { opacity: 0; transform: translateY(-10px) scale(.97); } }
.sdk .att .pie { grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); }
.sdk .att .pie svg { max-width: 240px; }
.sdk .att h3, .sdk .cat h3 { margin: 0; font-size: 14px; font-weight: 600; }
.sdk .chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.sdk .chart-head .sub { margin: 2px 0 8px; }
.sdk .cat { margin-top: 14px; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface-2); }
.sdk .cat .legend button { background: var(--surface); }
.sdk .chips .chip { cursor: default; }
.sdk .chips .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 12px; text-decoration: underline; }
.sdk .lh tbody tr[data-seq] { cursor: pointer; }
.sdk .lh tbody tr[data-seq]:hover td { background: var(--surface-2); }
.sdk .lh .open { color: var(--accent); font-size: 12px; white-space: nowrap; }
.sdk-notes { color: var(--muted); font-size: 12.5px; }
.sdk-notes ul { margin: 6px 0 0; padding-left: 18px; } .sdk-notes li { margin: 2px 0; }
@media (prefers-reduced-motion: reduce) { .sdk .pie .grow, .sdk .att-in { animation: none; } }
@media (max-width: 600px) { .sdk .pie, .sdk .att .pie { grid-template-columns: 1fr; } .sdk .pie-list.both .pr { grid-template-columns: 10px minmax(0, 1fr) 40px 70px 40px; gap: 6px; } }

/* Checklist reference tab */
.ref-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.ref-doc { padding: 10px 0; border-top: 1px solid var(--line); }
.ref-doc:first-of-type { border-top: 0; }
.ref-doc h4 { margin: 0 0 4px; font-size: 13.5px; font-weight: 600; }
.ref-doc ul, .ol { margin: 0; padding-left: 20px; color: var(--fg); }
.ref-doc li, .ol li { margin: 2px 0; }
h3.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin: 12px 0 6px; }

/* Checklist panel (drawer) */
/* Peek (opened from the SR Flow Dashboard in the panel): only the drawer shows; the rest of the page is see-through. */
html.peek, html.peek body { background: transparent !important; }
html.peek body > :not(#drawer-root):not(.toast) { display: none !important; }
html.peek body::before, html.peek body::after { display: none !important; }
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 12, .45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100%); background: var(--bg); z-index: 21; display: flex; flex-direction: column; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dw-head { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.dw-head .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.dw-head h2 { margin: 6px 0 2px; font-size: 18px; font-weight: 600; text-wrap: balance; }
.dw-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; display: grid; gap: var(--gap-l); align-content: start; }
.dw-foot { background: var(--surface); border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dw-foot .summary { display: grid; gap: 4px; min-width: 180px; flex: 1; }
.dw-foot .actions { display: flex; gap: var(--gap-s); flex-wrap: wrap; }
.sect h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.sect h3 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.hdr-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.hdr-form div { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); }
.hdr-form div:nth-last-child(-n+2) { border-bottom: 0; }
.hdr-form dt { color: var(--muted); font-size: 12.5px; }
.hdr-form dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.assign { display: flex; gap: 12px; align-items: end; margin-top: 10px; flex-wrap: wrap; }
.ref-notes { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.ref-notes summary { padding: 10px 12px; cursor: pointer; font-weight: 500; }

/* Document models in the Document checks tab (2026-11-22): model left, checks and data right; the glow moves to the field.
   Redrawn from the user's reference copies: printed words as deco, the fields as regions over them. */
:root { --paper: #FCFBF6; --paper-ink: #23292A; --paper-faint: #C9CFC6; --paper-val: #1B3F7A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #1E2420; --paper-ink: #D9DFDA; --paper-faint: #3E4842; --paper-val: #9DC0F2; } }
:root[data-theme="dark"] { --paper: #1E2420; --paper-ink: #D9DFDA; --paper-faint: #3E4842; --paper-val: #9DC0F2; }
.drawer { transition: width .25s ease; }
.drawer.wide { width: min(1320px, 100%); }
.doc-card.has-dm { overflow: clip; }
.dm-split { display: grid; grid-template-columns: minmax(280px, 480px) minmax(0, 1fr); gap: 16px; padding: 0 12px 12px; align-items: start; }
.dm-split .checks { margin: 0; }
.dm-side { position: sticky; top: -16px; padding-top: 16px; display: grid; gap: 6px; align-content: start; z-index: 1; }
.dm-stage { display: grid; }
.dm { position: relative; width: min(100%, calc((100vh - 360px) * var(--ar))); margin: 0 auto; container-type: inline-size; background: var(--paper); color: var(--paper-ink);
  border: 1px solid var(--line); border-radius: 3px; box-shadow: 0 1px 2px rgba(20, 30, 25, .08), 0 10px 28px rgba(20, 30, 25, .10); overflow: hidden; font-family: Georgia, "Times New Roman", serif; }

.dm.no-scan::after { content: "Model image not found (dm folder missing beside the page)"; position: absolute; inset: 40% 8% auto; text-align: center; font: 13px/1.4 var(--font-body); color: var(--muted); }
.dm { --scan-f: brightness(1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dm { --scan-f: invert(.88) hue-rotate(180deg); } }
:root[data-theme="dark"] .dm { --scan-f: invert(.88) hue-rotate(180deg); }
.dm-scan { filter: var(--scan-f); transition: filter .3s ease; }
.dm.is-scan.has-focus .dm-scan:not(.dm-sharp) { filter: var(--scan-f) brightness(.7); }

.dm-r.is-scan { padding: 0 .3cqw; } .dm-r.is-scan .v { background: var(--paper); padding: 0 .4cqw; border-radius: 2px; font-size: clamp(7px, 1.6cqw, 13px); box-shadow: 0 0 0 1px color-mix(in srgb, var(--paper-val) 35%, transparent); }

.dm.is-scan.has-focus .dm-r, .dm.is-scan.has-focus .dm-r.on { opacity: 1; background: transparent; border-color: transparent; }

  box-shadow: 0 0 6px 1px color-mix(in srgb, #9cc4ff 70%, transparent), 0 0 18px 4px color-mix(in srgb, var(--accent) 45%, transparent); }

  transition: opacity .25s, background-color .25s, border-color .25s; }

.dm-r .v { font-size: calc(1.75cqw * var(--fs, 1)); line-height: 1.2; color: var(--paper-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

    planConform: ["Plan", "Entries should conform with title, profile and ldc"],
    planSum: ["Plan", "Check summation of distances of bdry. lines traversed by subd. lines"],
    planGE: ["Plan", "Signature of Geodetic Engineer"], planMarpo: ["Plan", "Signature of MARPO"],
    planClaim: ["Plan", "Name of claimants are inside the subdivided lots (claimants appearing on title must be the same with that on plan)"],
    planCorner: ["Plan", "Upper right corner of plan must be properly filled out"],
    titleConform: ["UPDATED PHILARIS", "Entries should conform with plan, otherwise certify on field notes cover"],
    titleAnnot: ["UPDATED PHILARIS", "Check annotation"],
    profSig: ["CARP Survey Profile", "Check signatures"], profComplete: ["CARP Survey Profile", "Entries should be complete"],
    profConform: ["CARP Survey Profile", "Lot no., claimants, land use & area should conform with plan, title & ldc"],
    profStatus: ["CARP Survey Profile", "Check status (carpable, non-carpable)"], profSum: ["CARP Survey Profile", "Check summation of aggregate area"],
    jointSig: ["PARPO/MARPO/GE Joint", "Check signatures"], jointComplete: ["PARPO/MARPO/GE Joint", "Entries should be complete"],
    award: ["Certification as to Award Limit", "CA/VOS/OLT: 3.0000 has."],
    fncSeal: ["Field Notes Cover", "Signed & sealed by GE"], fncStamp: ["Field Notes Cover", "Documentary stamp"], fncComplete: ["Field Notes Cover", "Entries should be complete"],
    ldcSigned: ["Lot Data Computation", "Signed by GE"], ldcConform: ["Lot Data Computation", "Entries should conform with plan"],
    refLdc: [["Reference Data", "Cadastral Map"], "Ref. LDC/LDS: check coordinates and Technical Description"],
    // LRA items added 2026-11-12 from Document_Verification_Checklist.xlsx (not on the DENR checklist, so they resolve to nothing there).
    titleTD: ["UPDATED PHILARIS", "Technical description (TD)"], titleTie: ["UPDATED PHILARIS", "Tie line"],
    planBndTD: ["Plan", "Boundary technical description"], planSubTD: ["Plan", "Sublots technical description"],
    planSubLots: ["Plan", "Sublots: Lot No. and area"], planLots: ["Plan", "Lots and corners"],
    ldcRef: ["Lot Data Computation", "Reference tie point"], ldcNE: ["Lot Data Computation", "Northing, Easting"],
    ldcBD: ["Lot Data Computation", "Bearing / Distance"], ldcArea: ["Lot Data Computation", "Area"]
  };
  // The checklist document row each kind of JSON stands for (marked Present when uploaded).
  const DOC_ROW = { title: ["PHILARIS", "Certified True Copy of Title"], plan: ["Plan"], fnc: ["Field Notes Cover", "Duly Notarized Field Notes"],
    ldc: ["Lot Data Computation"], profile: ["CARP Survey Profile"], joint: ["PARPO/MARPO/GE Joint", "PARPO/MARPO /GE Joint"], award: ["Certification as to Award Limit"] };

  /* ---- values: a field may be a plain value, null (blank on the document) or {value, unreadable: true} ---- */
  const isObj = x => !!x && typeof x === "object" && !Array.isArray(x);
  const unr = x => isObj(x) && x.unreadable === true;
  const val = x => isObj(x) && "value" in x ? x.value : x;
  const isBlank = x => { const v = val(x); return v === null || v === undefined || (typeof v === "string" && !v.trim()) || (Array.isArray(v) && !v.length); };
  const num = x => { const v = val(x); if (typeof v === "number") return v; const t = String(v ?? "").replace(/[, ]/g, ""); return t !== "" && !isNaN(+t) ? +t : NaN; };
  const up = x => String(val(x) ?? "").toUpperCase();
  const get = (o, path) => path.split(".").reduce((x, k) => (x == null ? undefined : x[k]), o);
  const has = (o, path) => get(o, path) !== undefined;
  const lbl = f => f.replace(/^notary\./, "notary ").replace(/^signatures\./, "signature ").replace(/_no$/, " no.").replace(/_/g, " ");
  const show = x => { const v = val(x); return v === null || v === undefined || v === "" ? "blank" : Array.isArray(v) ? v.map(show).join("; ") : String(v); };
  const nName = x => up(x).replace(/\/.*$/, "").replace(/[.,]/g, " ").replace(/\bET\s*AL\b.*$/, "").replace(/\s+/g, " ").trim();
  const etAl = x => /\bET\.?\s*AL\b/.test(up(x));
  const nTitle = x => up(x).replace(/\b(OCT|TCT|NO|CLOA)\b\.?/g, "").replace(/[^A-Z0-9]/g, "");
  const nCode = x => up(x).replace(/^LOT\s*/, "").replace(/[^A-Z0-9]/g, "");
  const nPlace = x => up(x).replace(/[^A-Z]/g, "");
  function lev(a, b) { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length]; }
  const isoD = x => /^\d{4}-\d{2}-\d{2}$/.test(String(val(x) || "")) ? String(val(x)) : "";
  const r2 = x => (Math.round(x * 100) / 100).toFixed(2);

  /* ---- numbers in words ("SEVENTEEN THOUSAND EIGHT HUNDRED TWENTY FOUR") ---- */
  const W = { ZERO: 0, ONE: 1, TWO: 2, THREE: 3, FOUR: 4, FIVE: 5, SIX: 6, SEVEN: 7, EIGHT: 8, NINE: 9, TEN: 10, ELEVEN: 11, TWELVE: 12, THIRTEEN: 13,
    FOURTEEN: 14, FIFTEEN: 15, SIXTEEN: 16, SEVENTEEN: 17, EIGHTEEN: 18, NINETEEN: 19, TWENTY: 20, THIRTY: 30, FORTY: 40, FIFTY: 50, SIXTY: 60, SEVENTY: 70, EIGHTY: 80, NINETY: 90 };
  function words(s) { let total = 0, cur = 0, any = false;
    for (const w of up(s).replace(/[^A-Z ]/g, " ").split(/\s+/).filter(Boolean)) {
      if (w in W) { cur += W[w]; any = true; } else if (w === "HUNDRED") cur *= 100; else if (w === "THOUSAND") { total += cur * 1000; cur = 0; } else if (w === "MILLION") { total += cur * 1e6; cur = 0; }
      else if (w === "AND") continue; else break; }
    return any ? total + cur : NaN; }

  /* ---- bearings and coordinates ---- */
  function bearing(x) {
    const t = up(x).replace(/DEG\.?/g, "°");
    const m = t.match(/([NS])\W*(\d{1,2})(?:\D+?(\d{1,2}(?:\.\d+)?))?(?:\D+?(\d{1,2}(?:\.\d+)?))?[^0-9EW]*([EW])/);
    return m ? { ns: m[1], ew: m[5], min: +m[2] * 60 + +(m[3] || 0) + +(m[4] || 0) / 60 } : null;
  }
  const fmtB = b => { if (!b) return "?"; const t = Math.round(b.min * 60), d = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    return `${b.ns} ${String(d).padStart(2, "0")}°${String(m).padStart(2, "0")}'${s ? String(s).padStart(2, "0") + '"' : ""} ${b.ew}`; };
  function degs(x) { const m = String(val(x) ?? "").match(/(\d{1,3})(?:\D+(\d{1,2}))?(?:\D+(\d{1,2}(?:\.\d+)?))?/); return m ? +m[1] + (+(m[2] || 0)) / 60 + (+(m[3] || 0)) / 3600 : NaN; }
  const pt = c => c && !isNaN(num(c.n)) && !isNaN(num(c.e)) ? { n: num(c.n), e: num(c.e) } : null;
  function course(p, q) { const dn = q.n - p.n, de = q.e - p.e;
    return { ns: dn >= 0 ? "N" : "S", ew: de >= 0 ? "E" : "W", min: Math.atan2(Math.abs(de), Math.abs(dn)) * 180 / Math.PI * 60, dist: Math.hypot(dn, de) }; }
  const bDiff = (a, b) => (a.ns === b.ns && a.ew === b.ew) || (a.min + b.min) < 0.5 ? Math.abs(a.min - b.min) : Infinity;
  // A line's corner labels; when a line has no from/to, it runs from corner i to the next.
  const ends = (l, cs, i) => [String(l.from ?? (cs[i] || {}).label ?? i + 1), String(l.to ?? (cs[(i + 1) % cs.length] || {}).label ?? i + 2)];
  const tieTo = (tie, cs) => String(tie.to ?? (cs[0] || {}).label ?? 1);
  function area(ps) { let s = 0; for (let i = 0; i < ps.length; i++) { const p = ps[i], q = ps[(i + 1) % ps.length]; s += p.e * q.n - q.e * p.n; } return s / 2; } // > 0: counter-clockwise

  /* ---- loading ---- */
  // Accepts one document {format:"sr-desk-doc/1", doc_type, seq, fields} or a bundle {format:"sr-desk-bundle/1", seq, documents:[...]}.
  function parse(text, file) {
    let j; try { j = JSON.parse(text); } catch (e) { throw new Error(`${file}: not valid JSON (${e.message})`); }
    const list = Array.isArray(j) ? j : Array.isArray(j.documents) ? j.documents.map(d => Object.assign({ seq: j.seq }, d)) : [j];
    if (!list.length) throw new Error(`${file}: no documents in the file`);
    return list.map((d, i) => {
      if (!isObj(d) || !TYPES[d.doc_type]) throw new Error(`${file}${list.length > 1 ? ` (document ${i + 1})` : ""}: doc_type must be one of ${Object.keys(TYPES).join(", ")}`);
      if (!isObj(d.fields)) throw new Error(`${file}: ${d.doc_type} has no "fields" object`);
      return { doc_type: d.doc_type, seq: d.seq ? String(d.seq) : "", pages: d.pages || "", file, note: d.note || "", fields: d.fields };
    });
  }
  const label = d => TYPES[d.doc_type] + (d.fields && d.fields.lot && (d.doc_type === "ldc") ? " " + show(d.fields.lot) : "");

  /* ---- the checks ---- */
  const REQ = {
    title: [["title_no", T.titleConform], ["lot", T.titleConform], ["cadastre", T.titleConform], ["area_sqm", T.titleConform], ["owners", T.titleConform], ["barangay", T.titleConform], ["municipality", T.titleConform], ["pages_total", T.titleAnnot]],
    plan: [["survey_type", T.planCorner], ["lot", T.planCorner], ["cadastre", T.planCorner], ["title_no", T.planCorner], ["in_favor_of", T.planCorner], ["area_sqm", T.planCorner], ["scale", T.planCorner],
      ["bearings", T.planCorner], ["date_surveyed", T.planCorner], ["ge_name", T.planCorner], ["ge_reg_no", T.planCorner], ["lots", T.planConform]],
    ldc: [["lot", T.ldcConform], ["owner", T.ldcConform], ["reference", T.refLdc], ["corners", T.refLdc], ["lines", T.refLdc], ["area_sqm", T.ldcConform]],
    boundary: [["lot", T.refLdc], ["reference", T.refLdc], ["corners", T.refLdc], ["lines", T.refLdc], ["area_sqm", T.refLdc]],
    fnc: [["survey_class", T.fncComplete], ["owner", T.fncComplete], ["lot", T.fncComplete], ["cadastre", T.fncComplete], ["barangay", T.fncComplete], ["municipality", T.fncComplete], ["province", T.fncComplete],
      ["bearings", T.fncComplete], ["ge_name", T.fncComplete], ["ge_reg_no", T.fncComplete], ["title_no", T.fncComplete], ["date_from", T.fncComplete], ["date_to", T.fncComplete],
      ["instrument", T.fncComplete], ["instrument_serial", T.fncComplete], ["transitman", T.fncComplete],
      ["notary.date", T.fncComplete], ["notary.doc_no", T.fncComplete], ["notary.page_no", T.fncComplete], ["notary.book_no", T.fncComplete], ["notary.series", T.fncComplete], ["notary.res_cert_no", T.fncComplete]],
    joint: [["landowner", T.jointComplete], ["barangay", T.jointComplete], ["municipality", T.jointComplete], ["lot", T.jointComplete], ["title_no", T.jointComplete], ["area_ha", T.jointComplete], ["ge_name", T.jointComplete], ["issued_date", T.jointComplete], ["issued_at", T.jointComplete]],
    award: [["arbs", T.award], ["total_ha", T.award], ["issued_date", T.award]],
    profile: [["landowner", T.profComplete], ["title_no", T.profComplete], ["lot", T.profComplete], ["project_no", T.profComplete], ["area_sqm", T.profComplete], ["seq_no", T.profComplete],
      ["survey_type", T.profComplete], ["date_of_survey", T.profComplete], ["lots", T.profComplete], ["total_sqm", T.profComplete]]
  };
  const SIG = { plan: [["signatures.ge", "Signature of the Geodetic Engineer", T.planGE], ["signatures.marpo", "Signature of the MARPO", T.planMarpo]],
    ldc: [["signed_by_ge", "Signature of the Geodetic Engineer", T.ldcSigned]], fnc: [["signed_by_ge", "Signature and seal of the Geodetic Engineer", T.fncSeal], ["documentary_stamp", "Documentary stamp", T.fncStamp]],
    profile: [["signatures.surveyed", "Signature, Surveyed by", T.profSig], ["signatures.validated", "Signature, Validated by", T.profSig], ["signatures.concurred", "Signature, Concurred by (MARPO)", T.profSig], ["signatures.noted", "Signature, Noted by (PARPO)", T.profSig]],
    joint: [["signatures.marpo", "Signature of the MARPO", T.jointSig], ["signatures.ge", "Signature of the Geodetic Engineer", T.jointSig], ["signatures.parpo", "Signature of the PARPO", T.jointSig]], award: [["signed", "Signature of the PARPO", T.award]] };
  // Blank here is shown as a warning only (often left blank in practice; the checklist has no item for it).
  const SOFT = { ldc: ["cadastre", "ge_name", "date_surveyed", "prepared_by", "checked_by"], boundary: ["cadastre", "ge_name", "date_surveyed", "prepared_by", "checked_by"], fnc: ["island", "declination"], plan: ["corner_count"] };

  function run(docs, ctx = {}) {
    const R = [], add = (level, doc, msg, to) => R.push({ level, doc, msg, to: (to || []).filter(Boolean) });
    const of = t => docs.filter(d => d.doc_type === t);
    const title = of("title")[0], plan = of("plan")[0], bnd = of("boundary")[0], fnc = of("fnc")[0], joint = of("joint")[0], award = of("award")[0], prof = of("profile")[0], ldcs = of("ldc");
    const F = d => d ? d.fields : {};
    ["title", "plan", "boundary", "fnc", "joint", "award", "profile"].forEach(t => { if (of(t).length > 1) add("warn", TYPES[t], `${of(t).length} ${TYPES[t]} files loaded; only the first (${of(t)[0].file}) is used`); });
    const seqs = [...new Set(docs.map(d => d.seq).filter(Boolean))];
    if (seqs.length > 1) add("fail", "Files", `The files name different SeqNos: ${seqs.join(", ")}`);

    // 1. Blank fields, unreadable fields, signatures.
    docs.forEach(d => {
      const name = label(d);
      (REQ[d.doc_type] || []).forEach(([f, to]) => { if (!has(d.fields, f)) return; const v = get(d.fields, f);
        if (unr(v)) add("warn", name, `${lbl(f)}: marked unreadable on the scan (read as "${show(v)}"); check the paper`);
        else if (isBlank(v)) add("fail", name, `${lbl(f)} is blank`, [to]); });
      (SIG[d.doc_type] || []).forEach(([f, who, to]) => { if (!has(d.fields, f)) return; const v = get(d.fields, f);
        if (unr(v)) add("warn", name, `${who}: not clear on the scan; check the paper`);
        else if (val(v) === true) add("pass", name, `${who}: present`, [to]);
        else add("fail", name, `${who}: missing`, [to]); });
      (SOFT[d.doc_type] || []).forEach(f => { if (has(d.fields, f) && !unr(d.fields[f]) && isBlank(d.fields[f])) add("warn", name, `${lbl(f)} is blank`); });
    });

    // 2. Every document against the title.
    if (!title) add("warn", "Title", "No title JSON loaded: nothing is compared against the title");
    else {
      const t = title.fields, tOwners = (Array.isArray(val(t.owners)) ? val(t.owners) : []).map(o => nName(isObj(o) && o.name ? o.name : o)).filter(Boolean);
      const lead = tOwners[0] || "";
      const pages = val(t.pages_present), total = num(t.pages_total);

        if (miss.length) add("fail", "Title", `Page${miss.length > 1 ? "s" : ""} ${miss.join(", ")} of ${total} not in the set; annotations there cannot be checked`, [T.titleAnnot]);
        else add("pass", "Title", `All ${total} pages present`, [T.titleAnnot]); }
      if (has(t, "area_words") && !isNaN(num(t.area_sqm))) { const w = words(t.area_words);
        if (isNaN(w)) add("warn", "Title", `Area in words not understood: "${show(t.area_words)}"`);
        else add(w === num(t.area_sqm) ? "pass" : "fail", "Title", w === num(t.area_sqm) ? `Area in words agrees with figures (${num(t.area_sqm)} m²)` : `Area in words (${w}) differs from figures (${num(t.area_sqm)})`, [T.titleConform]); }
      if (has(t, "barangay_td") && !isBlank(t.barangay_td) && nPlace(t.barangay_td) !== nPlace(t.barangay))
        add("warn", "Title", `Barangay spelled "${show(t.barangay)}" on page 1 and "${show(t.barangay_td)}" in the technical description`);

      const cmp = (d, field, tField, kind, to) => {
        if (!d || !has(d.fields, field) || !has(t, tField)) return;
        const a = d.fields[field], b = t[tField], name = label(d);
        if (unr(a) || unr(b) || isBlank(a) || isBlank(b)) return; // reported above
        const what = field.replace(/_/g, " ");
        if (kind === "place") { const x = nPlace(a), y = nPlace(b);
          if (x === y) add("pass", name, `${what} agrees with title (${show(b)})`, to);
          else if (lev(x, y) <= 2) add("warn", name, `${what} "${show(a)}" is spelled differently from the title's "${show(b)}"`);
          else add("fail", name, `${what} "${show(a)}" differs from title "${show(b)}"`, to); return; }
        const n = { title: nTitle, code: nCode, name: nName }[kind];
        if (kind === "sqm" || kind === "ha") { const x = kind === "ha" ? num(a) * 10000 : num(a), y = num(b);
          if (Math.abs(x - y) < 0.5) add("pass", name, `${what} ${show(a)} agrees with title (${y} m²)`, to); else add("fail", name, `${what} ${show(a)}${kind === "ha" ? " ha" : " m²"} differs from title (${y} m²)`, to); return; }
        if (n(a) === n(b)) add("pass", name, `${what} agrees with title (${show(b)})`, to);
        else add("fail", name, `${what} "${show(a)}" differs from title "${show(b)}"`, to);
      };
      const leadCheck = (d, field, to) => { if (!d || !has(d.fields, field) || isBlank(d.fields[field]) || unr(d.fields[field]) || !lead) return;
        const a = d.fields[field], name = label(d);
        if (nName(a) !== lead) add("fail", name, `${field.replace(/_/g, " ")} "${show(a)}" is not the title's lead name "${lead}"`, to);
        else if (tOwners.length > 1 && !etAl(a)) add("warn", name, `${field.replace(/_/g, " ")} "${show(a)}": title has co-owners, "ET AL." expected`);
        else add("pass", name, `Lead name agrees with title (${lead}${tOwners.length > 1 ? ", ET AL." : ""})`, to); };
      const all = [[plan, [T.planConform, T.titleConform]], [bnd, [T.refLdc]], [fnc, [T.fncComplete]], [joint, [T.jointComplete]], [prof, [T.profConform]]].concat(ldcs.map(l => [l, [T.ldcConform]]));
      all.forEach(([d, to]) => { if (!d) return;
        cmp(d, "title_no", "title_no", "title", to); cmp(d, "cadastre", "cadastre", "code", to); cmp(d, "project_no", "cadastre", "code", to);
        cmp(d, "barangay", "barangay", "place", to); cmp(d, "municipality", "municipality", "place", to); cmp(d, "province", "province", "place", to);
        if (d.doc_type !== "ldc") cmp(d, "lot", "lot", "code", to);
        if (d.doc_type !== "ldc") cmp(d, "area_sqm", "area_sqm", "sqm", to);
        if (d.doc_type === "profile") cmp(d, "total_sqm", "area_sqm", "sqm", [T.profSum]);
        if (d.doc_type === "joint") cmp(d, "area_ha", "area_sqm", "ha", to);
        ["owner", "landowner", "claimant"].forEach(f => leadCheck(d, f, to)); });
      if (award) cmp(award, "total_ha", "area_sqm", "ha", [T.award]);
      // Names: title owners = plan "in favor of" = profile claimants = award ARBs.
      const set = list => [...new Set(list.map(nName).filter(Boolean))].sort();
      const same = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
      const tSet = set(tOwners);
      const nameSet = (d, list, to) => { if (!d || !Array.isArray(list) || !list.length || !tSet.length) return; const s = set(list);
        if (same(s, tSet)) add("pass", label(d), `Names agree with title (${tSet.join(", ")})`, to);
        else add("fail", label(d), `Names [${s.join(", ")}] differ from title [${tSet.join(", ")}]`, to); };
      nameSet(plan, val(F(plan).in_favor_of), [T.planClaim]);
      nameSet(prof, (val(F(prof).lots) || []).map(l => l.claimant), [T.profConform]);
      nameSet(award, (val(F(award).arbs) || []).map(a => a.name), [T.award]);
    }

    // 3. Geometry: each computation on its own, then against each other, the title and the plan.
    const lots = {}; // normalized lot -> {doc, P: {label: point}, list: [points]}
    const geo = [bnd, ...ldcs].filter(Boolean);
    geo.forEach(d => { const f = d.fields, name = label(d), cs = Array.isArray(val(f.corners)) ? val(f.corners) : [];
      const P = {}, list = [];
      cs.forEach((c, i) => { const p = pt(c); if (!p) { add("fail", name, `Corner ${c && c.label || i + 1}: coordinates not readable`, [T.refLdc, T.ldcNE]); return; } P[String(c.label ?? i + 1)] = p; list.push(p); });
      const key = d === bnd ? "BDRY" : nCode(f.lot); lots[key] = { d, P, list };
      if (list.length < 3) return;
      // Lines: written course against the one computed from the coordinates.
      const lines = Array.isArray(val(f.lines)) ? val(f.lines) : []; let ok = 0;
      lines.forEach((l, i) => { const [from, to] = ends(l, cs, i), p = P[from], q = P[to], id = `${from}-${to}`;
        if (!p || !q) { add("fail", name, `Line ${id}: corner not in the corner list`, [T.refLdc, T.ldcBD]); return; }
        const c = course(p, q), b = bearing(l.bearing), dist = num(l.distance);
        if (unr(l.bearing) || unr(l.distance)) { add("warn", name, `Line ${id}: unclear on the scan; coordinates give ${fmtB(c)} ${r2(c.dist)} m`); return; }
        const errs = [];
        if (!b) errs.push(`bearing "${show(l.bearing)}" not understood`); else if (bDiff(b, c) > TOL.min) errs.push(`bearing ${fmtB(b)}, coordinates give ${fmtB(c)}`);
        if (isNaN(dist)) errs.push("distance not readable"); else if (Math.abs(dist - c.dist) > TOL.dist) errs.push(`distance ${dist} m, coordinates give ${r2(c.dist)} m`);
        if (errs.length) add("fail", name, `Line ${id}: ${errs.join("; ")}`, [T.refLdc, T.ldcBD]); else ok++; });
      if (lines.length && ok === lines.length) add("pass", name, `All ${ok} lines agree with the coordinates`, [T.refLdc, T.ldcBD, T.ldcNE]);
      if (lines.length && lines.length !== list.length) add("fail", name, `${lines.length} lines for ${list.length} corners`, [T.refLdc, T.ldcBD]);

      <div class="field"><label for="f-survey">Survey status</label><select id="f-survey"><option value="All" ${ui.survey === "All" ? "selected" : ""}>All survey statuses</option>${[...SURVEYS, NOT_SET].map(k => `<option value="${esc(k)}" ${ui.survey === k ? "selected" : ""}>${esc(k)} (${surveyCount(k)})</option>`).join("")}</select></div>
      <div class="field"><label for="f-vstat">Verification</label><select id="f-vstat"><option value="All" ${ui.vstat === "All" ? "selected" : ""}>All verification statuses</option>${[...SUBS, NO_VSTAT].map(k => `<option value="${esc(k)}" ${ui.vstat === k ? "selected" : ""}>${esc(STATUS_LABEL[k] || k)} (${vstatCount(k)})</option>`).join("")}</select></div>
      <div class="field"><label for="f-route">For approval by</label><select id="f-route">${["All", ...ROUTES, "Unassigned"].map(o => `<option ${ui.route === o ? "selected" : ""}>${o}</option>`).join("")}</select></div>

    </div>
    <div id="reg-results">
    <div class="panel table-scroll">
      ${rows.length ? `<table>
        <thead><tr><th>SeqNo</th><th>Kind</th><th>LO / Claimant</th><th>DARMO</th><th>For</th><th class="r">Area (has.)</th><th>Received</th><th>Verifier</th><th>Checklist</th><th>Status</th></tr></thead>
        <tbody>${shown.map(r => { const t = tally(r), d = age(r);
          return `<tr data-seq="${esc(r.seq)}" tabindex="0" aria-label="Open SR ${esc(r.seq)}">
            <td class="mono">${esc(r.seq)}<div class="sub">${esc(r.title)}</div>${commitQ(r) !== undefined ? `<span class="pill commit">${esc(commitLabel(commitQ(r)))}</span>` : ""}</td>
            <td>${r.kind === "No batch tracker" ? `<span class="sub">${esc(r.accTag || "—")}</span>` : esc(r.kind)}${r.flags ? ' <span class="badge-conflict" title="' + esc(r.flags.join("\n")) + '">Check</span>' : ""}<div class="sub">${esc(r.team || "")}</div></td>
            <td class="who">${esc(r.claimant)}<div class="sub">Lot ${esc(r.lot)}</div></td>
            <td>${esc(r.darmo)}<div class="sub">${esc(r.brgy)}</div></td>
            <td>${r.route ? `<span class="route">${r.route}</span>` : '<span class="sub">Unassigned</span>'}</td>
            <td class="r mono">${typeof r.area === "number" ? r.area.toFixed(4) : esc(r.area)}</td>
            <td class="num">${fmtDate(r.received) || '<span class="sub">—</span>'}${d === null ? "" : `<div class="sub ${isOpen(r) && d > 14 ? "age-old" : ""}">${d} day${d === 1 ? "" : "s"}</div>`}</td>
            <td>${r.verifier ? esc(r.verifier) : '<span class="sub">Unassigned</span>'}</td>
            <td>${!t.total ? '<span class="sub">—</span>' : `<div class="prog"><div class="bar"><i class="p" style="width:${t.pass / t.total * 100}%"></i><i class="n" style="width:${t.na / t.total * 100}%"></i><i class="f" style="width:${t.fail / t.total * 100}%"></i></div>
              <span class="sub num">${t.done}/${t.total}${t.fail ? ` · <b style="color:var(--fail)">${t.fail} finding${t.fail > 1 ? "s" : ""}</b>` : ""}</span></div>`}</td>
            <td><div class="st-line"><span class="pill st-survey ${r.survey ? "" : "st-unset"}" title="${esc(r.survey ? r.survey : "Not set. Tracker: " + (r.surveyStatus || "blank"))}">${esc(surveyShort(r.survey))}</span>${r.status ? `<span class="pill ${STATUS_CLASS[r.status]}">${STATUS_LABEL[r.status]}</span>` : ""}</div>
              ${r.round > 1 || Object.keys(r.overrides || {}).length ? `<div class="sub">${[r.round > 1 ? "Round " + r.round : "", Object.keys(r.overrides || {}).length ? "Fields edited" : ""].filter(Boolean).join(" · ")}</div>` : ""}${r.conflict ? '<div><span class="badge-conflict" style="margin-left:0">Needs attention</span></div>' : r.pending ? '<div><span class="badge-pending" style="margin-left:0">Not synced</span></div>' : ""}</td></tr>`; }).join("")}</tbody></table>`
      : `<div class="empty">No SRs match these filters. Clear the search or pick another status.</div>`}
    </div>
    ${rows.length > shown.length ? `<div class="no-print" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn" id="more">Show ${Math.min(PAGE, rows.length - shown.length)} more</button><span class="sub num">${shown.length} of ${rows.length} shown. Search or filter to narrow the list.</span></div>` : ""}
    <div class="foot-note"><span>Register read from the sheets ${fmtTime(state.registerBuilt || state.pulledAt)}, re-read every 15 minutes. Days are counted from the date received; red when an SR at DARPO is past 14 days. Where the columns come from: Guide › The register.</span></div>
    </div>`;
  // While typing in Search, keep the filter row (and the box being typed in) and swap only the counts and the list.

    const t = document.createElement("template"); t.innerHTML = html;
    view.querySelector(".list-head").replaceWith(t.content.querySelector(".list-head"));
    view.querySelector("#reg-results").replaceWith(t.content.querySelector("#reg-results"));
  } else view.innerHTML = html;
  const fc = view.querySelector("#f-clear");
  if (fc) fc.onclick = () => { ui.q = ""; ui.kind = ui.survey = ui.vstat = ui.route = ui.verifier = "All"; ui.limit = PAGE; renderRegister(); };

  const setF = fn => e => { fn(e.target.value); ui.limit = PAGE; renderRegister(); };
  view.querySelector("#f-kind").onchange = setF(v => ui.kind = v);
  view.querySelector("#f-survey").onchange = setF(v => ui.survey = v);
  view.querySelector("#f-vstat").onchange = setF(v => ui.vstat = v);
  view.querySelectorAll(".chip").forEach(c => c.onclick = () => { ui.status = c.dataset.status; ui.limit = PAGE; renderRegister(); });
  const qi = view.querySelector("#f-q");
  qi.oninput = () => { ui.q = qi.value; ui.limit = PAGE; renderRegister({ keepFilters: true }); };
  view.querySelector("#f-route").onchange = setF(v => ui.route = v);
  view.querySelector("#f-ver").onchange = setF(v => ui.verifier = v);
  view.querySelectorAll("tbody tr").forEach(tr => { tr.onclick = () => openSR(tr.dataset.seq); tr.onkeydown = e => { if (e.key === "Enter") openSR(tr.dataset.seq); }; });
}

/* ---------- Guide: how to verify an SR, written from the checklist. The document section is built from CL and HOW, so it cannot drift from the panel. ---------- */
const GLOSSARY = [["SR", "Survey returns: the plan and its supporting papers submitted after the survey."], ["CCLOA", "Collective Certificate of Land Ownership Award."],
  ["SPLIT", "Support to Parcelization of Lands for Individual Titling."], ["ARB", "Agrarian reform beneficiary."], ["GE", "Geodetic engineer."],
  ["DARMO", "DAR Municipal Office."], ["DARPO", "DAR Provincial Office. The SR is verified here."], ["MARPO / PARPO", "Municipal / Provincial Agrarian Reform Program Officer."],
  ["PPMO / RPMO / CPMO", "Provincial / Regional / Central Project Management Office."], ["LRA", "Land Registration Authority."], ["PHILARIS", "LRA's land registration system; the title print comes from it."],
  ["LMS", "Land Management Services of DENR.", true], ["IVAS", "Inspection, verification and approval of surveys, done by DENR."], ["ASP", "Approved survey plan.", true],
  ["LDC", "Lot data computation."], ["LDS", "Lot data sheet.", true], ["FNC", "Field notes cover."], ["DLSD", "Digital land survey data: the survey's digital file."],
  ["CA / VOS / OLT", "Compulsory Acquisition / Voluntary Offer to Sell / Operation Land Transfer."], ["Mother lot", "The titled lot being subdivided."], ["Resulting lot", "A lot created by the subdivision."]];
function renderGuide() {

  let n = 0;
  const docs = c.docGroups.map((g, gi) => `<h3>${esc(g.label)}${g.asNeeded ? " (mark N/A when not needed)" : ""}</h3>` + g.items.map((t, i) => { n++;
    const di = DOC_GUIDE[ui.guideRoute][`${gi}.${i}`], d = di === undefined ? null : c.guide[di];
    return `<div class="gdoc"><h4>${n}. ${esc(t)}</h4>${how(t, "doc")}${d ? `<ol>${checkOrder(ui.guideRoute, di).map(j => d.checks[j]).map(x => `<li>${esc(x)}${typeTag(checkType(ui.guideRoute, di, x))}${how(x, "check", d.doc)}</li>`).join("")}</ol>` : `<span class="how">No validation checks on the checklist: mark it Present, Missing or N/A.</span>`}</div>`; }).join("")).join("");
  const secs = [["start", "Start here"], ["path", "The path of an SR"], ["steps", "Verifying, step by step"], ["marks", "Marks and notes"], ["docs", "Documents and checks"], ["ref", "Reference notes"], ["register", "The register"], ["saving", "Saving and sync"], ["words", "Words used"]];
  view.innerHTML = `<div class="guide">
    <nav class="guide-nav no-print" aria-label="Guide sections">${secs.map(([id, l]) => `<a href="#g-${id}">${l}</a>`).join("")}</nav>
    <div class="guide-main">
      <section class="panel" id="g-start"><h2>Start here</h2>
        <p class="lead">What a verifier does with one survey return, from the envelope to the endorsement.</p>
        <ol class="nsteps">
          <li><b>Open the SR</b><span>Find it in the Register by SeqNo, title number or claimant.</span></li>
          <li><b>Record that it is at DARPO</b><span>Set the survey status and the date it was received. Put your name on it and choose DENR or LRA.</span></li>
          <li><b>Check it, document by document</b><span>Mark each document, then answer the checks under it. Write a note for every finding.</span></li>
          <li><b>Decide</b><span>With findings, return it to the DARMO for compliance. With none, endorse it.</span></li>
        </ol>
        <p style="margin-top:14px" class="no-print"><button class="btn primary" id="g-practice">Open the practice SR</button> <span class="sub">A made-up SR. Nothing you do in it is saved to the Sheet or the trackers.</span></p>
        <p class="sub">The SR panel shows a <b>Next step</b> line at the top. When unsure, do what it says. Tick "Show how-to notes" in the checklist to read how each item is checked.</p>
      </section>
      <section class="panel" id="g-path"><h2>The path of an SR</h2>
        <p class="lead">The survey status says where the SR is. Each status has one date: the day it happened, not the day you typed it.</p>
        <div class="table-scroll"><table class="gtable"><thead><tr><th class="r">No.</th><th>Survey status</th><th>Date to enter</th></tr></thead>
          <tbody>${SURVEYS.map((sv, i) => `<tr><td class="r num">${i + 1}</td><td>${sv === AT_DARPO ? `<b>${esc(sv)}</b><span class="how">The status where the checklist is used.</span>` : sv === AT_RPMO ? `<b>${esc(sv)}</b><span class="how">Attachments can be marked here too; document checks cannot.</span>` : esc(sv)}</td><td>${esc(DATE_LABEL[sv])}</td></tr>`).join("")}</tbody></table></div>
        <h3>While the SR is at DARPO</h3>

          <tr><td><span class="pill st-received">Pending</span></td><td>Received, checking not yet started.</td></tr>
          <tr><td><span class="pill st-inprog">Ongoing Verification</span></td><td>Set by the app when the first item is marked.</td></tr>
          <tr><td><span class="pill st-returned">Compliance</span></td><td>Returned to the DARMO with findings. The checklist is locked until the corrected SR comes back.</td></tr></tbody></table></div>
        <p class="sub">A change of survey status is also written to the SR's batch tracker. MASBATE CCLOA ACCOUNTING is never written.</p>
      </section>
      <section class="panel" id="g-steps"><h2>Verifying, step by step</h2>
        <p class="lead">The SR panel has one tab for each part of the work.</p>
        <h3>1. Details</h3>
        <ul class="tips"><li>Set <b>Survey status</b> to SR AT DARPO and enter the <b>date received at DARPO</b>. The day count starts from that date.</li>
          <li>Your name goes in <b>Verifier</b> by itself when you change anything on the SR: it shows whoever edited last. An SR has one verifier; others can read it but only you or the Admin can change it.</li>
          <li>Choose <b>For approval by</b>: DENR or LRA. This decides which checklist opens. <span class="tbc">To confirm</span> how to tell which office approves an SR is not written here yet.</li>
          <li>Compare the SR details on screen with the envelope. If the title number, lot or claimant is wrong, tell the Admin; only the Admin can correct those fields.</li></ul>
        <h3>2. Cross-check (optional)</h3>
        <ul class="tips"><li>If the documents were typed into JSON files, load them. The app compares every document with the title and re-works the computations.</li>
          <li>"Fill the checklist" answers only the items it is sure of. Items shown as "Check by hand" are left for you.</li></ul>
        <h3>3. Attachments</h3>
        <ul class="tips"><li>Go through the envelope and mark every document Present, Missing or N/A. Do not read inside yet.</li>
          <li>A document marked Missing or N/A has its checks skipped in the next tab.</li></ul>
        <h3>4. Document checks</h3>
        <ul class="tips"><li>Start with the plan and the title, and keep both open: most checks compare another paper with them.</li>
          <li>Go down the documents in order and answer the checks inside each one.</li>
          <li><b>Guided, one at a time</b> (the default) shows one check over a drawing of the document: the spot glows, a round close-up shows it larger, and the how-to note is written under the check. Pass or N/A moves on by itself; Fail waits for your note. Keys: P, F, N, and the arrows. "Read aloud" speaks each check. <b>Full list</b> shows every check at once, as before; both use the same answers.</li>
          <li>To learn without touching real SRs, open the <b>practice SR</b> and walk through it in Guided mode (the button "Open the practice SR" above).</li>
          <li>Look at the paper for every item. "Pass the unchecked items" is for the items you have already looked at.</li></ul>
        <h3>5. Notice and decision</h3>
        <ul class="tips"><li>Read the notice of findings as the DARMO will read it. Each line must say what to correct.</li>
          <li><b>Return for compliance</b>: copy the notice and send it to the DARMO. The SR waits at "Compliance".</li>
          <li><b>Endorse</b>: the SR moves to SR RECEIVED BY RPMO. Enter that date when RPMO receives the transmittal.</li></ul>
        <h3>When the corrected SR comes back</h3>
        <ul class="tips"><li>Press <b>Compliance submitted by DARMO</b>. The failed and missing items are cleared and the round number goes up.</li>
          <li>Re-check the cleared items against the new papers, then decide again.</li></ul>
        <h3>In the office</h3>
        <ul class="tips"><li>Check the Profile, the Joint Certification and the Award Limit certification early. If they are not in the SR envelope, look in the expanded envelope.</li>
          <li>For missing attachments, coordinate directly with the DARMO's verifier.</li>
          <li>Every document sent for notarization or for signature should carry the sender's name, so it can be traced.</li></ul>
        <p class="sub">From the unit's "Verification process for SRs" workflow chart.</p>
      </section>
      <section class="panel" id="g-marks"><h2>Marks and notes</h2>
        <div class="table-scroll"><table class="gtable"><thead><tr><th>Mark</th><th>Use it when</th></tr></thead><tbody>
          <tr><td><b>Present</b></td><td>The document is in the envelope. Its checks open.</td></tr>
          <tr><td><b>Missing</b></td><td>The document is required and is not there. This is a finding and needs a note. Its checks are skipped.</td></tr>
          <tr><td><b>Pass</b></td><td>You looked at the paper and the item is right.</td></tr>
          <tr><td><b>Fail</b></td><td>The item is wrong, blank or cannot be read. This is a finding and needs a note.</td></tr>

        <h3>Writing the note</h3>
        <p>The note goes into the notice of findings word for word. Say what is wrong, where, and with the figures.</p>
        <div class="pair"><div class="good"><div class="k">Clear</div><p>Area of Lot 2 is 1.2500 ha on the plan and 1.2050 ha on the profile.</p><p>Field notes cover: the instrument serial number is blank.</p></div>
          <div class="weak"><div class="k">Not enough</div><p>Area wrong.</p><p>Incomplete entries.</p></div></div>
        <p class="sub">The examples are made up.</p>
      </section>
      <section class="panel" id="g-docs"><h2>Documents and checks</h2>
        <p class="lead">Every document on the checklist, what it is, and how each of its checks is done.</p>
        <div class="seg no-print" role="group" aria-label="Checklist">${ROUTES.map(r => `<button type="button" data-groute="${r}" data-v="na" aria-pressed="${ui.guideRoute === r}">For ${r} approval</button>`).join("")}</div>
        <p class="sub" style="margin-top:8px">${esc(c.name)}</p>

      </section>
      <section class="panel" id="g-ref"><h2>Reference notes</h2>
        <p class="lead">From the checklist. The same notes open inside the SR panel.</p>

          ${CL.DENR.claimant.map(([x, y], i) => `<tr><td>${esc(x)}</td><td>${esc(y)}</td><td>${esc(CL.LRA.claimant[i][1])}</td></tr>`).join("")}

      <section class="panel" id="g-register"><h2>The register</h2>
        <ul class="tips"><li>The list of SRs is every SeqNo in MASBATE CCLOA ACCOUNTING, tab MASBATE.</li>

          <li>The first sync each day saves an Excel backup to this PC's Downloads folder.</li>
          <li>If the PC or the app is down, print the blank checklists from the Checklists tab, check on paper, and enter the result later.</li></ol>

      <section class="panel" id="g-words"><h2>Words used</h2>

      <p class="sub">The how-to notes were drafted on 2026-11-12 from Checklist-of-SRs-07-28-2026.xlsx and its reference notes. The LRA checks after each document's original ones, and their notes, come from Document_Verification_Checklist.xlsx (added 2026-11-12). Its "Manual" items are checked by hand; its "Auto" items are meant to come from the document JSON, but the cross-check does not read the newly added ones yet, so check those by hand for now. They are a training aid, not an official issuance. Wording marked "To confirm" has not been checked by the unit. <button class="btn link no-print" id="g-print">Print this guide</button></p>
    </div></div>`;
  view.querySelectorAll("[data-groute]").forEach(b => b.onclick = () => { ui.guideRoute = b.dataset.groute; const y = scrollY; renderGuide(); scrollTo(0, y); });

  srs.forEach(s => { const k = sdKeyOf(sdStatusOf(s)), ha = sdHa(s.area) || 0, c = commitQ(s) !== undefined; r[k]++; r[k + SD_HA] += ha; r.totalHa += ha; if (c) { r[k + SD_CM]++; r.cm++; } });
  $i("sd-kc-").innerHTML = `<b>${srs.length.toLocaleString()}</b> SRs · <b>${sdFmtHa(r.totalHa)}</b> ha${sd.commit === "all" ? ` · <b>${r.cm.toLocaleString()}</b> commitment` : ""}`;

  const subRank = k => DARPO_SUBS.includes(k) ? DARPO_SUBS.indexOf(k) : 3;

  else if (!show.length) el.innerHTML = `<p class="sub" style="padding:40px 0;text-align:center">Every status is hidden. Click one in the key to show it.</p>`;
  else sdPie(el, r, { label: `${kind}: ${AREA ? "share of area at each survey status, hectares" : "share of SRs at each survey status"}`, spin: sd.first, series: show,
    subNote: "DARPO status of the SRs at DARPO", subs: sdKeyOf(AT_DARPO) === AT_DARPO ? { [AREA ? AT_DARPO + SD_HA : AT_DARPO]: parts } : null,
    num: AREA ? sdFmtHa : v => v.toLocaleString(), unit: AREA ? "hectares" : "SRs", cw: kind, tipTitle: kind, pick: pick && pick.st, pickSub: pick && pick.sub,
    both: { n: s => r[s.status] || 0, ha: s => r[s.status + SD_HA] || 0 },
    onPick: (st, sub) => { const cur = sd.pick[kind]; sd.pick[kind] = cur && cur.st === st && (cur.sub || null) === (sub || null) ? null : { st, sub: sub || null };
      delete sd.att[kind]; sdSave("-dash-pick", sd.pick); sd.anim = sd.pick[kind] ? kind : null; sdRedraw(); sd.anim = null;
      const a = document.getElementById("sd-att-" + i); if (a && sd.pick[kind]) a.scrollIntoView({ block: "nearest", behavior: "smooth" }); },
    extra: z => `<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>All ${esc(kind)} SRs</span><b>${z.total} · ${sdFmtHa(z.totalHa)} ha</b></div>` });
  $i("sd-kh-").textContent = pick || !srs.length ? "" : "Click a status to see the survey matrix of its SRs.";

/* Survey matrix of the SRs at the picked status (2026-11-21, user: "i want this to be survey matrix instead of attachments. get the data from
   the google sheet database"). The value is the tracker's SURVEY MATRIX cell (2025-A PROCUREMENT and SBA 2026), read into the register
   as surveyMatrix by sr_desk.gs. One slice per value (1.W/ ODC - W/O ALI ... 4.W/O ODC - W/ ALI), blank as "Not set"; a slice lists its SRs. */
function sdMatrix(kind, i, srs, pick, AREA) {

      <button type="button" class="btn small" id="sd-kx-${i}">Close</button></div>

    series: series.map(x => Object.assign({}, x, { key: AREA ? x.key + SD_HA : x.key })),
    num: AREA ? sdFmtHa : v => v.toLocaleString(), unit: AREA ? "hectares" : "SRs", col: "Survey matrix", center: AREA ? sdFmtHa(totHa) : set.length,
    cw: sd.commit === "in" ? "commitment" : sd.commit === "out" ? "not commitment" : "at this status", empty: "No SRs at this status.", pick: m, both: { n: x => row[x.status] || 0, ha: x => row[x.status + SD_HA] || 0 }, tipTitle: name,
    onPick: st => { sd.att[kind] = sd.att[kind] === st ? null : st; sdRedraw(); } });

let lastFocus = null;

  const dl = (DATE_LABEL[s.survey] || "Date of this status").replace(/^D/, "d"), cut = x => x.length > 48 ? x.slice(0, 46).trim() + "…" : x;
  if (s.conflict) return { step: "details", text: "Your change was refused. Read the message below, then dismiss it." };
  if (!canEdit(s)) return { step: "details", text: state.me ? `Held by ${s.verifier}. You can read this SR but not change it.` : (HOSTED ? "Connect in Settings to work on this SR." : "Sign in from the top bar of the panel to work on this SR.") };
  const tn = !isPractice(s.seq) && state.records[s.seq] && state.records[s.seq].tracker_note, tq = state.queue[s.seq];
  if (tn && tn.result === "changed" && !(tq && tq.data && typeof tq.data.trackerAck === "string"))
    return { step: "details", focus: "dw-track-ack", text: "The tracker was changed by hand. Check with whoever changed it, then write over it or leave it." };
  if (!s.survey) return { step: "details", focus: "dw-survey", text: "Set the survey status: where is this SR now?" };
  if (!statusDateOf(s)) return { step: "details", focus: "dw-sdate", text: `Enter the ${dl}.` };
  if (s.survey === AT_RPMO) { // attachments only at RPMO
    if (!c) return { step: "details", focus: "dw-route", text: `Choose who approves this SR, DENR or LRA, to mark its attachments at ${AT_RPMO}.` };
    const ds = activeKeys(s.route, a).filter(k => k.kind === "doc"), f = ds.find(k => !a[k.key]), left = ds.filter(k => !a[k.key]).length;
    return f ? { step: "attach", row: f.key, text: `Attachments at ${AT_RPMO}: ${left} of ${ds.length} left to mark. Continue with: ${cut(f.text)}.` }
      : { step: "attach", text: `All ${ds.length} attachments marked at ${AT_RPMO}. Document checks are used at ${AT_DARPO}.` };
  }
  if (!isOpen(s)) return { step: "details", text: `Nothing to verify now. The checklist is used while the survey status is ${AT_DARPO}.` };
  if (s.status === "Compliance") return { step: "details", focus: "dw-resub", text: 'Waiting for the DARMO. When the corrected SR comes back, press "Compliance submitted by DARMO".' };
  if (!c) return { step: "details", focus: "dw-route", text: "Choose who approves this SR, DENR or LRA. Its checklist opens next." };
  // Two separate passes (user, 2026-11-17): first every attachment (is the document there?), then the details inside each document.
  const keys = activeKeys(s.route, a), docs = keys.filter(k => k.kind === "doc"), chks = keys.filter(k => k.kind === "check");
  const fd = docs.find(k => !a[k.key]), dLeft = docs.filter(k => !a[k.key]).length;
  if (fd) return { step: "attach", row: fd.key, text: dLeft < docs.length ? `Attachments: ${dLeft} of ${docs.length} left to mark. Continue with: ${cut(fd.text)}.` : "Start with the attachments: mark each document Present, Missing or N/A." };
  const fc = chks.find(k => !a[k.key]), cLeft = chks.filter(k => !a[k.key]).length;
  if (fc) return { step: "checks", row: fc.key, text: cLeft < chks.length ? `Document checks: ${cLeft} of ${chks.length} left. Continue with: ${cut(fc.doc)}.` : "Attachments are marked. Now check the details inside each document." };
  const noNote = keys.filter(k => ["fail", "missing"].includes(a[k.key]) && !(nt[k.key] || "").trim());
  if (noNote.length) return { step: noNote[0].kind === "doc" ? "attach" : "checks", note: noNote[0].key, text: `Write a note for ${noNote.length} finding${noNote.length > 1 ? "s" : ""}: what is wrong, with the figure or page.` };
  if (t.fail) return { step: "notice", text: `Read the notice of findings (${t.fail}), then press Return for compliance.` };
  return { step: "notice", text: `All ${t.total} items checked, no findings. Press Endorse.` };
}
function showStep(step) {

    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("") + `</Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>` +
      sheets.map((s, i) => `<sheet name="${x(s[0])}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("") + `</sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("") + `</Relationships>`]
  ];
  sheets.forEach((s, i) => files.push([`xl/worksheets/sheet${i + 1}.xml`, sheetXml(s[1])]));
  return zip(files);
}
function downloadBackup(auto) {
  if (!state.register.length) return;
  const head = ["SeqNo", "Kind of survey", "Accounting tag", "Title No.", "LO/Claimant", "Lot No.", "DARMO", "Barangay", "Area (has.)", "For", "Survey status", "Tracker status", "DARPO status", "Verifier", "Received at DARPO", "Decided", "RPMO received transmittal", "Round", "Items checked", "Findings", "Fields edited by Admin", "Sheet version", "Saved on this PC, not synced", "Needs attention", "Checklist data (JSON)"];
  const rows = [head].concat(allSRs().map(s => { const t = tally(s), rec = state.records[s.seq];
    return [s.seq, s.kind, s.accTag, s.title, s.claimant, s.lot, s.darmo, s.brgy, s.area, s.route, s.survey || NOT_SET, s.surveyStatus, s.status, s.verifier, s.received, s.decided, s.rpmoReceived, s.round, `${t.done}/${t.total}`, t.fail,
      Object.keys(s.overrides || {}).length ? JSON.stringify(s.overrides) : "", rec ? rec.version : 0, s.pending ? "yes" : "", s.conflict ? (s.conflict.error || s.conflict.kind) : "", JSON.stringify({ ans: s.ans, notes: s.notes })]; }));
  const info = [["SR Verification Desk backup"], ["Saved", new Date().toLocaleString("en-PH")], ["PC", state.cfg.device], ["Verifier on this PC", state.me ? state.me.name : ""],
    ["Register read from Sheet", state.pulledAt], ["Last sync", state.lastSync], ["Changes waiting to sync", Object.keys(state.queue).length]];
  const blob = xlsx([["SR Desk", rows], ["About", info]]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `SR-Desk-backup-${today()}-${state.cfg.device}.xlsx`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  if (auto) { state.lastBackup = today(); save(); toast("Daily Excel backup saved to Downloads"); }
}

/* ---------- One sign-in with the Survey Unit panel (2026-11-17) ----------
   The panel's Sign in keeps {url, key, name, role} in localStorage "aw.signin" (the Survey Unit web app and the person's
   key) and this desk's own address in "aw.sr". The SR Desk web app accepts that same key, so when this page is opened
   from the same place as the panel it uses them and nobody types a second key. cfg.shared marks a key that came from
   the panel: signing out there clears it here. Since 2026-11-22 the PC page has no sign-in of its own: the panel's Sign in is the only one (a key typed earlier in Settings stays until the panel signs in or out).
   Not used by the phone version served by the web app (another site, so it cannot see the panel's sign-in). */
const okAddr = u => /^https:\/\/script\.google\.com\/(a\/macros\/[\w.-]+|macros)\/s\/[\w-]+\/(exec|dev)$/.test(String(u || "")) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(String(u || ""));
async function adoptSignin() {
  if (HOSTED) return;
  let s = null, sr = "";
  try { s = JSON.parse(localStorage.getItem("aw.signin") || "null"); sr = localStorage.getItem("aw.sr") || ""; } catch (e) { return; }
  if (!s) return;
  if (!s.key) { // signed out in the panel
    if (state.cfg.shared) { state.cfg.key = ""; state.cfg.shared = false; state.me = null; save(); }
    return;
  }
  if (!okAddr(sr) && okAddr(s.url)) { // signed in from an app's own Settings: ask the Survey Unit web app for this desk's address
    try {
      const j = await fetch(s.url + (s.url.includes("?") ? "&" : "?") + new URLSearchParams({ app: "desk", action: "me", key: s.key }), { redirect: "follow" }).then(r => r.json());
      sr = j && j.ok && j.links && okAddr(j.links.sr) ? j.links.sr : "";
      if (sr) try { localStorage.setItem("aw.sr", sr); } catch (e) {}
    } catch (e) { sr = ""; }
  }
  if (!okAddr(sr)) return; // no address for this desk (offline at first use, or an older Survey Unit web app)
  if (state.cfg.url === sr && state.cfg.key === s.key) { if (!state.cfg.shared) { state.cfg.shared = true; save(); } return; }
  if (state.cfg.key && state.cfg.key !== s.key && Object.keys(state.queue).length) { // same rule as Settings: no switch of key over unsynced work
    state.lastError = "Signed in through the panel with another key, but this PC has changes waiting under the old one. Sync them first, then reload."; return;
  }
  if (state.cfg.key !== s.key) state.me = null;
  state.cfg.url = sr; state.cfg.key = s.key; state.cfg.shared = true; save();
  return true; // newly connected from the panel's sign-in
}

/* ---------- Light / dark: follows the Survey Unit panel (2026-11-20). The panel sends "aw-theme" when the app loads and when the theme changes. ---------- */
try { const th = localStorage.getItem("aw.theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch (e) {}
window.addEventListener("message", e => { if (e.data && e.data.type === "aw-theme") { if (e.data.theme) document.documentElement.dataset.theme = e.data.theme; else delete document.documentElement.dataset.theme; } });

/* ---------- Open an SR asked for by another page (SR Flow Dashboard list rows), 2026-11-20 ----------
   That page writes {seq, t} to STORE + "-open" and switches the panel to this app; a request older than 2 minutes is ignored. */
function takeOpenRequest() {
  let q = null; try { q = JSON.parse(localStorage.getItem(STORE + "-open")); } catch (e) { q = null; }
  if (!q || !q.seq) return;
  try { localStorage.removeItem(STORE + "-open"); } catch (e) {}
  if (Date.now() - (q.t || 0) > 120000 || !regBySeq[q.seq]) return;
  ui.open = null; openSR(String(q.seq));
}
window.addEventListener("storage", e => { if (e.key === STORE + "-open" && e.newValue) takeOpenRequest(); });
/* The panel hands over a SeqNo ("aw-open-sr") and waits for this answer; with no answer it reloads this page (an older copy).
   With peek, only the drawer shows, laid over the panel's app on screen (SR Flow Dashboard); closing it tells the panel. */
window.addEventListener("message", e => {
  const d = e.data; if (!d || e.origin !== location.origin) return;
  if (d.type === "aw-peek") { document.documentElement.classList.toggle("peek", !!d.on); return; }
  if (d.type !== "aw-open-sr" || !d.seq) return;
  const seq = String(d.seq), found = !!regBySeq[seq];
  try { localStorage.removeItem(STORE + "-open"); } catch (x) {}
  try { e.source.postMessage({ type: "aw-open-sr-ok", seq, found }, e.origin); } catch (x) {}
  if (!found) { toast(`SR ${seq} is not in this PC's register yet. Sync, then try again.`); return; }
  document.documentElement.classList.toggle("peek", !!d.peek);
  ui.open = null; openSR(seq);
});

/* ---------- Start ---------- */
renderSyncbar();
render();
takeOpenRequest();
adoptSignin().catch(() => false).then(fresh => { if (fresh && ui.view === "settings") ui.view = "register"; // the first draw sent an unconnected page to Settings
  renderSyncbar(); render(); if (state.cfg.url && state.cfg.key) syncNow(); });
</script>
