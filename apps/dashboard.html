<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
/* Dashboard: the survey unit's targets and accomplishments, and the status of open work when it opens.
   Part of the Survey Unit panel (same look). Figures come from the Sheets through backend/unit_hub.gs (?app=dash);
   the last figures stay on this device for offline reading. */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#17181a; --muted:#6b6e73; --line:#e3e1dc; --hover:#f0eee9; --field:#ffffff;
  --accent:#b8860b; --accent-ink:#ffffff; --accent-soft:#f7efd9;
  --ok:#1d7a43; --ok-bg:#e3f2e8; --bad:#b3261e; --bad-bg:#fbe7e4; --warn:#8f5b00; --warn-bg:#fbf0d9; --info:#2f5fa8; --info-bg:#e6eefa;
  --track:#ebe8e1;
  --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-lg:0 16px 40px rgba(0,0,0,.2);
  --font:"Inter","IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  --r:10px; --gap-l:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e0f10; --panel:#17181a; --ink:#ececea; --muted:#9a9c9f; --line:#2a2c2f; --hover:#1f2023; --field:#121315;
  --accent:#e0b03c; --accent-ink:#17130a; --accent-soft:#2a230f;
  --ok:#5fcf8c; --ok-bg:#14271b; --bad:#f2877d; --bad-bg:#331714; --warn:#e3b24f; --warn-bg:#2e2310; --info:#8db4f0; --info-bg:#16213a;
  --track:#25272a;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e0f10; --panel:#17181a; --ink:#ececea; --muted:#9a9c9f; --line:#2a2c2f; --hover:#1f2023; --field:#121315;
  --accent:#e0b03c; --accent-ink:#17130a; --accent-soft:#2a230f;
  --ok:#5fcf8c; --ok-bg:#14271b; --bad:#f2877d; --bad-bg:#331714; --warn:#e3b24f; --warn-bg:#2e2310; --info:#8db4f0; --info-bg:#16213a;
  --track:#25272a;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.6); color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);min-height:100vh}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:14px var(--gap-l) 12px;flex-wrap:wrap}
.hrow h1{font-size:18px;margin:0;letter-spacing:-.01em}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)} .dot.err{background:var(--bad)}
main{padding:var(--gap-l);max-width:1180px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
.btn[hidden]{display:none}
.banner{padding:12px 14px;border-radius:var(--r);margin-bottom:var(--gap-l);border:1px solid var(--bad);background:var(--bad-bg)}
.banner b{display:block}
.empty{padding:32px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--hover);color:var(--muted);white-space:nowrap}
.pill.pending{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
h2.sec{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec:first-child{margin-top:0}
h2.sec .grow{flex:1}
.asof{font-size:12.5px;color:var(--muted);margin:-4px 0 16px}
/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:26px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.2}
.tile .s{font-size:12px;color:var(--muted)}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)} .tile.ok .v{color:var(--ok)}
/* Targets */
.tgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.tg.edit{cursor:pointer}
.tg.edit:hover{border-color:var(--accent)}
.tg .top{display:flex;gap:10px;align-items:baseline}
.tg .t{font-weight:600;flex:1;min-width:0}
.tg .pct{font-family:var(--mono);font-weight:600;font-size:15px}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden;margin:10px 0 8px;position:relative}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar i.ok{background:var(--ok)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.7}
.tg .m{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tg .m .num{color:var(--ink)}
.tg.off{opacity:.55}
/* Two columns */
.cols{display:grid;grid-template-columns:3fr 2fr;gap:var(--gap-l)}
.cols>div{min-width:0}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tbl td.num.bad{color:var(--bad);font-weight:600}
.tbl td.num.z{color:var(--muted)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.li:last-child{border-bottom:0}
.li .d{width:92px;flex:none;font-weight:600;font-size:13px}
.li .x{min-width:0;flex:1}
.li .x div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .x .m{font-size:12.5px;color:var(--muted)}
.rss{display:flex;gap:10px;flex-wrap:wrap}
.rss .tile{flex:1;min-width:130px}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.scrim[hidden],.drawer[hidden]{display:none}
.dhead{display:flex;align-items:center;gap:10px;padding:14px var(--gap-l);border-bottom:1px solid var(--line);background:var(--panel)}
.dhead h2{margin:0;font-size:16px}
.dbody{flex:1;overflow:auto;padding:var(--gap-l)}
.dfoot{display:flex;gap:8px;padding:12px var(--gap-l);border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap;align-items:center}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;background:var(--field);padding:8px 10px;font-size:14px;font-weight:400;width:100%}
label.f textarea{min-height:60px;resize:vertical}
label.f[hidden]{display:none}
.hint{font-weight:400;color:var(--muted);font-size:12px}
.ferr{color:var(--bad);font-size:13px;width:100%}
.ferr:empty{display:none}
.hist{font-size:12.5px;border-left:2px solid var(--line);padding-left:12px;margin-top:14px}
.hist div{margin-bottom:6px}
.setup{max-width:520px}
.setup .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.setup label.f{flex:1;min-width:200px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-weight:500;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
@media (max-width:980px){ .tiles{grid-template-columns:repeat(3,minmax(0,1fr))} .cols{grid-template-columns:1fr} }
@media (max-width:720px){
  .hrow,main{padding-left:16px;padding-right:16px}
  .sync{margin-left:0;width:100%}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile .v{font-size:22px}
  .tgs{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .tbl .hide-s{display:none}
  .tbl th{white-space:normal;padding:8px 6px}
  .tbl td{padding:8px 6px}
  .li .d{width:74px}
}
</style>
</head>
<body>
<header class="top">
  <div class="hrow">
    <h1>Dashboard</h1>
    <div class="sync"><span class="dot" id="sDot"></span><span id="sText">Not connected</span>
      <button class="btn sm" id="syncBtn">Refresh</button></div>
  </div>
</header>
<main id="main"></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="dTitle" role="dialog">
  <div class="dhead"><div><h2 id="dTitle">Target</h2><div class="muted" id="dSub" style="font-size:12.5px"></div></div><span style="flex:1"></span><button class="btn ghost sm" id="dClose">Close</button></div>
  <form class="dbody" id="form" novalidate>
    <div class="fgrid">
      <label class="f full"><span>What is the target?</span><input name="title" maxlength="200" placeholder="e.g. Landholdings surveyed (New Lands)"></label>
      <label class="f"><span>Counted in <span class="hint">(word for one)</span></span><input name="measure" maxlength="40" placeholder="e.g. LH, lots, ha, SR"></label>
      <label class="f"><span>Target number</span><input name="target" inputmode="numeric" maxlength="6" placeholder="e.g. 120"></label>
      <label class="f"><span>Period</span><select name="ptype"><option value="y">Whole year</option><option value="q">Quarter</option><option value="m">Month</option></select></label>
      <label class="f"><span>Year</span><select name="pyear"></select></label>
      <label class="f full" id="fPart" hidden><span id="fPartLbl">Quarter</span><select name="ppart"></select></label>
      <label class="f full"><span>How "done" is counted</span><select name="source"></select></label>
      <label class="f full" id="fFilter" hidden><span id="fFilterLbl">Only</span><select name="filter"></select></label>
      <label class="f full" id="fManual"><span>Done so far</span><input name="manual_done" inputmode="numeric" maxlength="6" placeholder="0"></label>
      <label class="f"><span>Person in charge <span class="hint">(optional)</span></span><select name="owner"></select></label>
      <label class="f"><span>Show on the dashboard</span><select name="active"><option value="yes">Yes</option><option value="no">No (kept, hidden from figures)</option></select></label>
      <label class="f full"><span>Notes</span><textarea name="notes" maxlength="1000" placeholder="e.g. Based on the 2026 Work and Financial Plan"></textarea></label>
    </div>
    <div id="dHist"></div>
  </form>
  <div class="dfoot">
    <div class="ferr" id="fErr" role="alert"></div>
    <button class="btn primary" id="fSave">Save</button>
    <button class="btn" id="fCancel">Cancel</button>
    <span style="flex:1"></span>
    <button class="btn" id="fHist" hidden>History</button>
  </div>
</aside>
<div class="toast" id="toast" hidden role="status"></div>

<script>
"use strict";
const APP = "dash", LS = "dash.v1";
const FIELDS = ["period", "title", "measure", "target", "source", "filter", "manual_done", "owner", "notes", "active"];
const SOURCES = { manual: "Typed in by the head", desk_done: "Unit Desk: items marked Done or Filed", desk_out: "Unit Desk: outgoing documents sent",
  rss_complete: "RSS Verification Desk: RSS marked Complete", cal_done: "Calendar: activities marked Done" };
const KINDS = ["Task", "Document"];
const ACTIVITIES = ["Field survey", "Relocation survey", "Ocular inspection", "Verification", "Meeting", "Training", "Other"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const fmtTime = iso => iso ? new Date(iso).toLocaleString("en-PH", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const fmtDay = s => new Date(s + "T00:00:00").toLocaleDateString("en-PH", { weekday: "short", month: "short", day: "numeric" });
const nf = n => Number(n || 0).toLocaleString("en-PH");
function periodLabel(p) {
  const m = /^(\d{4})(?:-(Q[1-4]|\d{2}))?$/.exec(p || ""); if (!m) return p || "";
  return !m[2] ? m[1] : m[2][0] === "Q" ? m[2] + " " + m[1] : MONTHS[+m[2] - 1] + " " + m[1];
}
function periodRange(p) {
  const m = /^(\d{4})(?:-(Q[1-4]|\d{2}))?$/.exec(p || ""); if (!m) return null;
  let a = 1, b = 12; if (m[2] && m[2][0] === "Q") { a = (+m[2][1] - 1) * 3 + 1; b = a + 2; } else if (m[2]) a = b = +m[2];
  return [m[1] + "-" + pad(a) + "-01", ymd(new Date(+m[1], b, 0))];
}
// Share of the period already gone, for the "where we should be by now" mark on each bar.
function elapsed(p) {
  const r = periodRange(p); if (!r) return null;
  const a = new Date(r[0] + "T00:00:00").getTime(), b = new Date(r[1] + "T23:59:59").getTime(), n = Date.now();
  return n <= a ? 0 : n >= b ? 1 : (n - a) / (b - a);
}

function awSignin(url, key) {
  try {
    if (url !== undefined) localStorage.setItem("aw.signin", JSON.stringify({ url: url, key: key }));
    return JSON.parse(localStorage.getItem("aw.signin") || "null");
  } catch (e) { return null; }
}
function blank() { return { cfg: { url: "", key: "", device: "" }, me: null, people: [], targets: {}, figures: null, outbox: [], problems: [], lastSync: "", seq: 0 }; }
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) { s = null; }
  s = Object.assign(blank(), s || {});
  if (!s.cfg.device) s.cfg.device = (/Mobi|Android/i.test(navigator.userAgent) ? "PHONE-" : "PC-") + Math.random().toString(36).slice(2, 7).toUpperCase();
  const si = awSignin();
  if (si) { if (si.url) s.cfg.url = si.url; s.cfg.key = si.key || ""; }
  return s;
}
let state = load(), storeOk = true;
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); storeOk = true; } catch (e) { storeOk = false; } }
const keyOf = t => t.id || t.tmp;
const pending = k => state.outbox.some(o => (o.id || o.tmp) === k);
const boss = () => !!state.me && (state.me.role === "head" || state.me.role === "admin");

const okAddr = u => /^https:\/\/script\.google\.com\/(a\/macros\/[\w.-]+|macros)\/s\/[\w-]+\/(exec|dev)$/.test(String(u || "")) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(String(u || ""));
let syncing = false, again = false, online = navigator.onLine, lastError = "";
async function call(method, payload) {
  const u = state.cfg.url;
  if (!okAddr(u)) throw new Error("The web app address is not a Google Apps Script address");
  let r;
  if (method === "GET") r = await fetch(u + (u.includes("?") ? "&" : "?") + new URLSearchParams(Object.assign({ key: state.cfg.key, app: APP }, payload)), { redirect: "follow" });
  else r = await fetch(u, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ key: state.cfg.key, device: state.cfg.device, app: APP }, payload)) });
  const j = await r.json();
  if (!j.ok) throw Object.assign(new Error(j.error || "The Sheet refused the request"), { server: true });
  return j;
}
async function sync(quiet) {
  if (!state.cfg.url || !state.cfg.key) { render(); return; }
  if (syncing) { again = true; return; }
  syncing = true; again = false; renderSync();
  try {
    if (state.outbox.length) {
      const sent = state.outbox.slice(), revs = sent.map(o => o.rev);
      const res = await call("POST", { changes: sent.map(o => ({ type: "save", id: o.id, tmp: o.tmp, baseVersion: o.baseVersion, data: o.data })) });
      res.results.forEach((r, i) => {
        const o = sent[i], k = o.id || o.tmp, changedSince = state.outbox.includes(o) && o.rev !== revs[i];
        if (!changedSince) state.outbox = state.outbox.filter(x => x !== o);
        if (r.result === "saved" || r.result === "same") {
          if (o.tmp) delete state.targets[o.tmp];
          state.targets[r.id] = r.record;
          if (changedSince) { o.id = r.id; o.tmp = ""; o.baseVersion = r.record.version; Object.assign(state.targets[r.id], o.data); }
        } else {
          if (r.server) state.targets[r.server.id] = r.server; else if (o.tmp) delete state.targets[o.tmp];
          state.problems.push({ what: o.data.title || k, error: r.result === "conflict" ? "Someone changed this target first; the Sheet's copy is showing now. Open it and save again." : r.error });
        }
      });
      save();
    }
    const p = await call("GET", { action: "pull" });
    if (state.me && state.me.name !== p.me.name) state.targets = {};
    state.me = p.me; state.people = p.people || []; state.figures = p.figures;
    const keep = {};
    Object.values(state.targets).forEach(t => { if (pending(keyOf(t))) keep[keyOf(t)] = t; });
    state.targets = {}; (p.targets || []).forEach(t => { state.targets[t.id] = t; }); Object.assign(state.targets, keep);
    state.lastSync = p.server_time; lastError = ""; online = true; save();
  } catch (e) {
    lastError = e.server ? e.message : "";
    if (!e.server) online = false;
    if (!quiet && e.server) toast(e.message);
  } finally {
    syncing = false; render();
    if (again) setTimeout(() => sync(true), 0);
  }
}

/* ---------- Rendering ---------- */
function renderSync() {
  const n = state.outbox.length;
  let c = "", text;
  if (!state.cfg.url || !state.cfg.key) text = "Not signed in";
  else if (syncing) { c = "on"; text = "Reading the Sheets…"; }
  else if (lastError) { c = "err"; text = lastError; }
  else if (!online) { c = "off"; text = "Offline · figures as of " + (fmtTime(state.lastSync) || "—") + (n ? " · " + n + " change(s) waiting" : ""); }
  else { c = "on"; text = (state.me ? state.me.name + " · " : "") + "as of " + fmtTime(state.lastSync); }
  if (!storeOk) { c = "err"; text = "This browser is not keeping data on the device."; }
  $("sDot").className = "dot " + c; $("sText").textContent = text;
  $("syncBtn").disabled = syncing || !state.cfg.url || !state.cfg.key;
}
function tile(k, v, s, tone) { return `<div class="tile ${tone || ""}"><div class="k">${esc(k)}</div><div class="v">${v == null ? "—" : nf(v)}</div>${s ? `<div class="s">${esc(s)}</div>` : ""}</div>`; }
function render() {
  renderSync();
  if (!state.cfg.url || !state.cfg.key) {
    $("main").innerHTML = `<section class="setup"><h2 class="sec">Sign in</h2><p class="muted">Sign in once from the panel (top right), or here. Same web app address and key as every Survey Unit app.</p>
      <div class="row"><label class="f"><span>Web app address</span><input id="cUrl" value="${esc(state.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label class="f" style="max-width:200px"><span>Your key</span><input id="cKey" value="${esc(state.cfg.key)}" placeholder="ABCDE-12345" autocomplete="off"></label>
      <button class="btn primary" id="cSave">Sign in</button></div></section>`;
    return;
  }
  const f = state.figures;
  if (!f) { $("main").innerHTML = `<div class="empty"><b>${online ? "Reading the Sheets…" : "No figures on this device yet"}</b>${online ? "" : "Open the dashboard once while online."}</div>`; return; }
  const d = f.desk, mon = new Date(f.today + "T00:00:00").toLocaleDateString("en-PH", { month: "long" });
  let h = state.problems.length ? `<div class="banner" role="alert"><b>${state.problems.length} target change(s) not saved</b>${state.problems.map(p => `<div>${esc(p.what)}: ${esc(p.error)}</div>`).join("")}<button class="btn sm" id="dismiss" style="margin-top:8px">Dismiss</button></div>` : "";
  h += `<h2 class="sec">Open work now</h2><p class="asof">Unit Desk, ${esc(fmtTime(state.lastSync))}${online ? "" : " (offline copy)"}</p>
    <div class="tiles">${tile("Open", d.open, d.waiting ? d.waiting + " waiting on others" : "")}${tile("Overdue", d.overdue, "past the due date", d.overdue ? "bad" : "")}
      ${tile("Urgent", d.urgent, "open, priority Urgent", d.urgent ? "warn" : "")}${tile("Due in 7 days", d.due_week, "")}
      ${tile("Unassigned", d.unassigned, "open, no one on it", d.unassigned ? "warn" : "")}${tile("Done in " + mon, d.done_month, d.in_month + " in · " + d.out_month + " out this month", "ok")}</div>`;
  h += targetsHtml(f);
  h += `<div class="cols"><div><h2 class="sec">Work per member</h2>${membersHtml(f)}${lateHtml(d)}</div><div><h2 class="sec">Next 14 days</h2>${nextHtml(f.cal)}${rssHtml(f.rss)}</div></div>`;
  $("main").innerHTML = h;
}
function targetsHtml(f) {
  const ts = Object.values(state.targets).sort((a, b) => (a.active === "no") - (b.active === "no") || String(b.period).localeCompare(String(a.period)) || String(a.title).localeCompare(String(b.title)));
  const shown = ts.filter(t => t.active !== "no" || showOff);
  const card = t => {
    const pr = f.progress[t.id], done = t.source === "manual" ? Number(t.manual_done) || 0 : pr ? pr.done : null, goal = Number(t.target) || 0;
    const pct = done == null || !goal ? null : Math.round(100 * done / goal), el = elapsed(t.period), k = keyOf(t);
    const behind = pct != null && el != null && el > 0 && el < 1 && done / goal < el - 0.1;
    return `<div class="tg${boss() ? " edit" : ""}${t.active === "no" ? " off" : ""}" ${boss() ? `data-tg="${esc(k)}" tabindex="0" role="button"` : ""}>
      <div class="top"><div class="t">${esc(t.title)}</div><div class="pct">${pct == null ? "—" : pct + "%"}</div></div>
      <div class="bar"><i class="${pct >= 100 ? "ok" : ""}" style="width:${Math.min(100, pct || 0)}%"></i>${el != null && el > 0 && el < 1 ? `<b style="left:${(el * 100).toFixed(1)}%" title="Share of the period gone by"></b>` : ""}</div>
      <div class="m"><span><span class="num">${done == null ? "—" : nf(done)}</span> of <span class="num">${nf(goal)}</span> ${esc(t.measure || "")}</span><span>${esc(periodLabel(t.period))}</span>
        ${t.owner ? `<span>${esc(t.owner)}</span>` : ""}${behind ? '<span class="pill warn">Behind pace</span>' : pct >= 100 ? '<span class="pill ok">Reached</span>' : ""}
        ${pending(k) ? '<span class="pill pending">Not sent yet</span>' : ""}${t.active === "no" ? '<span class="pill">Hidden</span>' : ""}</div>
      <div class="m" style="margin-top:2px">${esc(SOURCES[t.source] || t.source)}${t.filter ? " · " + esc(t.filter) : ""}${done == null && t.source === "rss_complete" ? " · RSS Desk not set up" : ""}</div></div>`;
  };
  const off = ts.length - ts.filter(t => t.active !== "no").length;
  return `<h2 class="sec">Targets and accomplishments<span class="grow"></span>${off && boss() ? `<button class="btn sm ghost" id="showOff">${showOff ? "Hide" : "Show"} ${off} hidden</button>` : ""}${boss() ? '<button class="btn sm primary" id="newTg">Add target</button>' : ""}</h2>
    ${shown.length ? `<div class="tgs">${shown.map(card).join("")}</div><p class="asof" style="margin-top:8px">The thin mark on each bar is how much of the period has gone by. "Behind pace" means more than 10 points under it.</p>`
      : `<div class="empty"><b>No targets yet</b>${boss() ? "Add the unit's targets for the year, a quarter or a month. Done is counted from Unit Desk, the RSS Desk or the calendar, or typed in." : "The head sets the unit's targets here."}</div>`}`;
}
let showOff = false;
function membersHtml(f) {
  const rows = f.members.filter(m => m.role !== "admin" || m.open || m.done_month).sort((a, b) => b.overdue - a.overdue || b.open - a.open || a.name.localeCompare(b.name));
  if (!rows.length) return `<div class="empty">No members yet.</div>`;
  const z = (n, bad) => `<td class="num${n ? (bad ? " bad" : "") : " z"}">${n}</td>`;
  return `<table class="tbl"><thead><tr><th>Member</th><th class="num">Open</th><th class="num">Overdue</th><th class="num hide-s">Urgent</th><th class="num">Done this month</th></tr></thead><tbody>
    ${rows.map(m => `<tr><td>${esc(m.name)}${m.role !== "member" ? ` <span class="muted">${esc(m.role)}</span>` : ""}</td>${z(m.open)}${z(m.overdue, true)}<td class="num hide-s${m.urgent ? "" : " z"}">${m.urgent}</td>${z(m.done_month)}</tr>`).join("")}</tbody></table>`;
}
function lateHtml(d) {
  if (!d.late || !d.late.length) return "";
  return `<h2 class="sec">Overdue</h2><div class="list">${d.late.map(x => `<div class="li"><div class="d" style="color:var(--bad)">${esc(fmtDay(x.due))}</div><div class="x"><div>${esc(x.subject)}</div>
    <div class="m">${esc(x.id)} · ${esc(x.assigned_to || "Unassigned")}${x.priority === "Urgent" ? " · Urgent" : ""}</div></div></div>`).join("")}</div>`;
}
function nextHtml(c) {
  if (!c || !c.next.length) return `<div class="empty">No activities in the next 14 days.</div>`;
  return `<div class="list">${c.next.map(v => `<div class="li"><div class="d">${esc(fmtDay(v.start))}</div><div class="x"><div>${esc(v.title)}</div>
    <div class="m">${esc(v.activity)}${v.place ? " · " + esc(v.place) : ""}${v.personnel ? " · " + esc(v.personnel) : ""}</div></div><span class="pill">${esc(v.status)}</span></div>`).join("")}</div>`;
}
function rssHtml(r) {
  if (!r) return "";
  if (r.error) return `<h2 class="sec">RSS verification</h2><div class="empty">Could not read the RSS Desk: ${esc(r.error)}</div>`;
  const b = r.by;
  return `<h2 class="sec">RSS verification</h2><div class="rss">${tile("In register", r.register)}${tile("Complete", b.Complete, r.complete_month + " this month", "ok")}
    ${tile("Ongoing", b["Ongoing Verification"])}${tile("Returned", b["Returned for compliance"], "for compliance", b["Returned for compliance"] ? "warn" : "")}</div>`;
}

/* ---------- Target drawer ---------- */
let editing = null;
function fill(sel, opts, val) { sel.innerHTML = opts.map(o => `<option value="${esc(o[0])}"${o[0] === val ? " selected" : ""}>${esc(o[1])}</option>`).join(""); }
function openDrawer(t) {
  const y = new Date().getFullYear();
  editing = t ? Object.assign({}, t) : { tmp: "tmp-" + state.cfg.device + "-" + Date.now().toString(36), version: 0, period: String(y), source: "manual", manual_done: "0", active: "yes", target: "" };
  const e = editing, f = $("form"), m = /^(\d{4})(?:-(Q[1-4]|\d{2}))?$/.exec(e.period) || [0, String(y)];
  f.elements.title.value = e.title || ""; f.elements.measure.value = e.measure || ""; f.elements.target.value = e.target || "";
  f.elements.ptype.value = !m[2] ? "y" : m[2][0] === "Q" ? "q" : "m";
  fill(f.elements.pyear, [y - 1, y, y + 1].concat(+m[1] < y - 1 || +m[1] > y + 1 ? [+m[1]] : []).map(v => [String(v), String(v)]), m[1]);
  f.dataset.part = m[2] || "";
  fill(f.elements.source, Object.keys(SOURCES).map(k => [k, SOURCES[k]]), e.source);
  f.elements.manual_done.value = e.manual_done || "0";
  fill(f.elements.owner, [["", "No one in particular"]].concat(state.people.map(p => [p.name, p.name])), e.owner || "");
  f.elements.active.value = e.active || "yes"; f.elements.notes.value = e.notes || "";
  f.dataset.filter = e.filter || "";
  $("dTitle").textContent = t ? "Edit target" : "New target"; $("dSub").textContent = t ? (t.id || "Not sent yet") : "";
  $("fErr").textContent = ""; $("dHist").innerHTML = ""; $("fHist").hidden = !(t && t.id);
  formView();
  $("scrim").hidden = $("drawer").hidden = false; f.elements.title.focus();
}
function formView() {
  const f = $("form"), pt = f.elements.ptype.value, src = f.elements.source.value;
  $("fPart").hidden = pt === "y"; $("fPartLbl").textContent = pt === "q" ? "Quarter" : "Month";
  const cur = f.elements.ppart.value || f.dataset.part;
  if (pt === "q") fill(f.elements.ppart, ["Q1", "Q2", "Q3", "Q4"].map(q => [q, q + " (" + MONTHS[(+q[1] - 1) * 3].slice(0, 3) + "–" + MONTHS[(+q[1] - 1) * 3 + 2].slice(0, 3) + ")"]), /^Q/.test(cur) ? cur : "Q" + (Math.floor(new Date().getMonth() / 3) + 1));
  if (pt === "m") fill(f.elements.ppart, MONTHS.map((n, i) => [pad(i + 1), n]), /^\d{2}$/.test(cur) ? cur : pad(new Date().getMonth() + 1));
  $("fManual").hidden = src !== "manual";
  const fl = src === "desk_done" ? KINDS : src === "cal_done" ? ACTIVITIES : null;
  $("fFilter").hidden = !fl;
  if (fl) { $("fFilterLbl").textContent = src === "desk_done" ? "Count only" : "Count only activity"; fill(f.elements.filter, [["", src === "desk_done" ? "Tasks and documents" : "Every activity"]].concat(fl.map(x => [x, x])), fl.includes(f.dataset.filter) ? f.dataset.filter : ""); }
}
function closeDrawer() { $("scrim").hidden = $("drawer").hidden = true; editing = null; }
function saveDrawer() {
  const f = $("form"), pt = f.elements.ptype.value, d = {};
  d.title = f.elements.title.value.trim(); d.measure = f.elements.measure.value.trim(); d.target = f.elements.target.value.trim();
  d.period = f.elements.pyear.value + (pt === "y" ? "" : "-" + f.elements.ppart.value);
  d.source = f.elements.source.value; d.filter = $("fFilter").hidden ? "" : f.elements.filter.value;
  d.manual_done = d.source === "manual" ? (f.elements.manual_done.value.trim() || "0") : "";
  d.owner = f.elements.owner.value; d.active = f.elements.active.value; d.notes = f.elements.notes.value.trim();
  const err = !d.title ? "Type what the target is." : !/^\d{1,6}$/.test(d.target) || +d.target < 1 ? "Target must be a whole number, 1 or more." : d.source === "manual" && !/^\d{1,6}$/.test(d.manual_done) ? "Done so far must be a whole number." : "";
  if (err) { $("fErr").textContent = err; return; }
  const k = keyOf(editing), o = state.outbox.find(x => (x.id || x.tmp) === k);
  if (o) { o.data = d; o.rev++; } else state.outbox.push({ id: editing.id || "", tmp: editing.id ? "" : editing.tmp, baseVersion: Number(editing.version) || 0, data: d, rev: 1 });
  state.targets[k] = Object.assign({}, editing, d);
  save(); closeDrawer(); render(); sync(true);
}
async function showHistory() {
  if (!editing || !editing.id) return;
  try {
    const h = await call("GET", { action: "history", id: editing.id });
    $("dHist").innerHTML = `<div class="hist">${h.history.map(x => `<div><b>v${x.version}</b> ${esc(fmtTime(x.time))} · ${esc(x.by)}<br><span class="muted">${esc(Object.entries(JSON.parse(x.changed || "{}")).map(a => a[0] + ": " + a[1]).join(", "))}</span></div>`).join("") || "No history."}</div>`;
  } catch (e) { toast("History needs a connection."); }
}

/* ---------- Events ---------- */
let toastT;
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3200); }
$("syncBtn").onclick = () => sync(false);
$("scrim").onclick = closeDrawer; $("dClose").onclick = closeDrawer; $("fCancel").onclick = closeDrawer;
$("fSave").onclick = saveDrawer; $("fHist").onclick = showHistory;
$("form").addEventListener("submit", e => { e.preventDefault(); saveDrawer(); });
$("form").addEventListener("change", e => { if (["ptype", "source"].includes(e.target.name)) formView(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("drawer").hidden) closeDrawer(); });
$("main").addEventListener("click", e => {
  const tg = e.target.closest("[data-tg]"); if (tg) return openDrawer(state.targets[tg.dataset.tg]);
  if (e.target.id === "newTg") return openDrawer(null);
  if (e.target.id === "showOff") { showOff = !showOff; return render(); }
  if (e.target.id === "dismiss") { state.problems = []; save(); return render(); }
  if (e.target.id === "cSave") {
    const url = $("cUrl").value.trim();
    if (!okAddr(url)) return toast("That is not a Google Apps Script web app address. It looks like https://script.google.com/macros/s/…/exec");
    state.cfg.url = url; state.cfg.key = $("cKey").value.trim().toUpperCase(); lastError = ""; save(); awSignin(state.cfg.url, state.cfg.key); sync(false);
  }
});
$("main").addEventListener("keydown", e => { const tg = e.target.closest("[data-tg]"); if (tg && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDrawer(state.targets[tg.dataset.tg]); } });
window.addEventListener("message", e => { if (e.data && e.data.type === "aw-theme") { if (e.data.theme) document.documentElement.dataset.theme = e.data.theme; else delete document.documentElement.dataset.theme; } });
window.addEventListener("online", () => { online = true; sync(true); });
window.addEventListener("offline", () => { online = false; renderSync(); });
window.addEventListener("storage", e => { if (e.key === "aw.signin") { const s = awSignin(); if (s && (s.key !== state.cfg.key || s.url !== state.cfg.url)) { state = load(); sync(true); } } });
// Figures are read again every 5 minutes while on screen, and whenever the dashboard is opened again.
setInterval(() => { if (!document.hidden && window.innerWidth > 0) sync(true); }, 300000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(true); });
let wasHidden = window.innerWidth === 0;
window.addEventListener("resize", () => { const h = window.innerWidth === 0; if (wasHidden && !h) sync(true); wasHidden = h; });
save(); render(); sync(true);
</script>
<script id="aw-tt-loader">/* Sort, filter and search on every table (fx/table-tools.js). The panel also adds it; it runs once. Skipped on the Apps Script copies, which have no fx folder. */(function(){if(/google/.test(location.hostname))return;var s=document.createElement("script");s.src="fx/table-tools.js";document.head.appendChild(s);})();</script>
</body>
</html>
